  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1a1d21; --sub: #616770;

      --bg: #15171a; --card: #1f2226; --text: #e8eaed; --sub: #9aa2ab;

  * { box-sizing: border-box; }

    margin: 0; background: var(--bg); color: var(--text);

  /* ステータスカード */

    background: var(--card); border: 1px solid var(--border); border-radius: 14px;

  .result-banner { font-size: 14.5px; font-weight: 700; border-radius: 10px; padding: 10px 14px; margin-top: 12px; display: none; }

  .askBtn { margin-top: 10px; border: 1px solid var(--accent); color: var(--accent); background: none;
    border-radius: 8px; padding: 8px 14px; font-size: 13px; cursor: pointer; font-family: inherit; }
  #lesson { background: var(--card); border: 2px solid var(--gold); border-radius: 14px;
    padding: 16px; margin-bottom: 16px; }
  #lesson .ltag { display: inline-block; font-size: 12px; color: var(--gold);
    background: var(--gold-soft); border-radius: 999px; padding: 1px 10px; margin-bottom: 8px; font-weight: 800; }
  #lesson h2 { font-size: 16px; margin: 0 0 8px; }
  #lesson .lbody { font-size: 14.5px; line-height: 1.85; }

  #deployBtn { display: block; width: 100%; margin-top: 14px; background: var(--accent); color: #fff;

    cursor: pointer; font-family: inherit; }
  #gradeBtn { position: fixed; left: 50%; transform: translateX(-50%); bottom: 20px;
    background: var(--accent); color: #fff; border: none; border-radius: 999px;

    box-shadow: 0 4px 14px rgba(0,0,0,.25); font-family: inherit; }

  #summary { display: none; background: var(--card); border: 2px solid var(--accent);
    border-radius: 14px; padding: 18px; margin: 20px 0; }

  #summary .score { font-size: 32px; font-weight: 800; color: var(--accent); }
  #summary .gains { margin: 10px 0; font-size: 14.5px; }

  #summary .drop { background: var(--gold-soft); color: var(--gold); border-radius: 10px;
    padding: 10px 14px; margin: 10px 0; font-weight: 700; display: none; }
  #summary .record { margin-top: 10px; font-size: 13px; color: var(--sub); }
  #copyBtn { margin-top: 8px; border: 1px solid var(--accent); color: var(--accent); background: none;
    border-radius: 8px; padding: 8px 16px; font-size: 14px; cursor: pointer; font-family: inherit; }
  @keyframes pop { 0% { transform: scale(.7); opacity: 0; } 60% { transform: scale(1.08); } 100% { transform: scale(1); opacity: 1; } }
  .result-banner.ok, .result-banner.ng { animation: pop .35s ease; }

<script>
const QUIZ = {"date": "2026-11-02", "weekday": "月", "quiz_id": "2026-11-02", "game": {"level": 2, "xp": 110, "xp_next": 300, "streak": 1, "stats": [{"subject": "労基", "rank": "C", "note": "2/5"}, {"subject": "安衛", "rank": "－", "note": "0/0"}, {"subject": "労災", "rank": "C", "note": "1/3"}, {"subject": "雇用", "rank": "B", "note": "2/3"}, {"subject": "徴収", "rank": "C", "note": "0/1"}, {"subject": "労一", "rank": "－", "note": "0/0"}, {"subject": "社一", "rank": "－", "note": "0/0"}, {"subject": "健保", "rank": "B", "note": "2/4"}, {"subject": "国年", "rank": "C", "note": "1/5"}, {"subject": "厚年", "rank": "C", "note": "1/4"}], "cursed": [{"item": "年金の兜", "subject": "国年"}, {"item": "労災の盾", "subject": "労災"}, {"item": "十年の篭手", "subject": "厚年"}, {"item": "保険者の帯", "subject": "健保"}, {"item": "成立の足枷", "subject": "徴収"}, {"item": "移送の靴", "subject": "健保"}, {"item": "認定日の指輪", "subject": "国年"}, {"item": "報酬の鎧", "subject": "厚年"}], "drop_on_perfect": {"emoji": "🤝", "name": "団結の腕章"}}, "lesson": {"no": 31, "subject": "労一", "topic": "労働組合法・労働関係調整法", "body": "# 第31回講義：労働に関する一般常識「労働組合法・労働関係調整法」\n\n## この制度は何のためにあるか\n\n1人の労働者が会社と賃金を交渉しても、立場の差は埋まらない。そこで憲法28条は**団結権・団体交渉権・団体行動権（労働三権）**を保障し、それを具体化したのが**労働組合法**（労組法）である。目的は、労働者が使用者と**対等の立場**に立つことを促進して**地位を向上**させ、自主的な**団結を擁護**し、**労働協約**を結ぶための**団体交渉**とその手続を**助成**すること（労組法1条1項）。\n一方、交渉がこじれてストライキなどの**労働争議**になったとき、労働委員会が間に入って解決を助ける手続を定めたのが**労働関係調整法**（労調法）。目的は、労組法と相俟って労働関係の公正な調整を図り、**労働争議を予防・解決**して**産業の平和**を維持し、**経済の興隆**に寄与すること（労調法1条）。\n\n## 条文の中身（ここが出る）\n\n### ① 労働組合とは（労組法2条・5条）\n- 「労働組合」とは、**労働者が主体**となって**自主的に**労働条件の維持改善その他経済的地位の向上を図ることを**主たる目的**として組織する団体またはその連合団体（2条）。\n- ただし次のものは労組法上の労働組合ではない（2条ただし書）：①**使用者の利益を代表する者**の参加を許すもの、②運営経費について使用者の**経理上の援助**を受けるもの、③**共済事業その他福利事業のみ**を目的とするもの、④主として**政治運動又は社会運動**を目的とするもの。\n- ⚠️ひっかけ①：経理上の援助の例外として、**勤務時間中の協議・交渉で賃金を失わないこと**、**福利基金への寄附**、**最小限の広さの事務所の供与**は「援助」に当たらない（2条2号ただし書）。\n- 組合が労働委員会の手続に参与し救済を受けるには、2条と5条2項（規約の必要記載事項）に適合することを**労働委員会に立証**しなければならない（5条1項）。規約には「**総会は少なくとも毎年1回**開催」「**同盟罷業は直接無記名投票の過半数**による決定を経なければ開始しない」などを含める（5条2項）。\n\n### ② 刑事・民事の免責（労組法1条2項・8条）\n- 正当な団体交渉その他の行為には**刑法35条**（正当行為）が適用される（刑事免責）。ただし**暴力の行使は、いかなる場合も正当な行為と解釈されない**（1条2項ただし書）。\n- 使用者は、**正当な争議行為**で損害を受けても、組合や組合員に**損害賠償を請求できない**（8条＝民事免責）。\n\n### ③ 不当労働行為（労組法7条・27条）\n使用者がしてはならない行為（7条）：\n1. **不利益取扱い**（組合員であること等を理由とする解雇など）と、組合に加入しないこと・脱退することを雇用条件とする**黄犬契約**（1号）\n2. 正当な理由のない**団体交渉の拒否**（2号）\n3. 組合の結成・運営への**支配介入**と**経費援助**（3号）\n4. 労働委員会への申立て・証言等を理由とする**報復的不利益取扱い**（4号）\n- ⚠️ひっかけ②：組合が工場事業場の労働者の**過半数を代表**する場合の**ユニオン・ショップ協定**は、1号ただし書で**不当労働行為に当たらない**。\n- 救済申立ては、行為の日（継続する行為は**その終了した日**）から**1年**を経過すると受け付けられない（27条2項）。都道府県労働委員会の救済命令に不服な使用者は、交付を受けてから**15日以内**に中央労働委員会へ再審査を申し立てられる（27条の15）。取消しの訴えは交付の日から**30日以内**（27条の19）。\n\n### ④ 労働協約（労組法14条〜18条）\n- **書面**に作成し、両当事者が**署名又は記名押印**することで効力を生ずる（14条）。\n- 有効期間は**3年を超えて定められない**。3年超の定めは**3年**とみなす。期間の定めがない協約は、署名又は記名押印した文書で**少なくとも90日前に予告**して解約できる（15条）。\n- 協約の基準に違反する労働契約の部分は**無効**となり、協約の基準による（16条＝規範的効力）。\n- **一般的拘束力**：一の工場事業場に常時使用される**同種の労働者の4分の3以上**が一の協約の適用を受けると、その事業場の他の同種の労働者にも適用される（17条）。地域単位の拡張（18条）は、労働委員会の決議により**厚生労働大臣又は都道府県知事**が決定する。\n- ⚠️ひっかけ③：「2分の1以上」「過半数」「2年を超える」「30日前に予告」はいずれも誤り。\n\n### ⑤ 労働争議の調整（労調法）\n- 調整の3方法：**斡旋**（斡旋員が双方の主張の要点を確かめ解決に努める・13条）、**調停**（調停委員会が**調停案**を作って受諾を勧告・26条）、**仲裁**（**仲裁裁定は労働協約と同一の効力**＝当事者を拘束・34条）。\n- ⚠️ひっかけ④：仲裁は**双方から申請**するか、**労働協約の定め**に基づく申請が必要（30条）。公益事業でも**一方からの申請や職権で仲裁は始まらない**（調停なら公益事業は一方の申請・職権でも可＝18条）。\n- 公益事業で争議行為をするには、**少なくとも10日前**までに労働委員会及び厚生労働大臣又は都道府県知事に通知する（37条）。\n- **緊急調整**は**内閣総理大臣**が中央労働委員会の意見を聴いて決定し、公表の日から**50日間**は争議行為ができない（35条の2・38条）。\n- 工場事業場の**安全保持の施設**の正常な維持・運行を停廃・妨げる行為は、争議行為としてもできない（36条）。\n\n## 覚え方のコツ\n- 労組法の数字は「**協約3年・予告90日・拡張4分の3**」、救済は「**申立て1年・再審査15日・取消訴訟30日**」。\n- 労調法の数字は「**公益10日前・緊急調整50日**」。緊急調整だけは**総理大臣**。\n- 調整の拘束力は **斡旋（話をまとめる）＜調停（案を示す）＜仲裁（裁定に拘束）**。仲裁だけは**一方的に始められない**。\n\n## まとめ3行\n1. 労組法は団結・団交・団体行動を守る法律。使用者の利益代表者の参加・経理援助・福利事業のみ・政治運動主目的の団体は労組法上の組合ではない（2条）。\n2. 不当労働行為は不利益取扱い・団交拒否・支配介入・報復的不利益取扱い（7条）。過半数組合のユニオン・ショップは適法。救済申立ては1年以内（27条）。\n3. 労働協約は書面＋署名・記名押印で効力、上限3年、予告90日、4分の3で一般的拘束力（14〜17条）。労調法は斡旋・調停・仲裁、公益事業は10日前通知、緊急調整は総理大臣・50日。\n\n根拠条文：労働組合法1条〜18条・27条〜27条の19 https://laws.e-gov.go.jp/law/324AC0000000174 ／ 労働関係調整法1条〜38条 https://laws.e-gov.go.jp/law/321AC0000000025\n"}, "questions": [{"no": 1, "subject": "労一", "type": "single", "monster": {"name": "ユニオンショップミミック", "emoji": "🎭"}, "text": "📖 労働組合法2条・7条・27条に関する次の記述のうち、正しいものはどれか。", "choices": ["使用者が労働組合に最小限の広さの事務所を供与することは、経理上の援助に当たるため、その組合は労働組合法上の労働組合と認められない。", "労働組合が特定の工場事業場に雇用される労働者の過半数を代表する場合に、その労働者がその組合の組合員であることを雇用条件とする労働協約を締結することは、不当労働行為に当たらない。", "共済事業その他福利事業のみを目的とする団体であっても、労働者が主体となって自主的に組織するものであれば、労働組合法上の労働組合に該当する。", "労働者が労働委員会に不当労働行為の申立てをしたことを理由としてその労働者を解雇することは、労働組合法7条に掲げる不当労働行為に当たらない。", "労働委員会は、不当労働行為の申立てが、行為の日（継続する行為にあってはその開始の日）から1年を経過した事件に係るものであるときは、これを受けることができない。"], "answer": 1, "explanation": "正しいのはB（労組法7条1号ただし書）。過半数を代表する組合とのユニオン・ショップ協定は不当労働行為に当たらない＝講義の⚠️②。\nA：最小限の広さの事務所の供与は経理上の援助から除かれる（2条2号ただし書）＝講義の⚠️①。\nC：共済事業その他福利事業「のみ」を目的とするものは労働組合でない（2条3号）。\nD：労働委員会への申立て等を理由とする不利益取扱いは7条4号の不当労働行為。\nE：継続する行為は「その終了した日」から1年（27条2項）。\n📌暗記ポイント：救済申立て1年（継続する行為は終了日から）・再審査申立て15日・取消しの訴え30日。", "ref": {"label": "労組法2条・7条・27条", "url": "https://laws.e-gov.go.jp/law/324AC0000000174"}}, {"no": 2, "subject": "労一", "type": "single", "monster": {"name": "キュウジュウニチリッチ", "emoji": "📜"}, "text": "📖 労働協約（労働組合法14条〜17条）に関する次の記述のうち、誤っているものはどれか。", "choices": ["労働協約は、書面に作成し、両当事者が署名し、又は記名押印することによってその効力を生ずる。", "3年を超える有効期間の定めをした労働協約は、3年の有効期間の定めをした労働協約とみなされる。", "労働協約に定める労働条件その他の労働者の待遇に関する基準に違反する労働契約の部分は無効となり、無効となった部分は基準の定めるところによる。", "有効期間の定めがない労働協約は、当事者の一方が、署名し、又は記名押印した文書によって、解約しようとする日の少なくとも30日前に相手方に予告して、解約することができる。", "一の工場事業場に常時使用される同種の労働者の4分の3以上の数の労働者が一の労働協約の適用を受けるに至ったときは、当該工場事業場に使用される他の同種の労働者にも当該労働協約が適用される。"], "answer": 3, "explanation": "誤っているのはD。解約の予告は「少なくとも90日前」（15条3項・4項）＝講義の⚠️③。\nA：14条のとおり。口頭の合意だけでは労働協約の効力は生じない。\nB：15条1項・2項のとおり（3年超の定めは無効ではなく3年とみなす）。\nC：16条の規範的効力。労働契約に定めがない部分も同様に基準による。\nE：17条の一般的拘束力（事業場単位）。\n📌暗記ポイント：協約は「書面＋署名又は記名押印・上限3年・予告90日・拡張4分の3」。", "ref": {"label": "労組法14条〜17条", "url": "https://laws.e-gov.go.jp/law/324AC0000000174"}}, {"no": 3, "subject": "労一", "type": "fill", "monster": {"name": "キンキュウチョウセイテンペスト", "emoji": "🌪️"}, "text": "📖 労働関係調整法の空欄を埋めよ。\n公益事業に関する事件につき関係当事者が争議行為をするには、その争議行為をしようとする日の少なくとも【 A 】前までに、労働委員会及び厚生労働大臣又は都道府県知事にその旨を通知しなければならない。（37条1項）\n【 B 】は、事件が公益事業に関するものであるため、又はその規模が大きいため若しくは特別の性質の事業に関するものであるために、争議行為により当該業務が停止されるときは国民経済の運行を著しく阻害し、又は国民の日常生活を著しく危くする虞があると認める事件について、その虞が現実に存するときに限り、緊急調整の決定をすることができる。（35条の2第1項）\n緊急調整の決定をなした旨の公表があつたときは、関係当事者は、公表の日から【 C 】間は、争議行為をなすことができない。（38条）", "options": ["十日", "十五日", "三十日", "五十日", "九十日", "内閣総理大臣", "厚生労働大臣", "中央労働委員会"], "blanks": [{"label": "A", "answer": 0}, {"label": "B", "answer": 5}, {"label": "C", "answer": 3}], "explanation": "A=十日 B=内閣総理大臣 C=五十日。\n緊急調整の決定は内閣総理大臣が、あらかじめ中央労働委員会の意見を聴いて行う（35条の2第2項）。中央労働委員会は決定する側ではなく、通知を受けて解決に最大限の努力を尽くす側（35条の3）。\n⚠️「十五日」は調停案の解釈・履行の見解を示す期間（26条3項）や労組法の再審査申立て期間（27条の15）、「九十日」は労働協約の解約予告（労組法15条4項）でいずれもダミー。\n⚠️仲裁は双方の申請か労働協約の定めに基づく申請が必要で、公益事業でも一方の申請・職権では始まらない（30条）＝講義の⚠️④。\n📌暗記ポイント：公益事業の争議行為は10日前に通知・緊急調整は総理大臣・50日間は争議行為禁止。", "ref": {"label": "労調法35条の2・37条・38条", "url": "https://laws.e-gov.go.jp/law/321AC0000000025"}}, {"no": 4, "subject": "徴収", "type": "single", "monster": {"name": "ニブンノイチゴーレム", "emoji": "⛓️"}, "uncurse": "成立の足枷", "text": "🔁 雇用保険暫定任意適用事業の保険関係（徴収法附則2条・4条）に関する次の記述のうち、正しいものはどれか。", "choices": ["雇用保険暫定任意適用事業の事業主が雇用保険の加入の申請をし、厚生労働大臣の認可があった場合は、認可があった日の翌日に雇用保険に係る保険関係が成立する。", "雇用保険の加入の申請は、その事業に使用される労働者の過半数の同意を得なければ行うことができない。", "雇用保険暫定任意適用事業の事業主は、その事業に使用される労働者の2分の1以上が希望するときは、雇用保険の加入の申請をしなければならない。", "加入の申請により成立した雇用保険に係る保険関係の消滅の申請は、その事業に使用される労働者の2分の1以上の同意を得れば行うことができ、認可があった日に保険関係が消滅する。", "雇用保険法5条1項の適用事業に該当する事業が雇用保険暫定任意適用事業に該当するに至ったときは、その該当するに至った日に、加入の認可があったものとみなされる。"], "answer": 2, "explanation": "正しいのはC（徴収法附則2条3項）。労働者の2分の1以上が希望すれば、事業主は加入の申請をする義務を負う（違反には罰則あり＝附則7条）。\nA：保険関係は「認可があった日」に成立する（附則2条1項）。翌日ではない。\nB：同意の要件は「2分の1以上」（附則2条2項）。\nD：消滅の申請には労働者の「4分の3以上」の同意が必要で、消滅するのは認可があった日の「翌日」（附則4条）。\nE：該当するに至った日の「翌日」に認可があったものとみなす（附則2条4項）。\n📌暗記ポイント：任意加入は「2分の1以上の同意・認可の日に成立」、任意脱退は「4分の3以上の同意・認可の翌日に消滅」。前回までの3条・4条の2・5条（強制適用の当然成立・翌日消滅）と比べて覚える。", "ref": {"label": "徴収法附則2条・4条", "url": "https://laws.e-gov.go.jp/law/344AC0000000084"}}, {"no": 5, "subject": "雇用", "type": "single", "monster": {"name": "カンショウチジオウル", "emoji": "🦉"}, "text": "🔁 雇用保険法1条（目的）・2条（管掌）に関する次の記述のうち、正しいものはどれか。", "choices": ["雇用保険は政府が管掌するが、その事務の一部は、政令で定めるところにより、市町村長が行うこととすることができる。", "雇用保険の事務の一部は、厚生労働省令で定めるところにより、都道府県知事が行うこととすることができる。", "雇用保険法1条の目的には、労働者が失業した場合の給付は掲げられているが、労働者が子を養育するための休業をした場合の給付は掲げられていない。", "雇用保険法1条の目的には、労働者が自ら職業に関する教育訓練を受けた場合の給付は掲げられていない。", "雇用保険は、失業の予防、雇用状態の是正及び雇用機会の増大、労働者の能力の開発及び向上その他労働者の福祉の増進を図ることを目的の一つとしている。"], "answer": 4, "explanation": "正しいのはE（雇用保険法1条）。給付に加え、失業の予防・雇用状態の是正及び雇用機会の増大・能力の開発及び向上その他福祉の増進（＝雇用保険二事業につながる部分）も目的に掲げている。\nA：事務の一部を行うのは「都道府県知事」（2条2項）。\nB：都道府県知事に事務を行わせるのは「政令」で定めるところによる（2条2項）。\nC：子を養育するための休業や、所定労働時間を短縮することによる就業をした場合の給付も目的に含まれる（1条）。\nD：自ら職業に関する教育訓練を受けた場合の給付も目的に含まれる（1条）。\n📌暗記ポイント：管掌は政府、事務の一部は政令により都道府県知事。労災法（2条：政府が管掌）との横断でも出る。", "ref": {"label": "雇用保険法1条・2条", "url": "https://laws.e-gov.go.jp/law/349AC0000000116"}}]};

let audioCtx = null;
function ctx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function tone(freq, start, dur, type, vol) {
  const c = ctx();
  const o = c.createOscillator(), g = c.createGain();
  o.type = type || 'square'; o.frequency.value = freq;
  g.gain.setValueAtTime(0, c.currentTime + start);
  g.gain.linearRampToValueAtTime(vol || 0.12, c.currentTime + start + 0.01);
  g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + start + dur);
  o.connect(g); g.connect(c.destination);
  o.start(c.currentTime + start); o.stop(c.currentTime + start + dur + 0.05);
}

const G = QUIZ.game || null;
function xpThreshold(level) { return 100 * level; } // Lv n → n+1
function renderStatus(bonusXp, leveledTo) {
  if (!G) { document.getElementById('status').style.display = 'none'; return; }
  const el = document.getElementById('status');
  const xpNow = G.xp + (bonusXp || 0);
  let lv = leveledTo || G.level;
  const need = xpThreshold(lv);
  const prevSum = (function(){ let s=0; for(let i=1;i<lv;i++) s+=xpThreshold(i); return s; })();
  const inLv = Math.max(0, xpNow - prevSum);
  const pct = Math.min(100, Math.round(inLv / need * 100));
  let html = `<div class="toprow"><span class="lv">⚔️ Lv.${lv}</span><span class="streak">🔥 ${G.streak}日連続</span></div>`;
  html += `<div class="xpbar"><div class="fill" style="width:${pct}%"></div></div>`;
  html += `<div class="xptext">XP ${inLv} / ${need}${bonusXp ? `（今日 +${bonusXp}）` : ''}</div>`;
  if (G.stats && G.stats.length) {
    html += `<div class="statchips">` + G.stats.map(s =>
      `<span class="statchip"><b>${s.subject}</b> ${s.rank}${s.note ? ` ${s.note}` : ''}</span>`).join('') + `</div>`;
  }
  if (G.cursed && G.cursed.length) {
    html += `<div class="cursedbox">🟣 呪われた装備: ${G.cursed.map(c=>c.item).join('、')}<br>→ 🔁復習問題に正解すると解呪できる！</div>`;
  }
  el.innerHTML = html;
}

function mdLite(src) {
  const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return esc(src)
    .replace(/^# (.+)$/gm, '<h1>$1</h1>')
    .replace(/^## (.+)$/gm, '<h2>$1</h2>')
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/^- (.+)$/gm, '・$1')
    .replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>')
    .replace(/\n\n/g, '<br><br>')
    .replace(/\n/g, '<br>');
}

function applySelections() {
  QUIZ.questions.forEach(q => {
    if (q.type === 'single') {
      if (state[q.no] !== null) {
        const el = document.querySelector(`.choice[data-q="${q.no}"][data-i="${state[q.no]}"]`);

      state[q.no].forEach((v, bi) => {

  const qno = parseInt(btn.dataset.q);
  if (btn.classList.contains('choice')) {
    document.querySelectorAll(`.choice[data-q="${qno}"]`).forEach(el => el.classList.remove('sel'));
    btn.classList.add('sel');
    state[qno] = parseInt(btn.dataset.i);
  } else if (btn.classList.contains('opt')) {
    const bi = parseInt(btn.dataset.b);
    document.querySelectorAll(`.opt[data-q="${qno}"][data-b="${bi}"]`).forEach(el => el.classList.remove('sel'));
    btn.classList.add('sel');
    state[qno][bi] = parseInt(btn.dataset.i);
  }
  saveState();
  updateBtn();
});

function allAnswered() {
  return QUIZ.questions.every(q =>
    q.type === 'single' ? state[q.no] !== null : state[q.no].every(v => v !== null));
}
function updateBtn() {
  const b = document.getElementById('gradeBtn');
  b.disabled = !allAnswered();
  b.textContent = allAnswered() ? '⚔️ 採点する' : '採点する（未回答あり）';
}

function questionContext(q) {
  let lines = [`社労士試験の学習中です。以下の問題について質問があります。`, ``, `【問題】問${q.no}（${q.subject}）`, q.text, ``];
  if (q.type === 'single') {
    lines.push(`【選択肢】`);
    q.choices.forEach((c, i) => lines.push(`${String.fromCharCode(65+i)}. ${c}`));
    lines.push(``, `【正解】${String.fromCharCode(65 + q.answer)}`);
  } else {
    lines.push(`【語群】` + q.options.map((o,i)=>`${CIRCLED[i]}${o}`).join(' '));
    lines.push(`【正解】` + q.blanks.map((b)=>`${b.label}=${CIRCLED[b.answer]}${q.options[b.answer]}`).join(' '));
  }
  lines.push(``, `【解説】`, q.explanation, ``, `【根拠】${q.ref.label} ${q.ref.url}`, ``, `私の質問: `);
  return lines.join('\n');
}
function askClaude(qno) {
  const q = QUIZ.questions.find(x => x.no === qno);
  const ctx2 = questionContext(q);
  if (navigator.clipboard) navigator.clipboard.writeText(ctx2).catch(()=>{});
  window.open('https://claude.ai/new?q=' + encodeURIComponent(ctx2), '_blank');
}

function doGrade(fromRestore) {
  graded = true;
  document.getElementById('quiz').style.display = '';
  const results = [];
  let gainedXp = 0;
  const uncursed = [];
  QUIZ.questions.forEach(q => {
    let ok;
    if (q.type === 'single') {
      ok = state[q.no] === q.answer;
      document.querySelectorAll(`.choice[data-q="${q.no}"]`).forEach(el => {
        const i = parseInt(el.dataset.i);
        if (i === q.answer) el.classList.add('correct');
        else if (i === state[q.no]) el.classList.add('wrong');
      });
    } else {
      ok = q.blanks.every((b, bi) => state[q.no][bi] === b.answer);
      q.blanks.forEach((b, bi) => {
        document.querySelectorAll(`.opt[data-q="${q.no}"][data-b="${bi}"]`).forEach(el => {
          const i = parseInt(el.dataset.i);
          if (i === b.answer) el.classList.add('correct');
          else if (i === state[q.no][bi]) el.classList.add('wrong');
        });
      });
    }
    results.push(ok);
    const banner = document.getElementById('banner' + q.no);
    const mname = q.monster ? q.monster.name : `問${q.no}`;
    const memoji = q.monster ? q.monster.emoji : '';
    if (ok) {
      const xp = q.uncurse ? 15 : 10;
      gainedXp += xp;
      if (q.uncurse) uncursed.push(q.uncurse);
      banner.textContent = `⚔️ ${memoji}${mname}を撃破！ +${xp}XP` + (q.uncurse ? `　🔓「${q.uncurse}」を解呪した！` : '');
      banner.className = 'result-banner ok';
    } else {
      banner.textContent = `💥 ${memoji}${mname}の攻撃！ 装備が呪われてしまった…（明日の🔁復習で解呪しよう）`;
      banner.className = 'result-banner ng';
    }
    const ex = document.getElementById('expl' + q.no);
    ex.style.display = 'block';
    ex.innerHTML = `<div style="white-space:pre-wrap">${q.explanation}</div>` +
      `<div class="ref">根拠：<a href="${q.ref.url}" target="_blank" rel="noopener">${q.ref.label}</a></div>` +
      `<button class="askBtn" data-q="${q.no}">🙋 この問題についてClaudeに質問する</button>`;
  });
  const score = results.filter(Boolean).length;
  const wrong = results.map((r, i) => r ? null : i + 1).filter(Boolean);
  const perfect = wrong.length === 0;
  if (perfect) gainedXp += 25;

  // 効果音(復元時は鳴らさない)
  if (!fromRestore) {
    if (perfect) sfxFanfare();
    else if (score >= 3) sfxCorrect();
    else sfxWrong();
  }

  // レベルアップ判定(暫定表示。正本は翌朝cronが同じ式で更新)
  let lvUpTo = null;
  if (G) {
    let lv = G.level, xp = G.xp + gainedXp;
    let sum = 0; for (let i = 1; i < lv; i++) sum += xpThreshold(i);
    while (xp - sum >= xpThreshold(lv)) { sum += xpThreshold(lv); lv++; }
    if (lv > G.level) lvUpTo = lv;
    renderStatus(gainedXp, lvUpTo || G.level);
  }

  document.getElementById('scoreText').textContent = `${score} / 5`;
  const gains = [`⚡ 獲得XP: +${gainedXp}` + (perfect ? '（全問正解ボーナス +25 含む）' : '')];
  if (uncursed.length) gains.push(`🔓 解呪: ${uncursed.join('、')}`);
  document.getElementById('gainsText').innerHTML = gains.join('<br>');
  if (lvUpTo) {
    const lu = document.getElementById('levelupText');
    lu.style.display = 'block';
    lu.textContent = `🎉 レベルアップ！ Lv.${G.level} → Lv.${lvUpTo}`;
    if (!fromRestore) setTimeout(sfxLevelUp, perfect ? 1600 : 500);
  }
  if (perfect && G && G.drop_on_perfect) {
    const d = document.getElementById('dropBox');
    d.style.display = 'block';
    d.textContent = `🎁 ${G.drop_on_perfect.emoji} 「${G.drop_on_perfect.name}」を手に入れた！`;
  }

  const sent = SUBMIT_URL && !SUBMIT_URL.startsWith('__');
  if (sent && !fromRestore) {
    try {
      fetch(SUBMIT_URL, {
        method: 'POST', mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({ date: QUIZ.date, score: score, wrong: wrong })
      });
    } catch (e) {}
  }
  const guide = document.getElementById('recordGuide');
  if (sent) {
    guide.innerHTML = `📡 結果は自動送信されました。翌朝ステータスに反映されます。<br><span class="memo">（予備: 記録されていなかったら ${wrong.length ? wrong.map(n => NUM_EMOJI[n-1]).join(' ') : '✅'} をSlack投稿にリアクション）</span>`;
  } else {
    guide.innerHTML = `記録のため、Slackの今日の投稿に ${wrong.length ? '間違えた問題の絵文字 ' + wrong.map(n => NUM_EMOJI[n-1]).join(' ') : '✅'} をリアクションしてください。`;
  }
  const resultText = `今日の結果 ${results.map((r, i) => `${i+1}${r ? '○' : '×'}`).join(' ')}`;
  document.getElementById('copyBtn').addEventListener('click', () => {
    navigator.clipboard.writeText(resultText).then(() => {
      document.getElementById('copyBtn').textContent = 'コピーしました ✓';
    });
  });
  document.getElementById('summary').style.display = 'block';
  document.getElementById('gradeBtn').style.display = 'none';
  if (!fromRestore) {
    saveState();
    document.getElementById('summary').scrollIntoView({ behavior: 'smooth' });
  }
}

document.getElementById('gradeBtn').addEventListener('click', () => {
  if (graded || !allAnswered()) return;
  doGrade(false);
});

(function restore() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) { updateBtn(); return; }
    const d = JSON.parse(raw);
    if (d && d.state) {
      Object.keys(d.state).forEach(k => { state[k] = d.state[k]; });
      applySelections();
      if (d.graded) doGrade(true);
      if (hasLesson) deployQuiz(false);   // 一度出陣していたらゲートを開けておく
    }
  } catch (e) {}
  updateBtn();
})();
</script>
