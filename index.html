<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1a1d21; --sub: #616770;
    --accent: #2563eb; --accent-soft: #dbeafe; --border: #e3e6ea;
    --ok: #16a34a; --ok-soft: #dcfce7; --ng: #dc2626; --ng-soft: #fee2e2;
    --gold: #b45309; --gold-soft: #fef3c7; --xp: #7c3aed; --xp-soft: #ede9fe;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15171a; --card: #1f2226; --text: #e8eaed; --sub: #9aa2ab;
      --accent: #60a5fa; --accent-soft: #1e3a5f; --border: #33373d;
      --ok: #4ade80; --ok-soft: #14331f; --ng: #f87171; --ng-soft: #3b1a1a;
      --gold: #fbbf24; --gold-soft: #3a2e10; --xp: #a78bfa; --xp-soft: #2a2140;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    line-height: 1.7; padding: 16px 12px 80px;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  header { margin: 8px 4px 12px; display: flex; justify-content: space-between; align-items: center; }
  header h1 { font-size: 20px; margin: 0; }
  header .meta { color: var(--sub); font-size: 12px; }
  #soundBtn { border: 1px solid var(--border); background: var(--card); color: var(--text);
    border-radius: 999px; padding: 6px 12px; font-size: 14px; cursor: pointer; font-family: inherit; }
  /* ステータスカード */
  #status {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 14px 16px; margin-bottom: 16px;
  }
  #status .toprow { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 6px; }
  #status .lv { font-size: 18px; font-weight: 800; }
  #status .streak { color: var(--gold); font-weight: 700; font-size: 14px; }
  .xpbar { background: var(--xp-soft); border-radius: 999px; height: 12px; margin: 8px 0 4px; overflow: hidden; }
  .xpbar .fill { background: var(--xp); height: 100%; border-radius: 999px; transition: width 1.2s ease; }
  #status .xptext { font-size: 12px; color: var(--sub); }
  .statchips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .statchip { font-size: 11.5px; border: 1px solid var(--border); border-radius: 999px; padding: 2px 9px; color: var(--sub); }
  .statchip b { color: var(--text); }
  .cursedbox { margin-top: 10px; font-size: 12.5px; color: var(--sub); background: var(--ng-soft); border-radius: 8px; padding: 6px 10px; }
  /* 問題カード */
  .q { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin-bottom: 16px; }
  .q .tag { display: inline-block; font-size: 12px; color: var(--accent);
    background: var(--accent-soft); border-radius: 999px; padding: 1px 10px; margin-bottom: 4px; }
  .monster { font-size: 13.5px; color: var(--sub); margin: 2px 0 10px; }
  .monster .mname { font-weight: 700; color: var(--text); }
  .q .qtext { font-size: 15px; white-space: pre-wrap; margin-bottom: 12px; }
  .choice { display: flex; gap: 10px; align-items: flex-start; width: 100%; text-align: left;
    background: none; border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 12px; margin-bottom: 8px; font-size: 14px; color: var(--text);
    cursor: pointer; line-height: 1.6; font-family: inherit; }
  .choice .mark { font-weight: 700; color: var(--sub); flex-shrink: 0; }
  .choice.sel { border-color: var(--accent); background: var(--accent-soft); }
  .choice.sel .mark { color: var(--accent); }
  .choice.correct { border-color: var(--ok); background: var(--ok-soft); }
  .choice.wrong { border-color: var(--ng); background: var(--ng-soft); }
  .blank-group { margin-bottom: 14px; }
  .blank-group .blabel { font-weight: 700; font-size: 14px; margin-bottom: 6px; }
  .opts { display: flex; flex-wrap: wrap; gap: 8px; }
  .opt { border: 1px solid var(--border); background: none; color: var(--text);
    border-radius: 999px; padding: 6px 14px; font-size: 14px; cursor: pointer; font-family: inherit; }
  .opt.sel { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 700; }
  .opt.correct { border-color: var(--ok); background: var(--ok-soft); color: var(--ok); font-weight: 700; }
  .opt.wrong { border-color: var(--ng); background: var(--ng-soft); color: var(--ng); }
  .result-banner { font-size: 14.5px; font-weight: 700; border-radius: 10px; padding: 10px 14px; margin-top: 12px; display: none; }
  .result-banner.ok { display: block; background: var(--ok-soft); color: var(--ok); }
  .result-banner.ng { display: block; background: var(--ng-soft); color: var(--ng); }
  .expl { display: none; margin-top: 12px; border-top: 1px dashed var(--border); padding-top: 12px; font-size: 14px; }
  .expl .ref a { color: var(--accent); word-break: break-all; }
  .memo { color: var(--sub); font-size: 13px; }
  .askBtn { margin-top: 10px; border: 1px solid var(--accent); color: var(--accent); background: none;
    border-radius: 8px; padding: 8px 14px; font-size: 13px; cursor: pointer; font-family: inherit; }
  #lesson { background: var(--card); border: 2px solid var(--gold); border-radius: 14px;
    padding: 16px; margin-bottom: 16px; }
  #lesson .ltag { display: inline-block; font-size: 12px; color: var(--gold);
    background: var(--gold-soft); border-radius: 999px; padding: 1px 10px; margin-bottom: 8px; font-weight: 800; }
  #lesson h2 { font-size: 16px; margin: 0 0 8px; }
  #lesson .lbody { font-size: 14.5px; line-height: 1.85; }
  #lesson .lbody h1 { display: none; }
  #lesson .lbody h2 { font-size: 14px; color: var(--accent); margin: 14px 0 4px; }
  #lesson .lbody a { color: var(--accent); word-break: break-all; }
  #deployBtn { display: block; width: 100%; margin-top: 14px; background: var(--accent); color: #fff;
    border: none; border-radius: 999px; font-size: 15px; font-weight: 700; padding: 12px 0;
    cursor: pointer; font-family: inherit; }
  #gradeBtn { position: fixed; left: 50%; transform: translateX(-50%); bottom: 20px;
    background: var(--accent); color: #fff; border: none; border-radius: 999px;
    font-size: 16px; font-weight: 700; padding: 14px 42px; cursor: pointer;
    box-shadow: 0 4px 14px rgba(0,0,0,.25); font-family: inherit; }
  #gradeBtn:disabled { opacity: .5; }
  #summary { display: none; background: var(--card); border: 2px solid var(--accent);
    border-radius: 14px; padding: 18px; margin: 20px 0; }
  #summary h2 { margin: 0 0 8px; font-size: 18px; }
  #summary .score { font-size: 32px; font-weight: 800; color: var(--accent); }
  #summary .gains { margin: 10px 0; font-size: 14.5px; }
  #summary .levelup { color: var(--xp); font-weight: 800; font-size: 17px; margin: 6px 0; }
  #summary .drop { background: var(--gold-soft); color: var(--gold); border-radius: 10px;
    padding: 10px 14px; margin: 10px 0; font-weight: 700; display: none; }
  #summary .record { margin-top: 10px; font-size: 13px; color: var(--sub); }
  #copyBtn { margin-top: 8px; border: 1px solid var(--accent); color: var(--accent); background: none;
    border-radius: 8px; padding: 8px 16px; font-size: 14px; cursor: pointer; font-family: inherit; }
  @keyframes pop { 0% { transform: scale(.7); opacity: 0; } 60% { transform: scale(1.08); } 100% { transform: scale(1); opacity: 1; } }
  .result-banner.ok, .result-banner.ng { animation: pop .35s ease; }

<script>
const QUIZ = {"date": "2026-10-22", "weekday": "木", "quiz_id": "2026-10-22", "game": {"level": 2, "xp": 110, "xp_next": 300, "streak": 1, "stats": [{"subject": "労基", "rank": "C", "note": "2/5"}, {"subject": "安衛", "rank": "－", "note": "0/0"}, {"subject": "労災", "rank": "C", "note": "1/3"}, {"subject": "雇用", "rank": "B", "note": "2/3"}, {"subject": "徴収", "rank": "C", "note": "0/1"}, {"subject": "労一", "rank": "－", "note": "0/0"}, {"subject": "社一", "rank": "－", "note": "0/0"}, {"subject": "健保", "rank": "B", "note": "2/4"}, {"subject": "国年", "rank": "C", "note": "1/5"}, {"subject": "厚年", "rank": "C", "note": "1/4"}], "cursed": [{"item": "年金の兜", "subject": "国年"}, {"item": "労災の盾", "subject": "労災"}, {"item": "十年の篭手", "subject": "厚年"}, {"item": "保険者の帯", "subject": "健保"}, {"item": "成立の足枷", "subject": "徴収"}, {"item": "移送の靴", "subject": "健保"}, {"item": "認定日の指輪", "subject": "国年"}, {"item": "報酬の鎧", "subject": "厚年"}], "drop_on_perfect": {"emoji": "🧤", "name": "両立の手袋"}}, "lesson": {"no": 23, "subject": "雇用", "topic": "雇用継続給付・育児介護休業給付", "body": "# 第23回講義：雇用保険法「雇用継続給付・育児介護休業給付」\n\n## この制度は何のためにあるか\n\n「失業したとき」ではなく、**働き続けるとき**を支える給付。\n- **雇用継続給付**＝高年齢で賃金が下がっても、また家族の介護で休んでも、**仕事を続けられる**ように支える（10条6項）。\n- **育児休業等給付**＝子を育てるための休業・時短中の収入を支える。**失業等給付ではなく別建て**（⚠️前回のひっかけ）。\n\n## 条文の中身（ここが出る）\n\n### 雇用継続給付は3つ（10条6項）\n**高年齢雇用継続基本給付金・高年齢再就職給付金（この2つが「高年齢雇用継続給付」）＋介護休業給付金**。\n\n### ① 高年齢雇用継続基本給付金（61条）\n- 対象：60歳以上65歳未満の被保険者（短期雇用特例・日雇は除く）。**支給対象月**は「60歳に達した日の属する月から65歳に達する日の属する月まで」の月。\n- 要件：支給対象月の賃金が、**みなし賃金日額×30の75%未満**に下がったとき。被保険者であった期間に相当する期間が**5年以上**あること（5年に満たないときは不支給）。\n- 額：賃金が**64%未満**に下がったら賃金の**10%**。64%以上75%未満は**10%から逓減**する率。\n- 賃金が**支給限度額以上**なら不支給。算定額が基本手当日額の上限（17条4項1号）の**80%を超えない**ときも不支給。\n- ⚠️ひっかけ①：**75%未満**で支給、**64%未満**で最高率。数字を入れ替えて出る。\n\n### ② 高年齢再就職給付金（61条の2）\n- 対象：**基本手当の受給資格者**が**60歳到達後に安定した職業に就き被保険者**になった場合。算定基礎期間**5年以上**で、基本手当の支給を受けたことがあること。\n- 要件：就職日前日の**支給残日数が100日以上**。賃金が基本手当日額の算定基礎となった賃金日額×30の**75%未満**。\n- 支給期間：就職日の属する月から、就職日の翌日から**2年**（支給残日数が**200日未満**なら**1年**）を経過する日の属する月まで。ただし65歳に達する日の属する月が限度。\n- ⚠️ひっかけ②：**100日以上**で支給、**200日**を境に2年／1年。同一の就職につき**就業促進手当（再就職手当）とは選択**（どちらか一方）。\n\n### ③ 介護休業給付金（61条の4）\n- 対象家族（配偶者〔事実婚含む〕・父母・子・配偶者の父母など）を介護するための休業。\n- 要件：休業開始日前**2年間**にみなし被保険者期間が通算**12箇月以上**。\n- **支給単位期間**＝休業開始日から**3月**を経過する日までの期間を1か月ごとに区切った期間。\n- 額：休業開始時賃金日額×支給日数（原則30日）の**40%**。会社から賃金が出て、賃金＋給付が**80%以上**になれば調整、賃金だけで80%以上なら不支給。\n- 回数・日数：同一の対象家族につき**3回まで**（4回目以後は不支給）、通算**93日**に達した日後の休業は不支給。\n- ⚠️ひっかけ③：育児休業給付金の「67%・50%」と混ぜない。介護は**40%**。\n\n### 育児休業等給付（61条の7以下）\n- **育児休業給付金**（61条の7）：**1歳に満たない子**（延長で1歳6か月・2歳。配偶者も休業するなら**1歳2か月**〔パパ・ママ育休プラス〕）。休業開始前2年間にみなし被保険者期間が通算**12箇月以上**。\n  - 額：休業開始時賃金日額×支給日数の**50%**。ただし休業日数が通算**180日**に達するまでは**67%**。賃金＋給付が80%以上なら調整。\n  - 同一の子につき**3回以上**の育児休業（省令の例外を除く）の3回目以後は不支給。\n- **出生時育児休業給付金**（61条の8）：子の出生後**8週間**以内に**4週間（28日）以内**の休業。額は**67%**。\n- **出生後休業支援給付金**（61条の10）：出生後休業を**14日以上**（原則、配偶者も14日以上）。額は**13%**（28日が上限）。\n- **育児時短就業給付金**（61条の12）：**2歳に満たない子**を養育する時短就業。\n- 不正受給した者は育児休業給付の支給を受けられなくなる（61条の9）。\n\n## 覚え方のコツ\n- 雇用継続給付は「**高年齢2つ＋介護1つ**」。育児は別建ての「育児休業等給付」。\n- 高年齢は「**75%未満で出る、64%未満で最高10%**」。再就職給付金は「**残100日以上、200日で2年／1年**」。\n- 介護は「**40%・3回・93日**」、育児は「**67%（180日まで）→50%**」。\n\n## まとめ3行\n1. 雇用継続給付＝高年齢雇用継続基本給付金＋高年齢再就職給付金＋介護休業給付金。育児休業給付は別建て。\n2. 高年齢は賃金が75%未満に低下で支給、再就職給付金は支給残日数100日以上（200日未満は1年）。\n3. 介護休業給付金は40%・3回・通算93日、育児休業給付金は180日まで67%・以後50%。\n\n根拠条文：雇用保険法10条・61条・61条の2・61条の4・61条の7〜61条の10・61条の12 https://laws.e-gov.go.jp/law/349AC0000000116\n"}, "questions": [{"no": 1, "subject": "雇用", "type": "single", "monster": {"name": "ナナジュウゴパーセントゴブリン", "emoji": "👺"}, "text": "📖 雇用保険法の高年齢雇用継続給付（61条・61条の2）に関する次の記述のうち、正しいものはどれか。", "choices": ["高年齢再就職給付金は、就職日の前日における支給残日数が百日未満であっても、再就職後の賃金が低下していれば支給される。", "高年齢再就職給付金の再就職後の支給対象月は、就職日の前日における支給残日数にかかわらず、一律に就職日の翌日から起算して二年を経過する日の属する月までである。", "高年齢雇用継続基本給付金は、被保険者であった期間に相当する期間が三年に満たないときは、支給されない。", "高年齢再就職給付金は、受給資格者が六十歳に達した日以後安定した職業に就いて被保険者となった場合に支給されるが、同一の就職につき就業促進手当（再就職手当に当たるもの）の支給を受けたときは、支給されない。", "高年齢雇用継続基本給付金は、支給対象月に支払われた賃金の額がみなし賃金日額に三十を乗じて得た額の百分の六十四に相当する額を下るに至ったときに、はじめて支給される。"], "answer": 3, "explanation": "正しいのはD（61条の2第1項・第4項）。\nA：⚠️支給残日数が百日未満のときは支給しない（61条の2第1項1号）。\nB：支給残日数が二百日未満の場合は二年ではなく一年（同条2項）。\nC：必要な期間は三年ではなく五年（61条1項1号）。\nE：支給の要件は百分の七十五に相当する額を下るに至ったとき。百分の六十四未満は、最高の支給率（賃金の百分の十）となる区切り（61条1項・5項）。\n📌高年齢は「75%未満で支給・64%未満で最高10%」「再就職給付金は残100日以上・200日未満は1年」。", "ref": {"label": "雇用保険法61条・61条の2", "url": "https://laws.e-gov.go.jp/law/349AC0000000116"}}, {"no": 2, "subject": "雇用", "type": "single", "monster": {"name": "キュウジュウサンニチゴーレム", "emoji": "🗿"}, "text": "📖 雇用保険法の介護休業給付金（61条の4）に関する次の記述のうち、正しいものはどれか。", "choices": ["介護休業給付金の額は、一支給単位期間について、休業開始時賃金日額に支給日数を乗じて得た額の百分の六十七に相当する額である。", "介護休業給付金の支給単位期間は、介護休業を開始した日から起算して六月を経過する日までの期間を一月ごとに区切った期間である。", "介護休業給付金は、同一の対象家族について四回以上の介護休業をした場合の四回目以後の介護休業、及び介護休業日数を合算して九十三日に達した日後の介護休業については、支給されない。", "介護休業給付金は、介護休業を開始した日前二年間にみなし被保険者期間が通算して六箇月以上あれば支給される。", "介護休業をした被保険者に事業主から賃金が支払われた場合は、その額にかかわらず、介護休業給付金の額は減額されない。"], "answer": 2, "explanation": "正しいのはC（61条の4第6項）。\nA：⚠️介護休業給付金は百分の四十。百分の六十七（百八十日まで）は育児休業給付金（61条の4第4項、61条の7第6項）。\nB：支給単位期間は休業開始日から三月を経過する日までに限る（同条3項）。\nD：みなし被保険者期間は通算して十二箇月以上（同条1項）。\nE：賃金額と給付額の合計が休業開始時賃金日額×支給日数の百分の八十以上になれば、百分の八十相当額から賃金額を減じた額に調整し、賃金だけで百分の八十以上なら不支給（同条5項）。\n📌介護は「40%・3回・93日」。", "ref": {"label": "雇用保険法61条の4", "url": "https://laws.e-gov.go.jp/law/349AC0000000116"}}, {"no": 3, "subject": "雇用", "type": "fill", "monster": {"name": "ヒャクハチジュウニチキメラ", "emoji": "🍼"}, "text": "📖 雇用保険法61条の7（育児休業給付金）の空欄を埋めよ。\n育児休業給付金は、被保険者が、その【 A 】に満たない子を養育するための休業をした場合において、当該育児休業を開始した日前二年間に、みなし被保険者期間が通算して【 B 】以上であったときに、支給単位期間について支給する。\n育児休業給付金の額は、休業開始時賃金日額に支給日数を乗じて得た額の百分の五十（育児休業を開始した日から起算し当該育児休業給付金の支給に係る休業日数が通算して【 C 】に達するまでの間に限り、百分の六十七）に相当する額とする。", "options": ["二歳", "一歳", "六箇月", "十二箇月", "百八十日", "九十三日", "二十八日", "百二十日"], "blanks": [{"label": "A", "answer": 1}, {"label": "B", "answer": 3}, {"label": "C", "answer": 4}], "explanation": "A=一歳 B=十二箇月 C=百八十日。\n育児休業給付金は一歳に満たない子が原則（延長で一歳六か月・二歳、配偶者も休業する場合は一歳二か月＝61条の7第1項・第8項）。みなし被保険者期間は通算十二箇月以上、額は百八十日までは百分の六十七、以後は百分の五十（同条6項）。\nダミーの「九十三日」は介護休業給付金の通算日数（61条の4第6項2号）、「二十八日」は出生時育児休業の日数（61条の8第2項2号）、「二歳」は育児時短就業給付金の子の年齢（61条の12）で、混同を狙ったひっかけ。\n📌育児は「1歳・12箇月・180日まで67%」。", "ref": {"label": "雇用保険法61条の7", "url": "https://laws.e-gov.go.jp/law/349AC0000000116"}}, {"no": 4, "subject": "健保", "type": "single", "monster": {"name": "キョウカイノセキニンガーゴイル", "emoji": "🗽"}, "text": "🔁 全国健康保険協会が管掌する健康保険の業務（健保法5条・7条の2）に関する次の記述のうち、正しいものはどれか。", "choices": ["協会が行う業務は保健事業及び福祉事業に限られ、保険給付に関する業務は、厚生労働大臣が行う。", "協会が管掌する健康保険の事業に関する業務のうち、被保険者の資格の取得及び喪失の確認、標準報酬月額及び標準賞与額の決定並びに保険料の徴収（任意継続被保険者に係るものを除く。）並びにこれらに附帯する業務は、厚生労働大臣が行う。", "任意継続被保険者に係る保険料の徴収は、他の被保険者に係る保険料の徴収と同様に、厚生労働大臣が行う。", "保健事業及び福祉事業に関する業務は、協会が管掌する健康保険の事業の業務のうち、厚生労働大臣が行う。", "協会は、健康保険組合の組合員である被保険者の保険を管掌する。"], "answer": 1, "explanation": "正しいのはB（5条2項）。\nA：保険給付に関する業務（7条の2第2項1号）も保健事業・福祉事業（同項2号）も協会が行う。\nC：⚠️任意継続被保険者に係る保険料の徴収は括弧書きで除かれており、協会が行う（5条2項）。\nD：保健事業及び福祉事業は協会の業務（7条の2第2項2号）。\nE：協会が管掌するのは健康保険組合の組合員でない被保険者（5条1項）。\n📌厚生労働大臣が行うのは「資格の確認・標準報酬の決定・保険料の徴収（任意継続を除く）」。", "ref": {"label": "健康保険法5条・7条の2", "url": "https://laws.e-gov.go.jp/law/211AC0000000070"}, "uncurse": "保険者の帯", "review_id": "20260818-2"}, {"no": 5, "subject": "厚年", "type": "single", "monster": {"name": "ニンイタンドクバンパイア", "emoji": "🧛"}, "text": "🔁 厚生年金保険の適用事業所と被保険者資格（厚年法6条・8条・10条・18条）に関する次の記述のうち、正しいものはどれか。", "choices": ["常時五人以上の従業員を使用する法定の事業の事業所は、事業主が厚生労働大臣の認可を受けてはじめて適用事業所となる。", "任意適用事業所の事業主が当該事業所を適用事業所でなくするには、厚生労働大臣の認可を受ける必要があり、その申請には被保険者となるべき者の二分の一以上の同意が必要である。", "強制適用事業所以外の事業所の事業主が当該事業所を適用事業所とするための厚生労働大臣の認可の申請には、使用される者の四分の三以上の同意が必要である。", "被保険者の資格の取得及び喪失は、例外なく、厚生労働大臣の確認によって、その効力を生ずる。", "適用事業所以外の事業所に使用される七十歳未満の者は、厚生労働大臣の認可を受けて被保険者となることができ、その認可を受けるには事業主の同意を得なければならない。"], "answer": 4, "explanation": "正しいのはE（10条）。\nA：6条1項1号の事業所は、認可を要せず当然に適用事業所となる（強制適用）。\nB：適用事業所でなくする場合（8条）の同意は四分の三以上。\nC：⚠️適用事業所とする場合（6条3項・4項）の同意は二分の一以上。BとCは数字が入れ替わっている。\nD：10条1項による任意単独被保険者の資格取得と、14条3号による資格喪失は、確認がなくても効力を生ずる（18条1項ただし書）。\n📌任意適用は取得「2分の1」、取消し「4分の3」。任意単独は「認可＋事業主の同意」。", "ref": {"label": "厚生年金保険法6条・8条・10条・18条", "url": "https://laws.e-gov.go.jp/law/329AC0000000115"}, "review_id": "20260815-4"}]};

// ---- サウンド(すべて端末内で合成するオリジナル音。外部音源なし) ----
let audioCtx = null;
function ctx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function tone(freq, start, dur, type, vol) {
  const c = ctx();
  const o = c.createOscillator(), g = c.createGain();
  o.type = type || 'square'; o.frequency.value = freq;
  g.gain.setValueAtTime(0, c.currentTime + start);
  g.gain.linearRampToValueAtTime(vol || 0.12, c.currentTime + start + 0.01);
  g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + start + dur);
  o.connect(g); g.connect(c.destination);
  o.start(c.currentTime + start); o.stop(c.currentTime + start + dur + 0.05);
}

  // メロディ
  [[523.25,0,.09],[659.25,.09,.09],[783.99,.18,.09],[1046.5,.27,.30],[880,.60,.12],[987.77,.72,.12]]
    .forEach(n => tone(n[0], n[1], n[2], 'square', .09));
  // ハモリ(3度下)
  [[659.25,.27,.30],[698.46,.60,.12],[783.99,.72,.12]]
    .forEach(n => tone(n[0], n[1], n[2], 'square', .05));
  // 締めの大和音(低音含む)
  [261.63,523.25,659.25,783.99,1046.5,1318.5].forEach(f => tone(f, .84, 1.6, 'triangle', .06));
  // きらめき
  tone(2093, 1.05, .3, 'sine', .05); tone(2637, 1.22, .3, 'sine', .05); tone(3135.96, 1.39, .45, 'sine', .04);
}
function sfxLevelUp() { if (!soundOn) return; [523.25,587.33,659.25,783.99,880,1046.5].forEach((f,i)=>tone(f,i*.07,.12,'triangle',.09)); }
const soundBtn = document.getElementById('soundBtn');
soundBtn.textContent = soundOn ? '🔊' : '🔇';
soundBtn.addEventListener('click', () => {
  soundOn = !soundOn;
  localStorage.setItem(SOUND_KEY, soundOn ? 'on' : 'off');
  soundBtn.textContent = soundOn ? '🔊' : '🔇';
  if (soundOn) sfxCorrect();
});

// ---- ステータス表示 ----
const G = QUIZ.game || null;
function xpThreshold(level) { return 100 * level; } // Lv n → n+1
function renderStatus(bonusXp, leveledTo) {
  if (!G) { document.getElementById('status').style.display = 'none'; return; }
  const el = document.getElementById('status');
  const xpNow = G.xp + (bonusXp || 0);
  let lv = leveledTo || G.level;
  const need = xpThreshold(lv);
  const prevSum = (function(){ let s=0; for(let i=1;i<lv;i++) s+=xpThreshold(i); return s; })();
  const inLv = Math.max(0, xpNow - prevSum);
  const pct = Math.min(100, Math.round(inLv / need * 100));
  let html = `<div class="toprow"><span class="lv">⚔️ Lv.${lv}</span><span class="streak">🔥 ${G.streak}日連続</span></div>`;
  html += `<div class="xpbar"><div class="fill" style="width:${pct}%"></div></div>`;
  html += `<div class="xptext">XP ${inLv} / ${need}${bonusXp ? `（今日 +${bonusXp}）` : ''}</div>`;
  if (G.stats && G.stats.length) {
    html += `<div class="statchips">` + G.stats.map(s =>
      `<span class="statchip"><b>${s.subject}</b> ${s.rank}${s.note ? ` ${s.note}` : ''}</span>`).join('') + `</div>`;
  }
  if (G.cursed && G.cursed.length) {
    html += `<div class="cursedbox">🟣 呪われた装備: ${G.cursed.map(c=>c.item).join('、')}<br>→ 🔁復習問題に正解すると解呪できる！</div>`;
  }
  el.innerHTML = html;
}
renderStatus(0);

// ---- 問題描画 ----
// ---- 📖 出撃前の講義(lessonがある日のみ。読了→出陣で問題を表示) ----
function mdLite(src) {
  const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return esc(src)
    .replace(/^# (.+)$/gm, '<h1>$1</h1>')
    .replace(/^## (.+)$/gm, '<h2>$1</h2>')
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/^- (.+)$/gm, '・$1')
    .replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>')
    .replace(/\n\n/g, '<br><br>')
    .replace(/\n/g, '<br>');
}
const hasLesson = !!QUIZ.lesson;
function deployQuiz(scroll) {
  document.getElementById('quiz').style.display = '';
  if (!graded) document.getElementById('gradeBtn').style.display = '';
  const d = document.getElementById('deployBtn');
  if (d) { d.textContent = '⚔️ 出陣中…下の魔物を討伐せよ'; d.disabled = true; d.style.opacity = .6; }
  if (scroll) document.getElementById('quiz').scrollIntoView({ behavior: 'smooth' });
}
if (hasLesson) {
  const L = QUIZ.lesson;
  document.getElementById('lessonCard').innerHTML =
    `<div id="lesson"><span class="ltag">📖 出撃前の講義 ・ 第${L.no}回</span>` +
    `<h2>${L.subject}「${L.topic}」</h2>` +
    `<div class="lbody">${mdLite(L.body)}</div>` +
    `<button id="deployBtn">⚔️ 講義を読んだ、出陣！（この範囲から3問でる）</button></div>`;
  document.getElementById('quiz').style.display = 'none';
  document.getElementById('gradeBtn').style.display = 'none';
  document.getElementById('deployBtn').addEventListener('click', () => { sfxCorrect(); deployQuiz(true); });
}

const quizEl = document.getElementById('quiz');
QUIZ.questions.forEach(q => {
  const card = document.createElement('div');
  card.className = 'q'; card.id = 'q' + q.no;
  let inner = `<span class="tag">問${q.no}｜${q.subject}${q.type==='fill'?'（選択式）':'（択一式）'}${q.uncurse?'　🔁復習':''}</span>`;
  if (q.monster) {
    inner += `<div class="monster">${q.monster.emoji} <span class="mname">${q.monster.name}</span> が現れた！${q.uncurse ? `（倒すと「${q.uncurse}」を解呪）` : ''}</div>`;
  }
  inner += `<div class="qtext">${q.text}</div>`;
  if (q.type === 'single') {
    q.choices.forEach((c, i) => {
      const m = String.fromCharCode(65 + i);
      inner += `<button class="choice" data-q="${q.no}" data-i="${i}"><span class="mark">${m}</span><span>${c}</span></button>`;
    });
  } else {
    q.blanks.forEach((b, bi) => {
      inner += `<div class="blank-group"><div class="blabel">【 ${b.label} 】</div><div class="opts">`;
      q.options.forEach((o, oi) => {
        inner += `<button class="opt" data-q="${q.no}" data-b="${bi}" data-i="${oi}">${CIRCLED[oi]}${o}</button>`;
      });
      inner += `</div></div>`;
    });
  }
  inner += `<div class="result-banner" id="banner${q.no}"></div>`;
  inner += `<div class="expl" id="expl${q.no}"></div>`;
  card.innerHTML = inner;
  quizEl.appendChild(card);
  state[q.no] = q.type === 'single' ? null : new Array(q.blanks.length).fill(null);
});

function saveState() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify({ state, graded })); } catch (e) {}
}
function applySelections() {
  QUIZ.questions.forEach(q => {
    if (q.type === 'single') {
      if (state[q.no] !== null) {
        const el = document.querySelector(`.choice[data-q="${q.no}"][data-i="${state[q.no]}"]`);
        if (el) el.classList.add('sel');
      }
    } else {
      state[q.no].forEach((v, bi) => {
        if (v !== null) {
          const el = document.querySelector(`.opt[data-q="${q.no}"][data-b="${bi}"][data-i="${v}"]`);
          if (el) el.classList.add('sel');
        }
      });
    }
  });
}

quizEl.addEventListener('click', e => {
  const btn = e.target.closest('button');
  if (!btn) return;
  if (btn.classList.contains('askBtn')) { askClaude(parseInt(btn.dataset.q)); return; }
  if (graded) return;
  const qno = parseInt(btn.dataset.q);
  if (btn.classList.contains('choice')) {
    document.querySelectorAll(`.choice[data-q="${qno}"]`).forEach(el => el.classList.remove('sel'));
    btn.classList.add('sel');
    state[qno] = parseInt(btn.dataset.i);
  } else if (btn.classList.contains('opt')) {
    const bi = parseInt(btn.dataset.b);
    document.querySelectorAll(`.opt[data-q="${qno}"][data-b="${bi}"]`).forEach(el => el.classList.remove('sel'));
    btn.classList.add('sel');
    state[qno][bi] = parseInt(btn.dataset.i);
  }
  saveState();
  updateBtn();
});

function allAnswered() {
  return QUIZ.questions.every(q =>
    q.type === 'single' ? state[q.no] !== null : state[q.no].every(v => v !== null));
}
function updateBtn() {
  const b = document.getElementById('gradeBtn');
  b.disabled = !allAnswered();
  b.textContent = allAnswered() ? '⚔️ 採点する' : '採点する（未回答あり）';
}

function questionContext(q) {
  let lines = [`社労士試験の学習中です。以下の問題について質問があります。`, ``, `【問題】問${q.no}（${q.subject}）`, q.text, ``];
  if (q.type === 'single') {
    lines.push(`【選択肢】`);
    q.choices.forEach((c, i) => lines.push(`${String.fromCharCode(65+i)}. ${c}`));
    lines.push(``, `【正解】${String.fromCharCode(65 + q.answer)}`);
  } else {
    lines.push(`【語群】` + q.options.map((o,i)=>`${CIRCLED[i]}${o}`).join(' '));
    lines.push(`【正解】` + q.blanks.map((b)=>`${b.label}=${CIRCLED[b.answer]}${q.options[b.answer]}`).join(' '));
  }
  lines.push(``, `【解説】`, q.explanation, ``, `【根拠】${q.ref.label} ${q.ref.url}`, ``, `私の質問: `);
  return lines.join('\n');
}
function askClaude(qno) {
  const q = QUIZ.questions.find(x => x.no === qno);
  const ctx2 = questionContext(q);
  if (navigator.clipboard) navigator.clipboard.writeText(ctx2).catch(()=>{});
  window.open('https://claude.ai/new?q=' + encodeURIComponent(ctx2), '_blank');
}

function doGrade(fromRestore) {
  graded = true;
  document.getElementById('quiz').style.display = '';
  const results = [];
  let gainedXp = 0;
  const uncursed = [];
  QUIZ.questions.forEach(q => {
    let ok;
    if (q.type === 'single') {
      ok = state[q.no] === q.answer;
      document.querySelectorAll(`.choice[data-q="${q.no}"]`).forEach(el => {
        const i = parseInt(el.dataset.i);
        if (i === q.answer) el.classList.add('correct');
        else if (i === state[q.no]) el.classList.add('wrong');
      });
    } else {
      ok = q.blanks.every((b, bi) => state[q.no][bi] === b.answer);
      q.blanks.forEach((b, bi) => {
        document.querySelectorAll(`.opt[data-q="${q.no}"][data-b="${bi}"]`).forEach(el => {
          const i = parseInt(el.dataset.i);
          if (i === b.answer) el.classList.add('correct');
          else if (i === state[q.no][bi]) el.classList.add('wrong');
        });
      });
    }
    results.push(ok);
    const banner = document.getElementById('banner' + q.no);
    const mname = q.monster ? q.monster.name : `問${q.no}`;
    const memoji = q.monster ? q.monster.emoji : '';
    if (ok) {
      const xp = q.uncurse ? 15 : 10;
      gainedXp += xp;
      if (q.uncurse) uncursed.push(q.uncurse);
      banner.textContent = `⚔️ ${memoji}${mname}を撃破！ +${xp}XP` + (q.uncurse ? `　🔓「${q.uncurse}」を解呪した！` : '');
      banner.className = 'result-banner ok';
    } else {
      banner.textContent = `💥 ${memoji}${mname}の攻撃！ 装備が呪われてしまった…（明日の🔁復習で解呪しよう）`;
      banner.className = 'result-banner ng';
    }
    const ex = document.getElementById('expl' + q.no);
    ex.style.display = 'block';
    ex.innerHTML = `<div style="white-space:pre-wrap">${q.explanation}</div>` +
      `<div class="ref">根拠：<a href="${q.ref.url}" target="_blank" rel="noopener">${q.ref.label}</a></div>` +
      `<button class="askBtn" data-q="${q.no}">🙋 この問題についてClaudeに質問する</button>`;
  });
  const score = results.filter(Boolean).length;
  const wrong = results.map((r, i) => r ? null : i + 1).filter(Boolean);
  const perfect = wrong.length === 0;
  if (perfect) gainedXp += 25;

  // 効果音(復元時は鳴らさない)
  if (!fromRestore) {
    if (perfect) sfxFanfare();
    else if (score >= 3) sfxCorrect();
    else sfxWrong();
  }

  // レベルアップ判定(暫定表示。正本は翌朝cronが同じ式で更新)
  let lvUpTo = null;
  if (G) {
    let lv = G.level, xp = G.xp + gainedXp;
    let sum = 0; for (let i = 1; i < lv; i++) sum += xpThreshold(i);
    while (xp - sum >= xpThreshold(lv)) { sum += xpThreshold(lv); lv++; }
    if (lv > G.level) lvUpTo = lv;
    renderStatus(gainedXp, lvUpTo || G.level);
  }

  document.getElementById('scoreText').textContent = `${score} / 5`;
  const gains = [`⚡ 獲得XP: +${gainedXp}` + (perfect ? '（全問正解ボーナス +25 含む）' : '')];
  if (uncursed.length) gains.push(`🔓 解呪: ${uncursed.join('、')}`);
  document.getElementById('gainsText').innerHTML = gains.join('<br>');
  if (lvUpTo) {
    const lu = document.getElementById('levelupText');
    lu.style.display = 'block';
    lu.textContent = `🎉 レベルアップ！ Lv.${G.level} → Lv.${lvUpTo}`;
    if (!fromRestore) setTimeout(sfxLevelUp, perfect ? 1600 : 500);
  }
  if (perfect && G && G.drop_on_perfect) {
    const d = document.getElementById('dropBox');
    d.style.display = 'block';
    d.textContent = `🎁 ${G.drop_on_perfect.emoji} 「${G.drop_on_perfect.name}」を手に入れた！`;
  }

  const sent = SUBMIT_URL && !SUBMIT_URL.startsWith('__');
  if (sent && !fromRestore) {
    try {
      fetch(SUBMIT_URL, {
        method: 'POST', mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({ date: QUIZ.date, score: score, wrong: wrong })
      });
    } catch (e) {}
  }
  const guide = document.getElementById('recordGuide');
  if (sent) {
    guide.innerHTML = `📡 結果は自動送信されました。翌朝ステータスに反映されます。<br><span class="memo">（予備: 記録されていなかったら ${wrong.length ? wrong.map(n => NUM_EMOJI[n-1]).join(' ') : '✅'} をSlack投稿にリアクション）</span>`;
  } else {
    guide.innerHTML = `記録のため、Slackの今日の投稿に ${wrong.length ? '間違えた問題の絵文字 ' + wrong.map(n => NUM_EMOJI[n-1]).join(' ') : '✅'} をリアクションしてください。`;
  }
  const resultText = `今日の結果 ${results.map((r, i) => `${i+1}${r ? '○' : '×'}`).join(' ')}`;
  document.getElementById('copyBtn').addEventListener('click', () => {
    navigator.clipboard.writeText(resultText).then(() => {
      document.getElementById('copyBtn').textContent = 'コピーしました ✓';
    });
  });
  document.getElementById('summary').style.display = 'block';
  document.getElementById('gradeBtn').style.display = 'none';
  if (!fromRestore) {
    saveState();
    document.getElementById('summary').scrollIntoView({ behavior: 'smooth' });
  }
}

document.getElementById('gradeBtn').addEventListener('click', () => {
  if (graded || !allAnswered()) return;
  doGrade(false);
});

(function restore() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) { updateBtn(); return; }
    const d = JSON.parse(raw);
    if (d && d.state) {
      Object.keys(d.state).forEach(k => { state[k] = d.state[k]; });
      applySelections();
      if (d.graded) doGrade(true);
      if (hasLesson) deployQuiz(false);   // 一度出陣していたらゲートを開けておく
    }
  } catch (e) {}
  updateBtn();
})();
</script>
