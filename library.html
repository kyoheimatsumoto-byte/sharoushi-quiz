<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>社労士 賢者の書庫</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1e3a5f">
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1a1d21; --sub: #616770;
    --accent: #2563eb; --accent-soft: #dbeafe; --border: #e3e6ea;
    --gold: #b45309; --gold-soft: #fef3c7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15171a; --card: #1f2226; --text: #e8eaed; --sub: #9aa2ab;
      --accent: #60a5fa; --accent-soft: #1e3a5f; --border: #33373d;
      --gold: #fbbf24; --gold-soft: #3a2e10;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    line-height: 1.85; padding: 16px 12px 40px; }
  .wrap { max-width: 680px; margin: 0 auto; }
  header h1 { font-size: 20px; margin: 8px 4px 4px; }
  header .meta { color: var(--sub); font-size: 13px; margin: 0 4px 6px; }
  .backlink { display: inline-block; margin: 6px 4px 16px; color: var(--accent); text-decoration: none; font-size: 14px; }
  .subject-head { font-size: 15px; font-weight: 800; margin: 20px 4px 8px; color: var(--sub); }
  details { background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    margin-bottom: 8px; overflow: hidden; }
  summary { padding: 12px 14px; cursor: pointer; font-weight: 700; font-size: 14.5px;
    display: flex; align-items: center; gap: 8px; list-style: none; }
  summary::-webkit-details-marker { display: none; }
  summary .no { font-size: 11.5px; background: var(--gold-soft); color: var(--gold);
    border-radius: 999px; padding: 1px 9px; flex-shrink: 0; font-weight: 800; }
  summary .date { margin-left: auto; font-size: 11.5px; color: var(--sub); font-weight: 400; flex-shrink: 0; }
  .body { padding: 4px 16px 14px; font-size: 14.5px; border-top: 1px dashed var(--border); }
  .body h1 { font-size: 16px; }
  .body h2 { font-size: 14.5px; color: var(--accent); margin: 16px 0 6px; }
  .body a { color: var(--accent); word-break: break-all; }
  .empty { color: var(--sub); font-size: 14px; background: var(--card); border: 1px dashed var(--border);
    border-radius: 12px; padding: 16px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>📚 賢者の書庫</h1>
    <div class="meta" id="meta"></div>
  </header>
  <a class="backlink" href="index.html">← 今日のクエストへ</a>
  <a class="backlink" href="zukan.html">📖 体系図鑑</a>
  <div id="list"></div>
</div>
<script>
const LIB = {"updated": "2026-11-20", "lessons": [{"no": 1, "subject": "労基", "topic": "総則・労働条件の原則", "date": "2026-11-10", "body": "# 労基法「労働条件の原則」ポイント1\n\n**労働基準法は、労働条件の「最低ライン」を定めた法律。** このラインを理由に労働条件を**下げてはいけない**(義務)し、**上げる努力**をしなければならない(努力義務)。\n\n⚠️ひっかけ: この義務を負うのは会社だけではなく「労働関係の当事者」＝**労使の双方**。\n\n根拠: 労基法1条 https://laws.e-gov.go.jp/law/322AC0000000049\n"}, {"no": 1, "subject": "労基", "topic": "総則・労働条件の原則", "date": "2026-11-11", "body": "# 労基法「労働条件の原則」ポイント2\n\n**労働条件は、労働者と使用者が「対等の立場」で決定すべきもの。** そして労使の双方が、決めたルールを守り、誠実に義務を果たさなければならない。\n\n⚠️ひっかけ: 守るべきものとして列挙されているのは「労働協約・就業規則・労働契約」の3つ。「法令」ではない。\n\n根拠: 労基法2条 https://laws.e-gov.go.jp/law/322AC0000000049\n"}, {"no": 1, "subject": "労基", "topic": "総則・労働条件の原則", "date": "2026-11-12", "body": "# 労基法「労働条件の原則」ポイント3\n\n**使用者は、労働者の「国籍・信条・社会的身分」を理由に、労働条件を差別してはならない（均等待遇）。** 対象は賃金だけでなく、労働時間その他の労働条件全般。\n\n⚠️ひっかけ: 3条の差別禁止事由に「性別」は無い。女性であることを理由とする差別は4条が定めており、しかも対象は「賃金」だけ。\n\n根拠: 労基法3条・4条 https://laws.e-gov.go.jp/law/322AC0000000049\n"}, {"no": 2, "subject": "労基", "topic": "労働契約", "date": "2026-11-13", "body": "# 労基法「労働契約」ポイント1\n\n**労基法の基準に達しない労働条件を定めた労働契約は、その部分だけが無効になる。** 無効になった部分は、労基法で定める基準に自動的に置き換わる。\n\n例: 契約書に「年休なし」と書いても、その部分は無効となり、労基法どおりの年休が発生する。\n\n⚠️ひっかけ: 無効になるのは「その部分」だけ。契約全体が無効になるわけではない。\n\n根拠: 労基法13条 https://laws.e-gov.go.jp/law/322AC0000000049\n"}, {"no": 2, "subject": "労基", "topic": "労働契約", "date": "2026-11-14", "body": "# 労基法「労働契約」ポイント2\n\n**期間の定めのある労働契約は、原則として3年を超える期間で結んではならない。** 例外として、高度の専門的知識等を持つ労働者（その業務に就く者に限る）と、満60歳以上の労働者との契約は5年まで。\n\n一定の事業の完了に必要な期間を定める契約（例: 4年かかる工事）は、この上限の対象外。\n\n⚠️ひっかけ: 5年になるのは「満60歳以上」。「満65歳以上」ではない。\n\n根拠: 労基法14条1項 https://laws.e-gov.go.jp/law/322AC0000000049\n"}, {"no": 2, "subject": "労基", "topic": "労働契約", "date": "2026-11-16", "body": "# 労基法「労働契約」ポイント3\n\n**使用者は、労働契約を結ぶときに、賃金・労働時間その他の労働条件を労働者に明示しなければならない。** 賃金・労働時間など省令で定める事項は、省令で定める方法（書面の交付など）で明示する。\n\n明示された労働条件が事実と違う場合、労働者は即時に労働契約を解除できる。就業のために住居を変えた労働者が、解除の日から14日以内に帰郷する場合は、使用者が必要な旅費を負担する。\n\n⚠️ひっかけ: 解除は「即時」にできる。30日前の予告などは要らない。\n\n根拠: 労基法15条 https://laws.e-gov.go.jp/law/322AC0000000049\n"}, {"no": 3, "subject": "労基", "topic": "賃金", "date": "2026-11-17", "body": "# 労基法「賃金」ポイント1\n\n**賃金は「通貨で・直接・全額を・毎月1回以上・一定の期日に」支払う（賃金支払の5原則）。**\n\n通貨払の例外は、法令・労働協約に定めがある場合や、省令で定める確実な方法（労働者の同意を得た口座振込など）。全額払の例外（控除）は、法令に定めがある場合や労使協定（書面）がある場合。賞与など臨時の賃金は「毎月1回以上・一定期日」の対象外。\n\n⚠️ひっかけ: 現物給与は「労働協約」、控除は「労使協定」。取り違えに注意。\n\n根拠: 労基法24条 https://laws.e-gov.go.jp/law/322AC0000000049\n"}, {"no": 3, "subject": "労基", "topic": "賃金", "date": "2026-11-18", "body": "# 労基法「賃金」ポイント2\n\n**使用者の責に帰すべき事由で休業させたら、休業期間中、平均賃金の100分の60以上の休業手当を支払う。**\n\n「60以上」は最低ライン。全額でなくても労基法違反にはならない。なお、出産・疾病・災害などの非常時の費用に充てるため労働者が請求したら、支払期日前でも既往の労働分の賃金を払う（非常時払・25条）。\n\n⚠️ひっかけ: 休業手当の基準は「平均賃金」の60%。「通常の賃金」や「標準報酬」ではない。\n\n根拠: 労基法26条・25条 https://laws.e-gov.go.jp/law/322AC0000000049\n"}, {"no": 3, "subject": "労基", "topic": "賃金", "date": "2026-11-19", "body": "# 労基法「賃金」ポイント3\n\n**出来高払制その他の請負制の労働者には、使用者は「労働時間に応じ」一定額の賃金を保障しなければならない（出来高払制の保障給）。**\n\n成果がゼロでも、働いた時間に応じた最低限の収入を確保させる趣旨。なお、賃金の最低基準そのものは労基法ではなく最低賃金法の定めによる（28条）。\n\n⚠️ひっかけ: 保障給は「労働時間に応じ」た一定額。「出来高に応じ」「月額で一律」ではない。\n\n根拠: 労基法27条・28条 https://laws.e-gov.go.jp/law/322AC0000000049\n"}, {"no": 4, "subject": "労基", "topic": "労働時間・休憩・休日", "date": "2026-11-20", "body": "# 労基法「労働時間・休憩・休日」ポイント1\n\n**法定労働時間は、休憩時間を除き「1週40時間」「1日8時間」。これを超えて労働させてはならない。**\n\n1週と1日、両方の上限が同時にかかる。どちらか一方を守っていればよい、ではない。超えて働かせるには36協定などの例外手続が必要。\n\n⚠️ひっかけ: 8時間・40時間は「休憩時間を除いた」時間。休憩を含めて数えるのではない。\n\n根拠: 労基法32条 https://laws.e-gov.go.jp/law/322AC0000000049\n"}]};

document.getElementById('meta').textContent =
  `毎朝の講義がここに蓄積されます（${LIB.lessons.length}講 収蔵）｜ 更新日: ${LIB.updated}`;

// 簡易Markdown描画(見出し・太字・箇条書きのみ)
function md(src) {
  const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return esc(src)
    .replace(/^# (.+)$/gm, '<h1>$1</h1>')
    .replace(/^## (.+)$/gm, '<h2>$1</h2>')
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/^- (.+)$/gm, '・$1')
    .replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>')
    .replace(/\n\n/g, '<br><br>')
    .replace(/\n/g, '<br>');
}

const listEl = document.getElementById('list');
if (!LIB.lessons.length) {
  listEl.innerHTML = '<div class="empty">まだ講義がありません。明日の朝から1日1講ずつ増えていきます。</div>';
} else {
  let html = '', lastSubject = null;
  LIB.lessons.forEach(l => {
    if (l.subject !== lastSubject) {
      html += `<div class="subject-head">▼ ${l.subject}</div>`;
      lastSubject = l.subject;
    }
    html += `<details${l.no === LIB.lessons.length ? ' open' : ''}>
      <summary><span class="no">第${l.no}回</span>${l.topic}<span class="date">${l.date || ''}</span></summary>
      <div class="body">${md(l.body)}</div>
    </details>`;
  });
  listEl.innerHTML = html;
}
</script>
</body>
</html>
