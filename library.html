const LIB = {"updated": "2026-10-28", "lessons": [{"no": 1, "subject": "労基", "topic": "総則・労働条件の原則", "date": "2026-09-24", "body": "# 第1回 労働基準法「総則・労働条件の原則」（労基法1〜4条）\n\n## この法律は何のためにあるか\n労働基準法は、働く人の労働条件について国が定めた「最低ライン」のルール集です。会社と労働者が個別に何を約束しようと、このラインを下回る条件は許されません。社労士試験10科目の最初の柱であり、すべての労働法の土台になります。\n\n## 条文の中身（ここが出る）\n**1条1項**：「労働条件は、労働者が人たるに値する生活を営むための必要を充たすべきものでなければならない。」— 憲法25条(生存権)の理念を労働条件に落とし込んだ宣言です。「人たるに値する生活」という言葉は選択式の超頻出ワード。\n\n**1条2項**：この法律の基準は「最低」のもの。だから労働関係の当事者は、①この基準を理由に労働条件を**低下させてはならない**、②その**向上を図るように努め**なければならない。低下禁止は義務、向上は努力義務、という強弱の違いに注意。義務を負う主体は「労働関係の当事者」＝使用者だけでなく労働者側も含む点がひっかけどころ。\n\n**2条**：労働条件は労使が**対等の立場**で決定すべきもの。そして労使は労働協約・就業規則・労働契約を**遵守し、誠実に義務を履行**しなければならない。\n\n**3条(均等待遇)**：使用者は、労働者の**国籍・信条・社会的身分**を理由として、賃金・労働時間その他の労働条件について差別的取扱いをしてはならない。⚠️ この3つは限定列挙で、**「性別」は含まれない**（性別による賃金差別は次の4条、賃金以外の性差別は男女雇用機会均等法の守備範囲）。試験で最も狙われるポイント。\n\n**4条(男女同一賃金)**：使用者は、労働者が**女性であることを理由**として、**賃金について**男性と差別的取扱いをしてはならない。⚠️ 対象は「賃金」だけ。労働時間や配置の性差別は4条違反ではない。\n\n## 覚え方のコツ\n「1条＝理念(人たるに値する)」「2条＝対等・遵守」「3条＝国籍・信条・社会的身分(性別なし)」「4条＝女性×賃金だけ」。3条と4条の守備範囲の違いを言えれば、この論点はほぼ完成です。\n\n## まとめ3行\n- 労基法は労働条件の**最低基準**。低下禁止(義務)＋向上努力(努力義務)、主体は労使双方\n- 3条の差別禁止は**国籍・信条・社会的身分**の3つ限定。性別は入らない\n- 4条は**女性の賃金差別**だけを禁止。賃金以外は均等法の領域\n\n根拠：労基法1〜4条 https://laws.e-gov.go.jp/law/322AC0000000049\n"}, {"no": 2, "subject": "労基", "topic": "労働契約", "date": "2026-09-26", "body": "# 第2回 労働基準法「労働契約」（労基法13〜18条）\n\n## この制度は何のためにあるか\n働き始めるとき、会社と労働者は「労働契約」を結びます。でも立場の強い会社が、長すぎる拘束期間や罰金のルール、借金で縛るような契約を押し付けたら、労働者は辞めたくても辞められません。そこで労基法は、**契約の中身そのものに歯止め**をかけています。前回（1〜4条）が「理念」なら、今回は「契約の入口で何を禁止するか」の具体編です。\n\n## 条文の中身（ここが出る）\n**13条（この法律違反の契約）**：労基法の基準に達しない労働条件を定める労働契約は、**その部分については無効**。無効になった部分は、**この法律で定める基準による**。⚠️ 契約全体が無効になるのではなく「その部分だけ」無効で、空いた穴は労基法の基準で自動的に埋まる（強行的・直律的効力）。\n\n**14条（契約期間）**：期間の定めのない契約と「一定の事業の完了に必要な期間」を定める契約を除き、契約期間の上限は**3年**。ただし次の2つは**5年**まで。\n- ①**高度の専門的知識等**を持つ労働者（厚生労働大臣が定める基準に該当し、その業務に就く者）\n- ②**満60歳以上**の労働者\n⚠️ 上限は「5年」であって「無制限」ではない。また、3年・5年は1回の契約期間の上限の話で、更新の回数制限ではない。\n\n**15条（労働条件の明示）**：使用者は労働契約の締結に際し、**賃金・労働時間その他の労働条件**を明示しなければならない（賃金・労働時間など省令で定める事項は、省令で定める方法＝原則書面で）。\n- 明示された条件が**事実と相違**する場合、労働者は**即時に**労働契約を解除できる（2項）\n- 就業のために住居を変更した労働者が、契約解除の日から**14日以内**に帰郷する場合、使用者は**必要な旅費**を負担する（3項）\n\n**16条（賠償予定の禁止）**：使用者は、労働契約の不履行について**違約金を定め**、又は**損害賠償額を予定する**契約をしてはならない。⚠️ 禁止されているのは「あらかじめ金額を決めておくこと」。労働者のミスで**実際に生じた損害**について、使用者が賠償を請求すること自体は禁止されていない。\n\n**17条（前借金相殺の禁止）**：使用者は、前借金その他労働することを条件とする前貸の債権と**賃金を相殺**してはならない。⚠️ お金を貸すこと自体は禁止されていない。禁止は「給料から天引きで回収すること」。\n\n**18条（強制貯金）**：労働契約に**附随して**貯蓄の契約をさせたり、貯蓄金を管理する契約をすることは禁止（1項）。一方、労働者の**委託を受けて**管理する「任意貯金」は、過半数労働組合（なければ過半数代表者）との**書面協定＋行政官庁への届出**などを条件に認められる（2項以下）。返還請求があれば**遅滞なく**返還。\n\n## 覚え方のコツ\n「**13＝部分無効、14＝3年(特例5年)、15＝明示→違えば即時解除・14日で旅費、16＝罰金の予約NG、17＝天引き回収NG、18＝強制貯金NG**」。16〜18条は「辞めたいのに辞められない足かせ」を外す3点セットと覚えると、何が禁止で何がOKかの線引きがブレません。\n\n## まとめ3行\n- 労基法を下回る契約は**その部分だけ無効**→労基法の基準で埋まる（13条）\n- 契約期間の上限は**3年**、高度専門職と**満60歳以上**は**5年**（14条）\n- 明示と違えば**即時解除**＋**14日以内**の帰郷旅費。違約金・賠償額の予定、前借金相殺、強制貯金は禁止（15〜18条）\n\n根拠：労基法13〜18条 https://laws.e-gov.go.jp/law/322AC0000000049\n"}, {"no": 3, "subject": "労基", "topic": "賃金", "date": "2026-09-27", "body": "# 第3回 労働基準法「賃金」（労基法11・12・23〜28条）\n\n## この制度は何のためにあるか\n働く人にとって賃金は生活そのもの。払い方を会社の都合に任せると「現物で払う」「借金と相殺する」「数か月まとめて払う」「会社都合で休ませて無給」といったことが起こり得ます。そこで労基法は、**賃金とは何か（定義）**、**どう払うか（支払方法）**、**払えない・働けないときの最低保障**をセットで定めています。前回の「労働契約」で入口を押さえたので、今回は契約の中心である「お金」の守り方です。\n\n## 条文の中身（ここが出る）\n**11条（賃金の定義）**：賃金とは、賃金・給料・手当・賞与**その他名称の如何を問わず**、**労働の対償**として使用者が労働者に支払うすべてのもの。⚠️ 名前ではなく「労働の対償かどうか」で決まる。\n\n**12条（平均賃金）**：算定すべき事由の発生した日**以前3箇月間**に支払われた賃金の総額を、その期間の**総日数**（暦日数）で除した金額。\n- 日給・時間給・出来高払制などの場合は、賃金総額÷**労働した日数**×**100分の60**を最低保障とする（1項ただし書）\n- 賃金締切日があれば**直前の賃金締切日**から起算（2項）\n- 業務上の傷病による休業期間、産前産後休業、**使用者の責めに帰すべき休業**、育児・介護休業、**試みの使用期間**は、日数・賃金とも控除（3項）\n- **臨時に支払われた賃金**、**3箇月を超える期間ごと**に支払われる賃金（年2回の賞与など）は総額に算入しない（4項）\n⚠️ 分母は「労働日数」ではなく原則「**総日数**」。労働日数で割るのは最低保障の計算だけ。\n\n**23条（金品の返還）**：労働者の死亡・退職時に**権利者の請求**があれば、**7日以内**に賃金を支払い、積立金・保証金・貯蓄金など労働者の権利に属する金品を返還する。争いがあれば**異議のない部分**を期間内に。\n\n**24条（賃金支払の5原則）**：①**通貨**で ②**直接**労働者に ③**全額**を ④**毎月1回以上** ⑤**一定の期日**を定めて支払う。\n- 通貨払の例外：法令・**労働協約**の定め、省令で定める確実な支払方法（口座振込等）\n- 全額払の例外（控除）：法令の定め（税金・社会保険料）、または**過半数組合（なければ過半数代表者）との書面協定**\n- ⚠️ 通貨払の例外は「労働協約」（労働組合とだけ結べる）、控除の例外は「労使協定」。**根拠の種類が違う**のが頻出のひっかけ\n- 臨時の賃金・賞与などは④⑤の対象外\n\n**25条（非常時払）**：出産・疾病・災害など非常の場合の費用として労働者が請求したら、**支払期日前でも既往の労働に対する賃金**を支払う。⚠️ まだ働いていない分（将来分）の前払い義務ではない。\n\n**26条（休業手当）**：**使用者の責に帰すべき事由**による休業では、休業期間中、**平均賃金の100分の60以上**の手当を支払う。\n\n**27条（出来高払制の保障給）**：出来高払制・請負制で使用する労働者には、**労働時間に応じ一定額**の賃金を保障する。\n\n**28条（最低賃金）**：賃金の最低基準は**最低賃金法**の定めるところによる。\n\n## 覚え方のコツ\n数字は「**12条＝3箇月・総日数・最低保障60%**」「**23条＝7日**」「**26条＝60%**」。100分の60は12条と26条の2か所に出てくるので、まとめて覚えると効率的です。5原則は「**つう・ちょく・ぜん・まい・いち**（通貨・直接・全額・毎月・一定期日）」と唱えます。\n\n## まとめ3行\n- 賃金＝名称を問わず**労働の対償**。平均賃金＝**以前3箇月**の総額÷**総日数**（臨時・3箇月超の賞与は除く）\n- 支払は**通貨・直接・全額・毎月1回以上・一定期日**。通貨の例外は**労働協約**、控除の例外は**労使協定**\n- 退職時は請求から**7日以内**、非常時は**既往の労働分**を期日前に、会社都合の休業は**平均賃金の60%以上**\n\n根拠：労基法11条・12条・23〜28条 https://laws.e-gov.go.jp/law/322AC0000000049\n"}, {"no": 4, "subject": "労基", "topic": "労働時間・休憩・休日", "date": "2026-09-28", "body": "# 第4回 労働基準法「労働時間・休憩・休日」（労基法32・34〜37・41条）\n\n## この制度は何のためにあるか\n前回の「賃金」はお金の守り方でした。今回は**時間**の守り方です。放っておくと長時間労働は際限なく広がり、健康も生活も壊れます。そこで労基法は「働かせてよい時間の上限（法定労働時間）」「途中で必ず休ませる（休憩）」「週に1日は休ませる（休日）」を原則として定め、それを超えるには**36協定**という手続と**割増賃金**という代償を求めています。\n\n## 条文の中身（ここが出る）\n**32条（法定労働時間）**：休憩時間を除き、**1週間40時間**・**1日8時間**を超えて労働させてはならない。\n\n**34条（休憩）**\n- 労働時間が**6時間を超える**場合は少なくとも**45分**、**8時間を超える**場合は少なくとも**1時間**の休憩を、労働時間の**途中**に与える（1項）\n- 休憩は**一斉**に与えるのが原則。ただし過半数組合（なければ過半数代表者）との**書面による協定**があれば一斉でなくてよい（2項）\n- 休憩時間は**自由に利用**させなければならない（3項）\n- ⚠️ 基準は「6時間**を超える**」「8時間**を超える**」。ちょうど6時間なら休憩の義務なし、ちょうど8時間なら45分で足りる\n\n**35条（休日）**：**毎週少なくとも1回**の休日を与える（1項）。ただし**4週間を通じ4日以上**の休日を与える使用者には1項は適用しない（2項＝変形休日制）。\n- ⚠️ 条文は「日曜日」や「国民の祝日」を休日にせよとは言っていない。曜日の指定はない\n\n**36条（時間外・休日労働＝36協定）**：過半数組合（なければ過半数代表者）と**書面による協定**をし、それを**行政官庁に届け出た**場合に限り、32条等の労働時間・35条の休日の規定にかかわらず、協定の範囲で時間外・休日労働をさせられる。\n- 限度時間は原則**1箇月45時間・1年360時間**（4項）\n- 協定があっても、時間外＋休日労働は**1箇月100時間未満**、2〜6箇月平均**80時間以内**（6項）\n- ⚠️ 協定は**結ぶだけでは足りず、届出**まで必要。ここが34条2項（休憩の一斉付与の例外＝協定のみで届出不要）との違い\n\n**37条（割増賃金）**\n- 時間外・休日労働：**2割5分以上5割以下**の範囲で政令で定める率以上（1項）。時間外が**1箇月60時間を超えた**部分は**5割以上**\n- 深夜（原則**午後10時〜午前5時**）の労働：**2割5分以上**（4項）\n- 割増の基礎から**家族手当・通勤手当**など省令で定める賃金は除く（5項）\n\n**41条（適用除外）**：①農業・畜産・水産業の事業に従事する者（林業は除く）、②**監督若しくは管理の地位にある者**・機密の事務を取り扱う者、③監視・断続的労働に従事する者で**行政官庁の許可**を受けたもの、には**労働時間・休憩・休日**の規定を適用しない。\n- ⚠️ 除外されるのは「労働時間・休憩・休日」の3つ。③だけは**許可**が要件\n\n## 覚え方のコツ\n「**40・8**（週40時間・1日8時間）」「**6超45分・8超1時間**」「**週1回 or 4週4日**」をまず固めます。36協定の限度時間は「**月45・年360**」、上限規制は「**100未満・平均80**」。手続は「休憩の一斉付与の例外＝協定だけ」「36協定＝協定＋届出」と、**届出の有無**で区別しましょう。\n\n## まとめ3行\n- 法定労働時間は**週40時間・1日8時間**。休憩は**6時間超45分・8時間超1時間**を**途中に・一斉に・自由に**\n- 休日は**毎週1回**が原則、例外は**4週4日**。曜日の指定はない\n- 時間外・休日労働は**36協定の締結＋届出**が必要。割増は時間外**2割5分**以上（月60時間超は**5割**以上）、深夜**2割5分**以上\n\n根拠：労基法32条・34〜37条・41条 https://laws.e-gov.go.jp/law/322AC0000000049\n"}, {"no": 5, "subject": "労基", "topic": "年次有給休暇", "date": "2026-09-29", "body": "# 第5回講義：労基法「年次有給休暇」（労基法39条）\n\n## この制度は何のためにあるか\n\n年次有給休暇は、労働者の心身の疲労回復と生活の質の維持のために、賃金を減らさずに休む権利を法律で保障した制度。使用者の許可制ではなく、要件を満たせば法律上当然に発生する権利であり、使用者はこれを与える「義務」を負う。\n\n## 条文の中身（ここが出る）\n\n**発生要件（39条1項）**：雇入れの日から起算して**六箇月間継続勤務**し、全労働日の**八割以上出勤**した労働者に対し、**十労働日**の有給休暇を与えなければならない。\n\n**加算（39条2項）**：1年6か月以上継続勤務した者には、6か月経過日から起算した継続勤務年数1年ごとに、以下の日数を加算する。\n\n| 継続勤務年数（6か月経過日起算） | 加算日数 | 合計日数 |\n|---|---|---|\n| 1年 | +1日 | 11日 |\n| 2年 | +2日 | 12日 |\n| 3年 | +4日 | 14日 |\n| 4年 | +6日 | 16日 |\n| 5年 | +8日 | 18日 |\n| 6年以上 | +10日 | 20日 |\n\n⚠️ **ただし書**：各1年間の区分の初日の前日が属する期間の出勤率が8割未満だった者には、その年は有給休暇を与えなくてよい（＝出勤率8割の判定は毎年行われ、一度10日発生した後も油断できない）。\n\n**比例付与（39条3項）**：週の所定労働日数が通常の労働者より相当程度少ない労働者（パート等）には、上記日数を比率按分した日数を与える（詳細な日数表は省令で規定）。\n\n**時間単位年休（39条4項）**：労使協定により、年5日以内の範囲で時間単位の年休を与えることができる。\n\n**時季指定権・時季変更権（39条5項）**：年休は労働者が請求する時季に与えるのが原則。ただし事業の正常な運営を妨げる場合は、使用者は他の時季に変更できる（＝拒否権ではなく変更権）。\n\n**計画的付与（39条6項）**：労使協定により、年休のうち**5日を超える部分**に限り、あらかじめ時季を定めて与えることができる。\n\n**使用者の時季指定義務（39条7項・8項）**：年10労働日以上の年休が発生する労働者に対し、使用者は基準日から1年以内に**5日**について、労働者ごとに時季を定めて取得させなければならない。⚠️ 労働者自身の請求や計画的付与で既に取得した日数があれば、その分を5日から差し引ける（合計5日取得済みなら使用者の追加指定は不要）。この義務の履行に労使協定は不要（計画的付与＝協定必須、時季指定義務＝協定不要、の対比を混同しないこと）。\n\n**賃金（39条9項）**：年休中の賃金は、平均賃金・通常の賃金・労使協定があれば健康保険法の標準報酬月額の30分の1相当額のいずれかを就業規則等で定めて支払う。\n\n**出勤率算定の特例（39条10項）**：業務上の傷病による休業期間、育児休業・介護休業期間、産前産後休業期間は、出勤率算定上「出勤したものとみなす」。\n\n## 覚え方のコツ\n\n「6・8・10」（6か月・8割・10日）が基礎。そこから先は「1→2→4→6→8→10」という加算日数の数列（初年度以降、2日ずつ増えて最後だけ据え置き）をセットで覚える。時季変更権は「変更」であって「拒否」ではない点、計画的付与（協定必要・5日超部分）と時季指定義務（協定不要・5日分・控除あり）の役割分担を対で覚えるのがコツ。\n\n## まとめ3行\n\n1. 6か月継続勤務＋8割出勤で10労働日、以降は年数に応じて最大20労働日まで加算される。\n2. 計画的付与（労使協定・5日超部分）と使用者の時季指定義務（協定不要・5日・控除あり）は別制度。\n3. 業務災害療養・育休・介護休業・産前産後休業の期間は出勤率算定上「出勤したもの」とみなす。\n\n根拠条文：労働基準法39条 https://laws.e-gov.go.jp/law/322AC0000000049\n"}, {"no": 6, "subject": "労基", "topic": "年少者・妊産婦", "date": "2026-09-30", "body": "# 第6回講義：労基法「年少者・妊産婦」（労基法56〜68条）\n\n## この制度は何のためにあるか\n\n年少者（18歳未満）と妊産婦（妊娠中及び産後1年を経過しない女性）は、心身の発達途上・母体保護の観点から、成人の労働者と同じ保護水準では足りない。労基法第6章・第6章の2は、この2者について「通常の保護（労働時間・休日等の一般規定）に上乗せする」形で、就業を制限したり、本人の請求を条件に追加の保護を発動したりする構造になっている。\n\n## 条文の中身（ここが出る）\n\n**最低年齢（56条）**：使用者は、児童が**満15歳に達した日以後の最初の3月31日**が終了するまで使用してはならない。⚠️ 単純な「15歳未満」ではなく、中学卒業年度末までという扱い。例外的に、非工業的事業等では行政官庁の許可を受けて**満13歳以上**（修学時間外）、映画製作・演劇では**13歳未満も**使用可。\n\n**年少者の証明書（57条）**：18歳未満は年齢証明の戸籍証明書を事業場に備付け。\n\n**未成年者の労働契約（58・59条）**：親権者・後見人は未成年者に代わって労働契約を締結**できない**（不利な契約は将来に向かって解除は可）。賃金は未成年者本人が独立して請求でき、親権者等が代理受領することも**できない**。\n\n**年少者の労働時間（60条）・深夜業（61条）**：18歳未満には変形労働時間制・36協定による時間外・フレックス等の規定は適用しない。深夜業（22時〜5時）は原則禁止。⚠️ 例外は「交替制によって使用する**満16歳以上の男性**」のみ（数少ない男女で扱いが異なる規定）。\n\n**危険有害業務・坑内労働（62・63条）**：18歳未満は危険有害業務・坑内労働に一律就かせてはならない。\n\n**帰郷旅費（64条）**：18歳未満の者が解雇の日から**14日以内**に帰郷する場合、使用者は旅費を負担。⚠️ 例外は「労働者の責めに帰すべき事由」**かつ**「行政官庁の認定」の両方が揃った場合のみ（認定だけでは免除されない）。\n\n**坑内業務の就業制限（64条の2）**：妊娠中の女性、及び坑内業務に従事しない旨を申し出た産後1年未経過の女性は坑内業務に**全面禁止**。それ以外の18歳以上の女性は、有害な坑内業務のみ禁止（全面禁止ではない）。⚠️ このランク分けが混同ポイント。\n\n**産前産後（65条）**：産前は**6週間**（多胎14週間）以内に出産予定の女性が**請求**すれば就業させてはならない。産後は**8週間**は就業させてはならないが、**6週間経過後**は本人の請求＋**医師が支障ないと認めた業務**に限り就業可。⚠️ 産前は「請求のみ」で足りるが、産後の早期復帰は「請求＋医師の認定」の両方が必要という非対称性が狙われる。妊娠中の女性は軽易業務への転換も請求できる。\n\n**妊産婦の就業制限（66条）**：妊産婦が**請求した場合**、変形労働時間制の適用・時間外労働・休日労働・深夜業をさせてはならない。⚠️ 当然に禁止されるのではなく、常に「請求」が起点。\n\n**育児時間（67条）**：生後1年未満の生児を育てる女性は、休憩時間のほか**1日2回各30分以上**、育児のための時間を請求できる。\n\n**生理日の休暇（68条）**：生理日の就業が著しく困難な女性が休暇を請求したときは、その日は就業させてはならない。\n\n## 覚え方のコツ\n\n年少者は「保護は自動発動」（証明書備付け・深夜業禁止などは請求不要）、妊産婦は「保護の多くは本人の請求が起点」（66条の各制限・67条の育児時間・68条の生理休暇はすべて請求ベース）という違いで整理すると混同しにくい。産前産後だけは例外的に「産後8週間は請求なしで一律禁止」という強い保護がかかる点をセットで覚える。\n\n## まとめ3行\n\n1. 最低年齢は「満15歳に達した日以後最初の3/31」まで。深夜業の例外は交替制の満16歳以上男性のみ。\n2. 産前は請求で足りるが、産後6〜8週の早期復帰は請求＋医師の認定が必要（非対称）。\n3. 妊産婦の変形労働時間・時間外休日・深夜業の制限、育児時間、生理休暇はいずれも本人の請求があって初めて発動する。\n\n根拠条文：労働基準法56〜68条 https://laws.e-gov.go.jp/law/322AC0000000049\n"}, {"no": 7, "subject": "労基", "topic": "解雇・退職", "date": "2026-10-01", "body": "# 第7回 労働基準法「解雇・退職」（労基法19〜23条）\n\n## この法律は何のためにあるか\n解雇は労働者の生活基盤を一瞬で奪う行為です。労基法はクビそのものを禁じる法律ではありませんが、「弱っているときに解雇するな(19条)」「解雇するなら予告しろ(20条)」「辞めた後の証明・金品はきちんと渡せ(22・23条)」という最低限の手続きルールを置き、労働者が転職活動や生活再建の準備をできるようにしています。労働契約の「終わり方」を規律する章です。\n\n## 条文の中身（ここが出る）\n**19条(解雇制限)**：使用者は、①業務上負傷・疾病による療養のための休業期間＋その後30日間、②産前産後の女性が65条により休業する期間＋その後30日間、は解雇できません。⚠️ 例外は2つだけ：打切補償(81条)を支払った場合、または天災事変その他やむを得ない事由で事業継続が不可能になった場合。後者は**行政官庁の認定**を受けなければ例外として扱われません(19条2項)。\n\n**20条(解雇の予告)**：解雇するには少なくとも**30日前に予告**するか、**30日分以上の平均賃金**(解雇予告手当)を支払う必要があります。1日分の平均賃金を支払うごとに予告日数を1日短縮できます。⚠️ この「30日」は19条の解雇制限期間の「30日」とは別物。19条は解雇そのものを禁止する期間、20条は解雇するときの手続き期間です。例外（予告不要）は天災事変等または**労働者の責に帰すべき事由**による解雇で、こちらも行政官庁の認定が必要です。\n\n**21条(予告の適用除外)**：次の4類型は原則20条の適用がありませんが、⚠️一定期間を超えて引き続き使用されると適用される点が最大のひっかけです。\n- 日々雇い入れられる者 → **1箇月**を超えて引き続き使用で適用あり\n- 2箇月以内の期間を定めて使用される者 → **所定の期間**を超えて引き続き使用で適用あり\n- 季節的業務に4箇月以内の期間を定めて使用される者 → **所定の期間**を超えて引き続き使用で適用あり\n- 試の使用期間中の者 → **14日**を超えて引き続き使用で適用あり\n\n**22条(退職時等の証明)**：労働者が退職した場合、使用期間・業務の種類・地位・賃金・退職の事由（解雇ならその理由も）について証明書を請求したら、使用者は**遅滞なく**交付しなければなりません。さらに、解雇予告された日から退職日までの間に解雇理由の証明書を請求された場合も遅滞なく交付義務がありますが、⚠️予告後に労働者が解雇以外の理由で退職した場合は、その退職日以後は交付不要になります。証明書には労働者が請求していない事項を書いてはいけません(ブラックリスト防止)。\n\n**23条(金品の返還)**：労働者の死亡・退職の場合、権利者から請求があれば**7日以内**に賃金を支払い、積立金・保証金・貯蓄金など名称を問わず労働者の権利に属する金品を返還しなければなりません。賃金や金品について争いがある場合でも、異議のない部分は同じ7日以内に支払う義務があります。\n\n## 覚え方のコツ\n「19条＝解雇できない期間（休業＋30日）」「20条＝解雇するときの予告（30日 or 手当）」「21条＝予告除外の4類型と、それぞれ違う足切り日数（1箇月／所定期間／所定期間／14日）」「22条＝証明書は遅滞なく」「23条＝退職時の金品は7日以内」。数字が5種類（30日・30日・1箇月・14日・7日）出てくるので、どの条文のどの数字かをセットで覚えるのがコツです。\n\n## まとめ3行\n- 19条の解雇制限（休業＋30日）と20条の解雇予告（30日前 or 手当）は、どちらも「30日」だが**別の制度**\n- 21条の予告除外4類型は、日雇=1箇月／有期2類型=所定の期間／試用=14日、を超えると適用される\n- 退職時の証明書は**遅滞なく**、金品の返還は**7日以内**\n\n根拠：労基法19〜23条 https://laws.e-gov.go.jp/law/322AC0000000049\n\n"}, {"no": 8, "subject": "労基", "topic": "就業規則・監督機関", "date": "2026-10-02", "body": "# 第8回 労働基準法「就業規則・監督機関」\n\n※本日（2026-10-02）はe-Gov法令APIがシステムメンテナンス中のため、条文番号・条文の正確な文言を確認できませんでした。そのため本講は**制度の仕組み**を中心に解説し、具体的な条文番号の明記は避けています（次回API復旧時に条文番号を確定させます）。\n\n## この制度は何のためにあるか\n労働条件は本来、労働者と使用者が個別に合意して決めるものですが、現実には使用者が一方的にルールを定め、労働者は従わざるを得ないことがほとんどです。就業規則は、そうした職場のルールを**文書化して周知**させることで、労使双方にとって「何が決まっているか」を見える化し、場当たり的な不利益変更を防ぐ仕組みです。監督機関は、行政がそのルールが守られているかを事業場に立ち入って確認し、違反があれば是正させる仕組みです。\n\n## 制度の中身（ここが出る）\n**就業規則の作成・届出義務**：常時**10人以上**の労働者を使用する使用者は、就業規則を作成し、所轄の労働基準監督署長に届け出なければなりません。⚠️ この「10人」は事業場単位でカウントし、パート・アルバイトも人数に含みます。本社だけでなく、各事業場ごとに判定する点に注意。\n\n**意見聴取**：就業規則を作成・変更するときは、その事業場に労働者の過半数で組織する労働組合がある場合はその労働組合、なければ労働者の過半数を代表する者の**意見を聴かなければ**なりません。⚠️最大のひっかけ：ここで必要なのは「意見聴取」であって「同意」ではありません。意見書に反対の意見が書かれていても、届出自体は受理されます。\n\n**記載事項（絶対的／相対的）**：\n- 絶対的必要記載事項（必ず定めて記載しなければならない）：始業・終業の時刻、休憩時間、休日、休暇、交替制のルール／賃金の決定・計算・支払方法、締切り・支払時期、昇給に関する事項／退職に関する事項（解雇事由を含む）\n- 相対的必要記載事項（制度を設ける場合にのみ記載すればよい）：退職手当、臨時の賃金（賞与など）、食費・作業用品等の負担、安全衛生、職業訓練、災害補償、表彰・制裁（減給の制裁には上限規制あり）\n⚠️「退職に関する事項」は絶対的記載事項ですが、「退職**手当**に関する事項」は相対的記載事項です。似た言葉で区分が逆のひっかけが作りやすい論点です。\n\n**周知義務と効力**：作成した就業規則は、常時各作業場の見やすい場所への掲示・備え付け、書面の交付、電子的方法での記録・閲覧などにより労働者に**周知**させなければなりません。周知されていない就業規則は、労働者に対して効力を生じないと解されています。また、就業規則で定める基準に達しない労働条件を定める労働契約は、その部分について無効となり、無効となった部分は就業規則の基準によります（最低基準効）。⚠️ただし就業規則自体が法令や労働協約に反する場合は、その反する部分について就業規則の方が無効になります。\n\n**監督機関の体系**：厚生労働大臣 → 都道府県労働局長 → 労働基準監督署長、という系統で行政監督を行います。各事業場での具体的な調査・指導は労働基準監督官が担当し、事業場への臨検（立入調査）、帳簿書類の提出要求、関係者への尋問を行う権限を持ちます。⚠️労働基準監督官は労基法違反の罪について**司法警察官**としての職務（捜査・送検）を行いますが、起訴するかどうかを決めるのは検察官であり、監督官自身に起訴権限はありません。\n\n## 覚え方のコツ\n「10人以上で作成・届出」「意見は聴くが同意は不要」「退職＝絶対、退職手当＝相対」「周知なければ効力なし」「監督官は捜査はするが起訴はしない」という5点セットで押さえると、選択肢の正誤判定がほぼカバーできます。\n\n## まとめ3行\n- 就業規則は常時10人以上の労働者を使用する事業場で作成・届出義務。意見聴取は必須だが同意は不要\n- 絶対的記載事項（退職に関する事項等）と相対的記載事項（退職手当等）の区分、周知されない就業規則は効力なし＝最低基準効とセットで出やすい\n- 監督機関は大臣→労働局長→監督署長の系統。労働基準監督官は臨検・尋問＋司法警察官の職務（捜査まで。起訴は検察官）\n\n根拠：労働基準法（就業規則・監督機関に関する規定）※条文番号は本日のe-Govメンテナンスのため未確認。次回API復旧時に確定します。\n"}, {"no": 9, "subject": "安衛", "topic": "総則・安全衛生管理体制", "date": "2026-10-05", "body": "# 第9回 労働安全衛生法「総則・安全衛生管理体制」（安衛法1〜3条・10〜19条、施行令2〜9条）\n\n## この制度は何のためにあるか\n労基法にも安全衛生の規定はありましたが、昭和47年に**独立した法律**として切り出されたのが安衛法です。1条は「労働基準法と**相まつて**」から始まり、労災を防ぐために①**危害防止基準の確立**、②**責任体制の明確化**、③**自主的活動の促進**の3本柱で対策を進め、労働者の安全と健康を確保し、**快適な職場環境の形成**を促進することを目的としています。今日の「管理体制」は、このうち②責任体制の明確化を具体化したパートです。\n\n## 条文の中身（ここが出る）\n**義務の主体は「事業者」**（2条3号）：「事業を行う者で、労働者を使用するもの」。個人企業なら事業主個人、会社なら**法人そのもの**です。⚠️労基法の「使用者」（現場の管理者も含む）とは概念が違います。また「労働者」は労基法9条の労働者から**同居の親族のみを使用する事業**の者と**家事使用人**を除いたもの。\n\n**事業者の責務**（3条）：単に法律の**最低基準**を守るだけでなく、快適な職場環境の実現と労働条件の改善を通じて安全と健康を確保する。さらに機械の設計・製造・輸入者等や、仕事の**注文者**にも配慮義務があります。\n\n**選任すべきスタッフ**（業種と「常時使用する労働者数」で決まる）：\n- **総括安全衛生管理者**（10条・令2条）：林業・鉱業・建設業・運送業・清掃業は**100人**以上／製造業・電気・ガス・各種商品卸売・小売・旅館業・ゴルフ場業・自動車整備業等は**300人**以上／その他の業種は**1,000人**以上。その事業場で**事業の実施を統括管理する者**（工場長・支店長など）を充てる。⚠️資格は不要。業務の執行について勧告できるのは**都道府県労働局長**\n- **安全管理者**（11条・令3条）：上の100人・300人グループの業種で**50人**以上。⚠️「その他の業種」（金融・事務所など）には選任義務なし\n- **衛生管理者**（12条・令4条）：**全業種**で**50人**以上。都道府県労働局長の免許を受けた者等から選任\n- **産業医**（13条・令5条）：**全業種**で**50人**以上。医師から選任。産業医の**勧告**を受けた事業者はこれを**尊重**し、衛生委員会等に報告しなければならない\n- **安全衛生推進者／衛生推進者**（12条の2）：上記の管理者が不要な小規模事業場（省令で10人以上50人未満）向け。安全管理者が必要な業種なら安全衛生推進者、それ以外の業種なら**衛生推進者**\n- ⚠️安全管理者・衛生管理者の**増員・解任を命じる**のは**労働基準監督署長**（11条2項・12条2項）。「勧告＝局長（総括）」「増員・解任命令＝署長（安全・衛生）」の主体の違いが頻出\n\n**委員会**（17〜19条）：労働者の意見を反映させる場。事業者に**意見を述べる**機関です（決定機関ではない）。\n- **衛生委員会**：**全業種50人以上**（令9条）\n- **安全委員会**：木材製造・化学工業・鉄鋼・建設業・道路貨物運送・清掃業等は**50人**以上、それ以外の100人・300人グループ業種は**100人**以上（令8条）\n- 両方必要なら、まとめて**安全衛生委員会**にできる（19条）\n- 議長は総括安全衛生管理者等の「第一号の委員」（1人）。⚠️議長以外の委員の**半数**は、過半数労働組合（なければ過半数代表者）の**推薦に基づき**指名しなければならない\n\n## 覚え方のコツ\n数字は「**50人で衛生・産業医・衛生委員会がそろって登場**」がスタートライン。安全系は業種限定で、総括は「100（屋外・危険）／300（工場・商業）／1,000（その他）」の3段階。主体は「**局長は総括に勧告、署長は安全・衛生に増員解任命令**」と1セットで唱えると取り違えません。\n\n## まとめ3行\n- 安衛法は労基法と「相まつて」、危害防止基準・責任体制・自主的活動で労災を防ぎ、快適な職場環境の形成を促進する\n- 義務の主体は「事業者」（法人そのもの）。衛生管理者・産業医・衛生委員会は全業種50人以上、安全管理者は特定業種50人以上\n- 総括安全衛生管理者は100/300/1,000人で、事業を統括管理する者を充てる（資格不要）。勧告は局長、安全・衛生管理者の増員解任命令は署長\n\n根拠：[労働安全衛生法1〜3条・10〜13条・17〜19条](https://laws.e-gov.go.jp/law/347AC0000000057)／[労働安全衛生法施行令2〜5条・8条・9条](https://laws.e-gov.go.jp/law/347CO0000000318)／[労働安全衛生規則12条の2](https://laws.e-gov.go.jp/law/347M50002000032)\n"}, {"no": 10, "subject": "安衛", "topic": "危険防止措置・機械等規制", "date": "2026-10-06", "body": "# 第10回講義：安衛法「危険防止措置・機械等規制」\n\n## この制度は何のためにあるか\n\n労働災害は、現場で起きてから対応したのでは遅い。安衛法は二段構えで予防する。\n①事業者に対して、作業現場そのものの危険・健康障害を防ぐ「措置義務」を課す（20〜22条）。\n②特に危険性の高い**機械**については、現場に入る前の段階（製造・流通の入口）で国がチェックする仕組みを別途用意する（37条以下）。\n「現場での義務」と「モノの入口規制」の二層構造として理解すると、条文の役割分担が整理しやすい。\n\n## 条文の中身（ここが出る）\n\n**事業者の講ずべき措置（20〜22条）**は危険源ごとに整理されている。\n20条＝機械等・爆発発火引火性の物・電気熱等のエネルギーによる危険、21条1項＝掘削や荷役などの作業方法から生ずる危険、**21条2項＝墜落や土砂等の崩壊のおそれ**（作業方法の話とは別項で定める点に注意）、22条＝原材料・放射線・騒音・粉じん等による健康障害。\n\n**28条の2（事業者の行うべき調査等＝リスクアセスメント）**は、建設物・設備・原材料などに潜む危険性・有害性を調査し措置を講ずる努力義務。⚠️ただし条文は「第57条第1項の政令で定める物（通知対象の危険有害物質）及び第57条の2第1項に規定する通知対象物による危険性又は有害性等を除く」と明記しており、特定の化学物質はこの調査の対象から外れ別枠（57条系統）で扱われる。\n\n**機械等規制は3段階**。①特に危険な「特定機械等」（ボイラー・クレーン等）を製造するには**都道府県労働局長の許可**が必要（37条）。⚠️ここは「厚生労働大臣」ではない。②それ以外で政令で定める危険な機械等は、厚生労働大臣が定める**規格又は安全装置を具備**すれば足り、許可は不要（42条、譲渡等の制限）。③②のうち特に別表第四に掲げるものは、さらに登録型式検定機関による**型式検定**を受ける必要がある（44条の2）。「許可（37条）→規格具備（42条）→型式検定（44条の2）」の順で規制が重なっていく構造。\n\n**45条（定期自主検査）**は、ボイラー等について定期に自主検査・記録を義務付ける。⚠️そのうち「特定自主検査」は、有資格の事業者本人（法人なら代表者・役員）・有資格労働者、または登録を受けた「検査業者」でなければ実施できない。誰でもよいわけではない。\n\n**55条（製造等の禁止）**は黄りんマッチ等、重度の健康障害を生ずる物の製造・輸入・譲渡・使用を原則禁止（試験研究目的は政令要件を満たせば例外）。\n\n**59条（安全衛生教育）**は、雇入れ時・作業内容変更時に業務に関する安全衛生教育を行う義務（全業種対象）。さらに危険有害業務に就かせる場合は**特別の教育**が必要。\n\n## 覚え方のコツ\n\n機械等規制は「入口を誰がどう絞るか」で覚える。**国が許可を出すほど危険＝特定機械等（37条・局長許可）**、**事業者の自己責任で規格を満たせばよい＝それ以外の危険な機械等（42条）**、**その中でも型式そのものを国の登録機関がチェック＝型式検定（44条の2）**。規制の強さは「許可＞型式検定＞規格具備のみ」の順。\n\n## まとめ3行\n\n- 現場の危険・健康障害は20〜22条の措置義務、機械そのものの危険は37条以下の入口規制で二重に防ぐ。\n- 特定機械等は都道府県労働局長の許可、それ以外は規格・安全装置具備、特に危険なものは型式検定と、規制の強さに段階がある。\n- 特定自主検査は有資格者か検査業者に限定、安全衛生教育は雇入れ時・変更時が原則・危険有害業務は特別教育が追加される。\n\n根拠条文：労働安全衛生法20条・21条・22条・28条の2・37条・42条・44条の2・45条・55条・59条\nhttps://laws.e-gov.go.jp/law/347AC0000000057\n"}, {"no": 11, "subject": "安衛", "topic": "健康診断・面接指導", "date": "2026-10-07", "body": "# 第11回講義：安衛法「健康診断・面接指導」\n\n## この制度は何のためにあるか\n\n前回までの「危険防止措置」は、ケガや事故という**目に見える災害**を防ぐ仕組みだった。今回の健康診断・面接指導は、長時間労働やストレス、有害業務による**目に見えにくい健康障害**を早めに見つけて手を打つための仕組みである。\n流れは一本道で、「①診る（健康診断・面接指導・ストレスチェック）→②記録する→③医師の意見を聴く→④就業上の措置を講ずる」。この4段階を頭に置くと、66条からの枝番条文がすっきり並ぶ。\n\n## 条文の中身（ここが出る）\n\n**健康診断（66条）**：事業者は労働者に医師による健康診断を行わなければならず（1項）、有害業務従事者には**特別の項目**の健康診断（2項）、一定の有害業務には**歯科医師**による健康診断（3項）が加わる。**都道府県労働局長**は労働衛生指導医の意見に基づき臨時の健康診断を指示できる（4項）。労働者には**受診義務**があるが、事業者指定の医師を希望しない場合は他の医師の健康診断結果を提出すればよい（5項・医師選択の自由）。\n\n**一般健康診断の頻度（安衛則）**：雇入れ時（43条）、**1年以内ごとに1回**の定期健診（44条）。深夜業などの特定業務従事者は配置替えの際と**6月以内ごとに1回**（45条。ただし胸部エックス線は1年以内ごとに1回で足りる）。⚠️雇入れ時健診は、**3月を経過しない**健診結果を提出すれば相当項目を省略できる。\n\n**事後措置の流れ**：結果の**記録**（66条の3。健康診断個人票を**5年間**保存＝則51条）→異常の所見がある者について**医師等の意見聴取**（66条の4）→就業場所の変更・作業の転換・労働時間の短縮・深夜業の回数の減少等の**措置**（66条の5）。結果は受診した労働者に**遅滞なく通知**する（66条の6・則51条の4）。保健指導（66条の7）は**努力義務**。⚠️定期健診の結果報告（則52条）は**常時50人以上**の事業者のみ、所轄**労働基準監督署長**へ。\n\n**長時間労働者の面接指導（66条の8）**：週40時間を超えた時間が**1月80時間を超え**、かつ**疲労の蓄積**が認められる者が対象（則52条の2）。⚠️**労働者の申出**により行う（則52条の3）。一方、研究開発業務従事者（66条の8の2）と高度プロフェッショナル（66条の8の4）は**申出不要**で一定時間超なら必ず実施する。面接指導のために、事業者は労働時間の状況を**把握する義務**を負う（66条の8の3）。\n\n**ストレスチェック（66条の10）**：医師・保健師等による心理的な負担の程度の検査を**1年以内ごとに1回**（則52条の9）。⚠️結果は医師等から**本人に直接通知**され、本人の**同意なく事業者に提供してはならない**。高ストレス者が**申し出たとき**に面接指導を行い、申出を理由とする**不利益取扱いは禁止**。現行法では常時50人未満（産業医選任義務のない事業場）は当分の間**努力義務**（附則4条。令和7年改正で令和10年4月1日から義務化予定）。\n\n## 覚え方のコツ\n\n数字は「**雇入れ3月・定期1年・特定6月・保存5年・報告50人・面接80時間**」と6点セットで唱える。\n面接指導は「**一般は申出、研究開発・高プロは申出不要**」。ストレスチェックは「**結果は本人のもの**（同意なく会社に渡らない）」と覚えると、通知・提供・申出・不利益取扱い禁止の論点が一気につながる。\n\n## まとめ3行\n\n- 健康管理は「診る→記録（5年）→医師の意見聴取→就業上の措置」の4段階。保健指導だけは努力義務。\n- 定期健診は1年以内ごと、特定業務従事者は6月以内ごと。結果報告は常時50人以上で労基署長へ。\n- 長時間労働の面接指導は月80時間超＋疲労蓄積＋本人の申出。ストレスチェックの結果は本人同意なく事業者に渡せない。\n\n根拠条文：労働安全衛生法66条・66条の2〜66条の10・附則4条／労働安全衛生規則43条・44条・45条・51条・51条の4・52条・52条の2・52条の3・52条の9\nhttps://laws.e-gov.go.jp/law/347AC0000000057\nhttps://laws.e-gov.go.jp/law/347M50002000032\n"}, {"no": 12, "subject": "安衛", "topic": "監督・雑則", "date": "2026-10-08", "body": "# 第12回講義：安衛法「監督・雑則」\n\n## この制度は何のためにあるか\n\nここまでで学んだ管理体制・危険防止・健康管理は、どれも「事業者が守るべきルール」だった。今回はそのルールを**本当に守らせるための仕組み**を学ぶ。安衛法の締めくくりにあたる部分だ。\n流れは「①**事前**にチェックする（計画の届出）→②**現場**を見る（監督官の立入検査）→③**違反**を正す（改善計画・使用停止命令）→④**事後**に把握する（申告・報告）」の4段階。どの段階に誰（厚生労働大臣・都道府県労働局長・労働基準監督署長・労働基準監督官）が出てくるかが得点源になる。\n\n## 条文の中身（ここが出る）\n\n**計画の届出（88条）**：危険な機械等を設置・移転・主要構造部分を変更するときは、工事開始の**30日前**までに**労働基準監督署長**へ（1項。リスクアセスメント等を講じて署長の認定を受けた事業者は免除）。建設業の**特に大規模な仕事**は**30日前**までに**厚生労働大臣**へ（2項）。建設業その他政令で定める業種の一定の仕事は**14日前**までに**労働基準監督署長**へ（3項）。法令違反があれば、工事・仕事の**開始差止め**や計画変更を命じられる（6項）。\n\n**労働基準監督官（90〜92条）**：事業場への**立入り**、関係者への**質問**、帳簿・書類等の**検査**、**作業環境測定**、検査に必要な限度での**無償**の収去ができる（91条1項）。身分証票を携帯・提示する（3項）。⚠️この立入検査の権限は「**犯罪捜査のために認められたものと解釈してはならない**」（4項）。一方で、安衛法違反の罪については**司法警察員**の職務を行う（92条）。厚生労働省・都道府県労働局・労働基準監督署には、**産業安全専門官**・**労働衛生専門官**が置かれる（93条）。\n\n**改善計画（78〜79条）**：重大な労働災害が起き、再発防止が必要なときは、**厚生労働大臣**が**特別安全衛生改善計画**の作成・**提出**を指示する（78条1項）。作成時は**過半数労働組合（なければ過半数代表者）の意見を聴く**（2項）。指示に従わない等の場合は**勧告**、さらに従わなければ**公表**できる（5・6項）。それ以外で総合的な改善が必要な事業場には、**都道府県労働局長**が**安全衛生改善計画**の作成を指示する（79条）。どちらの計画も、**事業者と労働者**の双方が守らなければならない（78条3項・79条2項）。\n⚠️ひっかけどころ：**特別**＝大臣・作成＋**提出**・勧告→公表あり／**普通**＝局長・**作成のみ**（条文上、提出の規定なし）・公表なし。「意見を聴く」であって「同意」ではない。\n\n**使用停止命令等（98〜99条）**：危険防止措置（20〜25条等）の違反があれば、**都道府県労働局長**又は**労働基準監督署長**が作業停止・建設物等の使用停止などを命じる（98条1項）。⚠️**労働者に急迫した危険**があるときは、**労働基準監督官**がその権限を**即時に**行使できる（3項）。違反がなくても、労働災害発生の急迫した危険があり緊急の必要があれば、一時停止などの応急措置を命じられる（99条）。\n\n**申告・報告（97条・100条）**：作業従事者は、違反の事実を**都道府県労働局長・労働基準監督署長・労働基準監督官**に**申告**でき、申告を理由とする**解雇その他不利益な取扱いは禁止**（97条）。行政は事業者等に**報告・出頭**を命じられる（100条）。代表例が**労働者死傷病報告**（安衛則97条）：休業**4日以上**・死亡は**遅滞なく**、休業**4日未満**は**四半期ごと**にまとめて、その期間の最後の月の**翌月末日**までに所轄労働基準監督署長へ報告する（いずれも電子申請）。\n\n**その他の雑則**：法令の要旨の**周知**（101条）、作成した書類の**保存**（103条）、心身の状態に関する情報は**健康確保に必要な範囲内**で収集・保管・使用する（104条）。\n\n## 覚え方のコツ\n\n届出の日数は「**機械30・大規模30（大臣）・その他14**」。届出先は「**大規模だけ大臣**、あとは署長」。\n改善計画は「**特別は大臣に出す、普通は局長に言われて作る**」。\n現場で「今すぐ止めろ」が言えるのは、急迫した危険のときの**監督官**だけ、と押さえる。\n\n## まとめ3行\n\n- 計画届は工事・仕事開始の30日前（機械等・特に大規模＝大臣）／14日前（建設業等の一定の仕事）。\n- 監督官は立入り・質問・検査・測定・無償収去ができるが、立入検査は犯罪捜査のためではない（罪については司法警察員）。\n- 特別安全衛生改善計画は大臣へ作成・提出（勧告→公表）、安全衛生改善計画は局長の指示で作成。死傷病報告は休業4日以上は遅滞なく、4日未満は四半期ごと。\n\n根拠条文：労働安全衛生法78条・79条・88条・90〜93条・97〜101条・103条・104条／労働安全衛生規則97条\nhttps://laws.e-gov.go.jp/law/347AC0000000057\nhttps://laws.e-gov.go.jp/law/347M50002000032\n"}, {"no": 13, "subject": "労災", "topic": "総則・適用", "date": "2026-10-09", "body": "# 第13回講義：労災法「総則・適用」\n\n## この制度は何のためにあるか\n\n労基法の第8章（75条以下）には「災害補償」の規定があり、仕事でケガをした労働者には**使用者**が療養費や休業補償を払う義務がある。しかし、大きな事故が起きれば会社が払いきれないこともある。そこで、国が保険として補償を肩代わりし、確実に・迅速に給付するのが**労災保険**だ。\n今日から労災法に入る。初回は「何のための保険か（目的）」「誰が運営するか（管掌）」「どの事業・誰が対象か（適用）」の土台を固める。\n\n## 条文の中身（ここが出る）\n\n**目的（1条）**：労災保険は、**業務上の事由**、**複数事業労働者**の二以上の事業の業務を要因とする事由、又は**通勤**による労働者の負傷・疾病・障害・死亡等に対して**迅速かつ公正な保護**をするため、必要な**保険給付**を行う。あわせて、被災労働者の**社会復帰の促進**、労働者と遺族の**援護**、労働者の**安全及び衛生の確保**等を図り、もって労働者の**福祉の増進**に寄与することを目的とする。\n「複数事業労働者」＝**事業主が同一人でない**二以上の事業に使用される労働者（同じ会社の2つの支店勤務は該当しない）。\n\n**管掌（2条）**：労災保険は**政府**が管掌する。⚠️健康保険（協会けんぽ・健保組合）と違い、保険者は政府だけ。組合方式はない。\n\n**事業（2条の2・29条）**：保険給付のほか、**社会復帰促進等事業**を行うことができる。中身は①療養施設・リハビリ施設の運営など**社会復帰の促進**、②療養生活・介護・**遺族の就学**の援護や資金の貸付けなど**援護**、③災害防止活動への援助・健康診断施設・**賃金の支払の確保**など**安全衛生の確保等**の3本柱（29条1項）。一部は**独立行政法人労働者健康安全機構**に行わせる（29条3項）。\n\n**適用事業（3条）**：**労働者を使用する事業**は、業種・規模を問わず**適用事業**（1項）。労働者を1人でも雇えば当然に適用される。\nただし**国の直営事業**と**官公署の事業**（労基法別表第一に掲げる事業を除く）には適用しない（2項）。国家公務員などは別の法律（国家公務員災害補償法など）で補償される。\n⚠️ひっかけどころ：官公署でも「**労基法別表第一の事業**（いわゆる現業）」は除外の**対象外**＝労災法が適用される。「官公署はすべて適用除外」は誤り。\n\n**労働者**：労災法に独自の定義はなく、**労基法9条の労働者**（職業の種類を問わず、事業に使用され**賃金を支払われる者**）と同じと解される。パート・アルバイト・日雇いも、雇用形態や労働時間にかかわらず対象。\n一方、**同居の親族のみ**を使用する事業や**家事使用人**には労基法が適用されない（労基法116条2項）ため、原則として労災保険の対象外になる。\n\n**暫定任意適用事業**：例外として、**個人経営**の小規模な**農林水産業**の一部は、当分の間「任意適用」とされている。事業主が加入を**申請**し**厚生労働大臣の認可**があった日に保険関係が成立する（整備法5条1項）。⚠️労働者の**過半数**が希望したら、事業主は申請**しなければならない**（同条2項）。脱退（保険関係の消滅）は、労働者の**過半数の同意**と、成立後**1年経過**などが条件（整備法8条）。\n（雇用保険の暫定任意は加入の申請に「**2分の1以上**の同意」、脱退は「**4分の3以上**の同意」が必要＝労災とは要件が違う。徴収法附則2条・4条）\n\n## 覚え方のコツ\n\n目的条文は「**業務・複数・通勤**」の3つの災害 → 「**迅速かつ公正**な保護」 → 「**社会復帰・援護・安全衛生**」 → 「**福祉の増進**」の流れで一本の文として覚える。\n適用は「**1人でも雇えば強制**。除外は**国・官公署（非現業）**、例外の任意は**個人の小さな農林水産業**」の3点セット。\n暫定任意の数字は「**労災は過半数（希望→申請義務／脱退も過半数＋1年）**、雇用は**2分の1（加入）・4分の3（脱退）**」。\n\n## まとめ3行\n\n- 労災保険は政府が管掌し、業務災害・複数業務要因災害・通勤災害への保険給付と、社会復帰促進等事業を行う。\n- 労働者を使用する事業はすべて適用事業。国の直営事業・官公署の事業（労基法別表第一の事業を除く）は適用除外。\n- 個人経営の小規模な農林水産業の一部は暫定任意適用事業。過半数が希望すれば加入申請が義務、脱退は過半数の同意＋成立後1年経過等が必要。\n\n📜 法改正メモ：令和8年改正（令和8年法律第60号）で暫定任意適用事業の一部廃止が決まっている。政省令の要綱案では施行日を令和13年4月1日とする案が示されており、2027年試験の時点では現行の暫定任意の仕組みで学習してよい。\n\n根拠条文：労働者災害補償保険法1条・2条・2条の2・3条・29条／労働基準法9条・116条／失業保険法及び労働者災害補償保険法の一部を改正する法律及び労働保険の保険料の徴収等に関する法律の施行に伴う関係法律の整備等に関する法律5条・8条／労働保険徴収法附則2条・4条\nhttps://laws.e-gov.go.jp/law/322AC0000000050\nhttps://laws.e-gov.go.jp/law/322AC0000000049\nhttps://laws.e-gov.go.jp/law/344AC0000000085\nhttps://laws.e-gov.go.jp/law/344AC0000000084\n"}, {"no": 14, "subject": "労災", "topic": "業務災害の認定", "date": "2026-10-11", "body": "# 第14回講義：労災法「業務災害の認定」\n\n## この制度は何のためにあるか\n\n労災保険から給付が出るかどうかは、そのケガや病気が「**業務上**」かどうかで決まる。業務上と認められれば、治療費は自己負担なし、休業中の所得も補償される。認められなければ健康保険の扱いになる。つまり「業務上かどうか」の線引きは、労災保険の入口そのものだ。\n前回は「誰が・どの事業が対象か」を学んだ。今回は「**どんな災害が対象になるか**」を学ぶ。\n\n## 条文の中身（ここが出る）\n\n**業務災害の定義（労災法7条1項1号）**：労働者の**業務上の**負傷・疾病・障害・死亡を「**業務災害**」という。保険給付は①業務災害、②**複数業務要因災害**、③**通勤災害**に関する給付と、④**二次健康診断等給付**の4本立て（7条1項）。\n\n**労基法の災害補償とのつながり（労災法12条の8第2項）**：業務災害に関する保険給付（傷病補償年金・介護補償給付を除く）は、**労基法75条〜77条・79条・80条**の災害補償の事由が生じたときに行う。労災保険から給付が行われるべき場合、使用者は労基法上の補償の責任を**免れる**（労基法84条1項）。\n⚠️「業務上」かどうかは、労災法独自の基準ではなく**労基法の災害補償と同じ物差し**で判断する。\n\n**判断の物差し（行政解釈）**：条文に「業務上とは何か」の定義はない。実務では次の2つで判断する。\n- **業務遂行性**：労働者が**事業主の支配下**にある状態で起きたか（作業中のほか、休憩中や出張中も含みうる）\n- **業務起因性**：業務と災害の間に**相当因果関係**があるか\n業務遂行性は業務起因性の**前提**。ただし、業務遂行性があっても、私的な行為や自然現象だけが原因なら業務起因性は否定されうる。\n\n**業務上の疾病（労基法75条2項・労基則35条・別表第1の2）**：業務上の疾病の範囲は**厚生労働省令**で定め、労基則35条が**別表第1の2**に列挙している。\n- 一号：業務上の**負傷に起因する**疾病\n- 二〜七号：物理的因子（熱中症・難聴など）、作業態様（腰痛など）、化学物質、**じん肺**、病原体、**がん**原性物質\n- **八号**：長期間の長時間業務などによる**脳・心臓疾患**（脳出血、くも膜下出血、心筋梗塞など）\n- **九号**：心理的に過度の負担を与える業務による**精神及び行動の障害**\n- 十号：厚生労働大臣の指定する疾病\n- **十一号**：「その他**業務に起因することの明らかな**疾病」＝**包括規定**\n⚠️ひっかけどころ：別表に**列挙されていない**病気でも、業務起因性が明らかなら十一号で業務上と認められる。「列挙されたもの**に限る**」は誤り。\n\n八号・九号には厚労省の**認定基準**（通達）がある。脳・心臓疾患では、発症前**1か月に約100時間**、または発症前**2〜6か月平均で月約80時間**を超える時間外労働が「業務と発症の関連性が強い」目安とされる。\n\n**給付の制限（労災法12条の2の2）**：\n- 労働者が**故意に**負傷・死亡等やその直接の原因となった事故を生じさせたときは、保険給付を**行わない**（1項）\n- **故意の犯罪行為・重大な過失**、または正当な理由なく**療養の指示に従わない**ことで事故を起こしたり回復を妨げたときは、保険給付の**全部又は一部を行わないことができる**（2項）\n⚠️ 1項は「**行わない**」（必ず不支給）、2項は「**行わないことができる**」（裁量）。この語尾の違いが頻出。\n（労基法78条では、重大な過失＋**行政官庁の認定**があれば使用者は**休業補償・障害補償**を行わなくてよい）\n\n## 覚え方のコツ\n\n業務上の判断は「**支配下にいたか（遂行性）→ 業務のせいか（起因性）**」の2段階。\n別表第1の2は「**負傷→物理→作業→化学→じん肺→病原体→がん→脳心臓（八）→精神（九）→大臣指定→その他（十一）**」の順。「**8は脳心、9は心（こころ）**」と覚える。\n給付制限は「**故意＝ゼロ（行わない）**、**重過失・犯罪・指示違反＝減らせる（できる）**」。\n\n## まとめ3行\n\n- 業務災害＝業務上の負傷・疾病・障害・死亡（労災法7条1項1号）。業務上かは「業務遂行性」と「業務起因性」で判断する。\n- 業務上の疾病は労基則35条・別表第1の2に列挙。八号＝脳・心臓疾患、九号＝精神障害、十一号＝業務起因性が明らかな疾病の包括規定。\n- 故意による災害は保険給付を「行わない」。故意の犯罪行為・重大な過失・療養指示違反は、全部又は一部を「行わないことができる」。\n\n根拠条文：労働者災害補償保険法7条・12条の8・12条の2の2／労働基準法75条・78条・84条／労働基準法施行規則35条・別表第1の2\nhttps://laws.e-gov.go.jp/law/322AC0000000050\nhttps://laws.e-gov.go.jp/law/322AC0000000049\nhttps://laws.e-gov.go.jp/law/322M40000100023\n"}, {"no": 15, "subject": "労災", "topic": "通勤災害", "date": "2026-10-13", "body": "# 第15回講義：労災法「通勤災害」\n\n## この制度は何のためにあるか\n\n通勤は仕事をするために欠かせない移動だが、会社の指揮命令下にあるわけではない。そのため、通勤中のケガは「業務上」には当たらず、使用者は労基法上の災害補償責任を負わない。\nそれでも「通勤中の事故で収入が途絶える」のは労働者にとって大きなリスクなので、労災保険が**業務災害とは別枠**で保護している。それが「**通勤災害**」の制度だ。\n前回は「業務上」かどうかの判断を学んだ。今回は「**通勤とは何か**」と「**どこまでが通勤か**」を学ぶ。\n\n## 条文の中身（ここが出る）\n\n**通勤災害の定義（労災法7条1項3号）**：労働者の**通勤による**負傷・疾病・障害・死亡。\n\n**通勤の定義（7条2項）**：労働者が、**就業に関し**、次の移動を**合理的な経路及び方法**により行うこと。ただし**業務の性質を有するもの**は除く。\n1. **住居**と**就業の場所**との間の往復\n2. 厚生労働省令で定める就業の場所から**他の就業の場所**への移動（＝副業・兼業先への移動。労災則6条）\n3. 1号の往復に先行し、又は後続する**住居間の移動**（＝単身赴任先と帰省先の移動。省令の要件に該当するものに限る）\n⚠️「業務の性質を有するもの」は除かれる。会社の送迎バスでの移動や、出張中の移動などは**業務災害**として扱われ、通勤災害にはならない。\n\n**3号の要件（労災則7条）**：転任に伴い住居を移転し、やむを得ない事情（配偶者の介護・就業、子の就学など）で**配偶者**（配偶者がいなければ**子**、子もいなければ要介護の**父母・親族**）と**別居**することになった労働者であること。\n\n**逸脱・中断（7条3項）**：移動の経路を**逸脱**したり、移動を**中断**したりすると、**その間とその後**の移動は通勤にならない。\nただし、その逸脱・中断が「**日常生活上必要な行為**」で省令で定めるものを、**やむを得ない事由**で行うための**最小限度**のものであるときは、**逸脱・中断の間を除き**、通勤に戻る。\n⚠️ひっかけどころ：例外に当たっても、**逸脱・中断の「間」は通勤にならない**。通勤に戻るのは、元の経路に**戻った後**の移動だけ。「逸脱・中断の間も含めて通勤とする」は誤り。\n\n**日常生活上必要な行為（労災則8条）**：\n1. **日用品の購入**その他これに準ずる行為\n2. **職業訓練**、学校教育その他の教育訓練で職業能力の開発向上に資するものを受ける行為\n3. **選挙権の行使**その他これに準ずる行為\n4. 病院・診療所での**診察又は治療**を受ける行為\n5. 要介護状態にある配偶者・子・父母・孫・祖父母・兄弟姉妹・配偶者の父母の**介護**（**継続的に又は反復して**行われるものに限る）\n\n**給付の名前と一部負担金（21条・31条2項）**：通勤災害の給付は「**療養給付・休業給付・障害給付・遺族給付・葬祭給付・傷病年金・介護給付**」の7種類。業務災害の給付と違って「**補償**」の2文字が付かない（使用者に補償責任がないため）。\n療養給付を受ける労働者からは**一部負担金**（**200円**、日雇特例被保険者は**100円**。労災則44条の2）を徴収する。ただし**第三者行為災害**の被災者、療養開始後**3日以内に死亡**した者など休業給付を受けない者、既に納付した者は除かれる。実際には休業給付から控除される。\n\n## 覚え方のコツ\n\n通勤の3パターンは「**家⇔会社**」「**会社⇔会社（副業）**」「**家⇔家（単身赴任）**」。\n逸脱・中断は「**寄り道した瞬間アウト。ただし日常の用事を最小限でやったなら、元の道に戻ればセーフ**」。寄り道中の事故はいつでもアウト。\n日常生活上必要な行為は「**買う・学ぶ・投票・病院・介護**」の5つ。\n通勤災害の給付は「**補償なし・200円あり**」。\n\n## まとめ3行\n\n- 通勤＝就業に関し、住居⇔就業の場所、就業の場所⇔他の就業の場所、単身赴任の住居間の移動を、合理的な経路・方法で行うこと（業務の性質を有するものは除く）。\n- 逸脱・中断の間とその後は通勤ではない。ただし日常生活上必要な行為（買物・教育訓練・選挙・診療・介護）をやむを得ず最小限で行った場合は、経路に戻った後は通勤に戻る（逸脱・中断の間は除く）。\n- 通勤災害の給付は「補償」の付かない7種類。療養給付には一部負担金200円（日雇特例は100円）がかかる。\n\n根拠条文：労働者災害補償保険法7条・21条・31条／労働者災害補償保険法施行規則6条・7条・8条・44条の2\nhttps://laws.e-gov.go.jp/law/322AC0000000050\nhttps://laws.e-gov.go.jp/law/330M50002000022\n"}, {"no": 16, "subject": "労災", "topic": "給付の種類と内容", "date": "2026-10-14", "body": "# 第16回講義：労災法「給付の種類と内容」\n\n## この制度は何のためにあるか\n\n前々回・前回で「どんな災害が労災になるか（業務災害・通勤災害）」を学んだ。今回は「労災と認められたら、**何が・いくら**もらえるのか」を学ぶ。\n労災保険の給付は、ケガの治療費、休んでいる間の収入、後遺障害、死亡、介護と、**被災した労働者の人生の場面ごと**に用意されている。社労士試験では「何日分か」「何日目からか」の数字がよく問われるので、場面と数字をセットで押さえよう。\n\n## 条文の中身（ここが出る）\n\n**業務災害の保険給付は7種類（労災法12条の8第1項）**：\n1. **療養補償給付** 2. **休業補償給付** 3. **障害補償給付** 4. **遺族補償給付** 5. **葬祭料** 6. **傷病補償年金** 7. **介護補償給付**\n（通勤災害では「補償」が取れて療養給付・休業給付…となり、5は「**葬祭給付**」と呼ぶ。前回の復習）\nこのうち**傷病補償年金と介護補償給付**は労基法に対応する災害補償がない、労災保険**独自**の給付（12条の8第2項のかっこ書で除かれている）。\n\n**① 療養補償給付（13条）**：原則は「**療養の給付**」という現物給付。範囲は、診察／薬剤・治療材料の支給／処置・手術その他の治療／居宅における療養上の管理と看護／入院と看護／**移送**の6つ（政府が必要と認めるものに限る）。療養の給付が難しい場合などは「療養の費用」を支給できる。\n⚠️ひっかけどころ：**労災の療養の給付には「移送」が含まれる**。健康保険では移送は療養の給付に入らず、「移送費」として別に支給される（健保法63条・97条）。科目をまたいだ混同に注意。\n\n**② 休業補償給付（14条）**：療養のため働けず、賃金を受けない日の**第4日目**から、1日につき**給付基礎日額の100分の60**。最初の3日間（待期期間）は、業務災害なら使用者が労基法76条の休業補償（平均賃金の60%）を払う。所定労働時間の一部だけ働いた日は、（給付基礎日額−その日に支払われた賃金）の100分の60。\n刑事施設に拘禁されている場合などは支給されない（14条の2）。\n\n**③ 障害補償給付（15条・別表第一・第二）**：治った（症状が固定した）後に障害が残ったとき。\n- 障害等級**1〜7級**＝**障害補償年金**（1級**313日分**〜7級**131日分**）\n- 障害等級**8〜14級**＝**障害補償一時金**（8級**503日分**〜14級**56日分**）\n\n**④ 遺族補償給付（16条〜16条の8）**：\n- **遺族補償年金**：労働者の死亡当時、その収入によって**生計を維持**していた配偶者・子・父母・孫・祖父母・兄弟姉妹（この順位）。ただし妻以外には年齢・障害の要件がある（夫・父母・祖父母は**60歳以上**、子・孫は**18歳到達年度末まで**など）。額は遺族の人数で決まり、1人＝**153日分**（55歳以上または障害のある妻は**175日分**）、2人＝201日分、3人＝223日分、4人以上＝**245日分**。\n- **遺族補償一時金**：年金を受けられる遺族がいないときなどに、**1,000日分**。\n⚠️ **妻だけは年齢要件がない**。夫は60歳以上（または障害の状態）でなければ年金の受給資格者にならない。\n\n**⑤ 葬祭料（17条）**：通常葬祭に要する費用を考慮して**厚生労働大臣が定める金額**。\n\n**⑥ 傷病補償年金（12条の8第3項・18条）**：療養開始後**1年6か月**を経過した日（またはその後）に、(1)まだ**治っていない**、(2)**傷病等級（1〜3級）**に該当、の両方を満たすとき。額は1級313日分・2級277日分・3級245日分（障害補償年金の1〜3級と同じ）。\n⚠️ 傷病補償年金を受ける人には**休業補償給付は支給されない**（18条2項）。休業補償給付からの「切り替え」と覚える。療養補償給付は引き続き受けられる。\n\n**⑦ 介護補償給付（12条の8第4項・19条の2）**：**障害補償年金または傷病補償年金**の受給権者が、常時または随時介護を受けているとき。**月単位**で支給。ただし障害者支援施設に入所して生活介護を受けている間や、**病院・診療所に入院**している間は支給されない。\n\n## 覚え方のコツ\n\n7種類は「**りょう・きゅう・しょう・い・そう・しょう・かい**」（療・休・障・遺・葬・傷・介）。\n休業は「**3日待って4日目から6割**」。\n障害は「**7級までは年金、8級からは一時金**」。数字の両端「**313日（1級）・56日（14級）**」と、年金・一時金の境目「**131日（7級）・503日（8級）**」を優先して覚える（一時金は1回きりなので日数が大きい）。\n遺族年金は「**153→201→223→245**」。最高の245日分は障害補償年金3級・傷病補償年金3級と同じ数字。\n\n## まとめ3行\n\n- 業務災害の給付は療養・休業・障害・遺族・葬祭料・傷病・介護の7種類。労災の療養の給付には移送も含まれる（健保は移送費として別に支給）。\n- 休業補償給付は4日目から給付基礎日額の60%。障害は1〜7級が年金（313〜131日分）、8〜14級が一時金（503〜56日分）。遺族年金は153〜245日分、一時金は1,000日分。\n- 傷病補償年金は療養開始後1年6か月経っても治らず傷病等級1〜3級に該当するときに支給され、受給中は休業補償給付が支給されない。介護補償給付は障害・傷病補償年金の受給権者が対象。\n\n根拠条文：労働者災害補償保険法12条の8・13条・14条・14条の2・15条・16条〜16条の8・17条・18条・19条の2・別表第一・別表第二\nhttps://laws.e-gov.go.jp/law/322AC0000000050\n"}, {"no": 17, "subject": "労災", "topic": "特別支給金・特別加入", "date": "2026-10-15", "body": "# 第17回講義：労災法「特別支給金・特別加入」\n\n## この制度は何のためにあるか\n\n前回は労災保険の「保険給付」7種類を学んだ。今回はその**上乗せ**と**対象の拡張**の話。\n- **特別支給金**：保険給付に上乗せして支給されるお金。休業補償給付（60%）に休業特別支給金（20%）が加わり、休業中は**合計80%**が受け取れる、といった形で被災者の生活を厚く支える。\n- **特別加入**：労災保険は本来「労働者」のための保険。でも中小企業の社長や一人親方、海外に派遣される人なども、現場では労働者と同じ危険にさらされている。そこで**本来は対象外の人も、申請して政府の承認を受ければ労災保険に入れる**ようにしたのが特別加入。\n\n## 条文の中身（ここが出る）\n\n### 特別支給金\n\n**位置づけ**：特別支給金は、労災法29条1項の**社会復帰促進等事業**として支給される（特別支給金支給規則1条）。\n⚠️ひっかけどころ：特別支給金は**保険給付ではない**。12条の8の保険給付（療養・休業・障害・遺族・葬祭料・傷病・介護）には入っておらず、29条の「事業」の一つ。「特別支給金は保険給付の一種である」は誤り。\n\n**種類は9つ（規則2条）**。大きく2グループに分けて覚える。\n\n① **一般の特別支給金**（給料の額と関係ない定額、または定率）\n- **休業特別支給金**（3条）：休業の**第4日目**から、1日につき**休業給付基礎日額の100分の20**。\n- **障害特別支給金**（4条・別表第一）：障害等級に応じた一時金。**1級342万円**〜7級159万円、8級65万円〜**14級8万円**。\n- **遺族特別支給金**（5条）：**300万円**。受ける遺族が2人以上なら、**300万円をその人数で割った額**。\n- **傷病特別支給金**（5条の2・別表第一の二）：療養開始後**1年6箇月**経過時に傷病等級に該当するとき。1級**114万円**・2級**107万円**・3級**100万円**。\n\n② **ボーナス特別支給金**（賞与をもとに計算する上乗せ）\n- 障害特別年金・障害特別一時金・遺族特別年金・遺族特別一時金・傷病特別年金の5つ。\n- 日数は保険給付と同じ（障害特別年金1級313日分、遺族特別一時金1,000日分など）だが、かける単価が「給付基礎日額」ではなく**算定基礎日額**。\n- **算定基礎年額**（6条）＝負傷・発病の日以前**1年間**に支払われた**特別給与**（労基法12条4項の「**3箇月**を超える期間ごとに支払われる賃金」＝ボーナス）の総額。\n- ただし上限がある：**給付基礎日額×365の100分の20**を超えるときはその額、さらに**150万円**を超えるときは150万円。\n- 算定基礎日額＝算定基礎年額÷365。\n\n障害・遺族・傷病の特別支給金の申請は、原則として**5年以内**（規則4条8項・5条8項・5条の2第3項）。\n\n### 特別加入（労災法33条〜36条）\n\n特別加入できる人は33条1号〜7号に並んでおり、3つのグループに分かれる。\n\n**第1種（中小事業主等）**：33条1号・2号、34条\n- 常時**300人**以下（**金融・保険・不動産・小売業は50人**以下、**卸売・サービス業は100人**以下）の労働者を使用する事業主と、その家族従事者など（労災則46条の16）。\n- ⚠️ひっかけどころ：中小事業主が特別加入するには、**労働保険事務組合に労働保険事務の処理を委託していること**が条件（33条1号）。委託していなければ加入できない。\n- 事業主が、自分と従事者を**包括して**申請し、政府の承認を受ける（34条1項）。\n\n**第2種（一人親方等・特定作業従事者）**：33条3号〜5号、35条\n- 労働者を使わずに事業を行う一人親方（個人タクシー・建設の大工・漁船・林業・フリーランスなど）や、特定の危険な作業に従事する人（労災則46条の17・46条の18）。\n- **団体**が申請し、政府の承認を受ける。その団体が適用事業・事業主とみなされる（35条1項1号）。\n- 個人タクシー・個人貨物運送や漁船による採捕などの一部は、**通勤災害の対象外**（業務災害だけ。労災則46条の22の2）。\n\n**第3種（海外派遣者）**：33条6号・7号、36条\n- 日本国内の事業主（または開発途上地域への技術協力団体）から海外の事業に派遣される人。\n\n**3つに共通するルール**\n- 給付基礎日額は、賃金などを考慮して**厚生労働大臣が定める額**（34条1項3号・35条1項6号・36条1項2号）。平均賃金で計算するわけではない。\n- 特別加入保険料（第1種・第2種・第3種）を**滞納**している期間中に起きた事故は、政府は保険給付の**全部又は一部を行わないことができる**（34条1項4号・35条1項7号・36条1項3号）。第1種では、事業主の**故意又は重大な過失**による業務災害の事故も同じ扱い。\n\n## 覚え方のコツ\n\n- 休業は「**保険給付6割＋特別支給金2割＝8割**」。\n- 一般の特別支給金の金額は端から押さえる：障害「**342万（1級）〜8万（14級）**」、遺族「**300万を山分け**」、傷病「**114・107・100万**」。\n- ボーナス特別支給金の上限は「**2割か150万円の低いほう**」。\n- 特別加入は「**1種＝社長（事務組合経由）／2種＝一人親方（団体経由）／3種＝海外派遣**」。中小事業主の人数は「**300・100・50**」で、50は「金融・保険・不動産・小売」。\n\n## まとめ3行\n\n- 特別支給金は29条の社会復帰促進等事業として支給され、保険給付ではない。休業特別支給金は4日目から20%、遺族特別支給金は300万円（人数で割る）、障害特別支給金は342万〜8万円、傷病特別支給金は114〜100万円。\n- ボーナス特別支給金は、前1年間の特別給与（3箇月を超える期間ごとの賃金）が算定基礎年額。上限は給付基礎日額×365の20%と150万円。\n- 特別加入は第1種（中小事業主・事務組合への委託が必須）、第2種（一人親方等・団体経由）、第3種（海外派遣）。給付基礎日額は厚生労働大臣が定める額で、保険料滞納中の事故は給付を制限できる。\n\n根拠条文：労働者災害補償保険法29条・33条〜36条、労働者災害補償保険特別支給金支給規則1条〜6条・別表第一〜第三、労働者災害補償保険法施行規則46条の16〜46条の18・46条の22の2\nhttps://laws.e-gov.go.jp/law/322AC0000000050\nhttps://laws.e-gov.go.jp/law/349M50002000030\n"}, {"no": 18, "subject": "労災", "topic": "通則・不服申立て", "date": "2026-10-16", "body": "# 第18回講義：労災法「通則・不服申立て」\n\n## この制度は何のためにあるか\n\n労災法の最終回は、すべての保険給付に共通する「**ルールの土台**」と、決定に納得できないときの「**争い方**」。\n- **通則**：もらう権利を守るルール（退職しても消えない・差し押さえられない・税金がかからない）と、不正やルール違反があったときに給付を止めたり返させたりするルール。\n- **不服申立て**：労働基準監督署長の「不支給決定」などに納得できないとき、いきなり裁判ではなく、まず**専門の審査機関で2段階**の見直しを受けられるしくみ。\n- **時効**：権利を行使できる時から一定期間が過ぎると、請求できなくなる。\n\n## 条文の中身（ここが出る）\n\n### 受給権の保護（12条の5・12条の6）\n\n- 保険給付を受ける権利は、労働者の**退職によって変更されない**（12条の5第1項）。\n- 保険給付を受ける権利は、**譲り渡し・担保に供し・差し押さえることができない**（同2項）。\n- **租税その他の公課**は、保険給付として受けた金品を標準として**課することはできない**（12条の6）。\n\n### 支給制限（12条の2の2）\n\n⚠️ひっかけどころ：「行わない」と「行わないことができる」の書き分け。\n- 労働者が**故意に**負傷・疾病・障害・死亡（またはその直接の原因となった事故）を生じさせたとき → 政府は保険給付を**行わない**（1項。絶対的）。\n- **故意の犯罪行為・重大な過失**、または**正当な理由なく療養の指示に従わない**ことで事故を生じさせ・程度を増進させ・回復を妨げたとき → 保険給付の**全部又は一部を行わないことができる**（2項。裁量的）。\n\n### お金の調整・不正受給・第三者行為\n\n- **未支給の保険給付**（11条）：受給権者が死亡したら、死亡当時**生計を同じくしていた**配偶者・子・父母・孫・祖父母・兄弟姉妹が**自己の名で**請求できる。同順位者が2人以上なら、1人の請求は**全員のため**にしたものとみなされる。\n- **内払**（12条）・**充当**（12条の2）：払いすぎた年金などを、後から払う給付の前払いとして扱って調整する。\n- **不正受給**（12条の3）：偽りその他不正の手段で受けた者から、費用相当額の**全部又は一部を徴収できる**。事業主が**虚偽の報告・証明**をしていたときは、事業主に**連帯して**納付させることができる。\n- **第三者行為災害**（12条の4）：交通事故のように第三者が原因のとき、①政府が先に給付したら、その価額の限度で**被災者の損害賠償請求権を取得**する（求償）。②被災者が先に第三者から損害賠償を受けたら、政府はその価額の限度で**保険給付をしないことができる**（控除）。\n- **一時差止め**（47条の3）：正当な理由なく届出・書類提出をしない、医師の診断命令などに従わないとき、政府は支払を**一時差し止めることができる**。\n\n### 不服申立て（38条〜40条、労働保険審査官及び労働保険審査会法）\n\n保険給付に関する決定に不服 → **労働者災害補償保険審査官**に**審査請求** → その決定に不服 → **労働保険審査会**に**再審査請求**（38条1項）。\n\n| | 相手 | 期限 |\n|---|---|---|\n| 審査請求 | 労災保険審査官（原処分庁の所在地の都道府県労働局） | 原処分があったことを知った日の翌日から**3月**以内（審査会法8条） |\n| 再審査請求 | 労働保険審査会 | 決定書の謄本が送付された日の翌日から**2月**以内（審査会法38条） |\n\n- 審査請求は**文書又は口頭**でできる（審査会法9条）。\n- 審査請求をした日から**3箇月**たっても決定がないときは、審査官が**棄却したものとみなす**ことができる（38条2項）。\n- 審査請求・再審査請求は、時効の完成猶予・更新については**裁判上の請求**とみなす（38条3項）。\n- ⚠️ひっかけどころ：処分の取消しの訴え（裁判）は、**審査官の決定を経た後**でなければ提起できない（40条）。**審査会の裁決までは不要**＝再審査請求をせずに裁判へ進んでもよい。\n\n### 時効（42条）\n\n- **2年**：療養（補償）給付・休業（補償）給付・葬祭料（葬祭給付）・介護（補償）給付・二次健康診断等給付\n- **5年**：障害（補償）給付・遺族（補償）給付\n- いずれも「権利を**行使することができる時から**」数える。\n\n### ⚠️ 2027年4月1日施行の改正（決戦の日の試験範囲に入る見込み）\n\n令和8年法律第60号により、①**療養補償給付等の時効**について、業務上かどうかを**容易に判断できない疾病として政令で定めるもの**は「2年」が「**5年**」に延長、②**審査請求の対象**に、保険給付だけでなく**社会復帰促進等事業のうち政令で定めるもの**（特別支給金など）の決定も加わる。e-Govの改正後条文で確認済み。\n\n## 覚え方のコツ\n\n- 支給制限は「**故意＝ゼロ、重過失＝減らせる**」。\n- 不服申立ては「**審査官 3月 → 審査会 2月**」「**3箇月**決定なしで棄却みなし」「裁判は**審査官だけ**で行ける」。\n- 時効は「**ケガの治療・休み・葬式・介護は2年、障害・遺族は5年**」。障害と遺族は「人生が変わる給付だから長い」と覚える。\n\n## まとめ3行\n\n- 受給権は退職で変わらず、譲渡・担保・差押え禁止、公課も禁止。故意の事故は給付しない、重過失等は全部又は一部を行わないことができる。\n- 第三者行為災害は「先に給付→政府が求償」「先に賠償→政府が控除」。不正受給は費用相当額を徴収、虚偽証明の事業主は連帯責任。\n- 審査請求（審査官・3月）→再審査請求（審査会・2月）。3箇月決定なしで棄却みなし、取消訴訟は審査官の決定を経れば提起可。時効は2年（療養・休業・葬祭・介護・二次健診）と5年（障害・遺族）。\n\n根拠条文：労働者災害補償保険法11条・12条・12条の2〜12条の6・38条〜40条・42条・47条の3（2027年4月1日施行の改正後の38条・42条も確認）、労働保険審査官及び労働保険審査会法7条〜9条・38条\nhttps://laws.e-gov.go.jp/law/322AC0000000050\nhttps://laws.e-gov.go.jp/law/331AC0000000126\n"}, {"no": 19, "subject": "雇用", "topic": "総則・適用", "date": "2026-10-18", "body": "# 第19回講義：雇用保険法「総則・適用」\n\n## この制度は何のためにあるか\n\n今日から雇用保険法に入る。労災が「仕事中のケガ・病気」の保険だったのに対し、雇用保険は「**仕事を失ったとき・続けにくくなったとき**」の保険。\n- 失業したときの生活費（基本手当など）を出すだけでなく、**再就職を後押し**し、**スキルアップ**や**育児・介護との両立**も支える。\n- さらに、保険料の一部を使って、失業を「起こさない」ための事業（助成金など）も行う。\n- 今日はその全体像＝「目的」「何を行う保険か」「言葉の定義」「どの事業が加入対象か」を押さえる。\n\n## 条文の中身（ここが出る）\n\n### 目的（1条）\n\n雇用保険は、\n- 労働者が**失業した場合**及び**雇用の継続が困難となる事由が生じた場合**に必要な給付を行うほか、\n- 労働者が**自ら職業に関する教育訓練を受けた場合**、並びに**子を養育するための休業**及び**所定労働時間を短縮することによる就業**をした場合に必要な給付を行うことにより、\n- 労働者の**生活及び雇用の安定**を図るとともに、**求職活動を容易にする等その就職を促進**し、\n- あわせて、**労働者の職業の安定に資する**ため、**失業の予防、雇用状態の是正及び雇用機会の増大、労働者の能力の開発及び向上その他労働者の福祉の増進**を図ることを目的とする。\n\n→ 前半が「給付」の目的、「あわせて」以降が「二事業」の目的、という二段構造。\n\n### 管掌（2条）・雇用保険事業（3条）\n\n- 雇用保険は**政府が管掌**する。事務の一部は、政令で定めるところにより**都道府県知事**が行うこととすることができる（2条）。\n- 雇用保険は、**失業等給付**及び**育児休業等給付**を行うほか、**雇用安定事業**及び**能力開発事業**（いわゆる二事業）を**行うことができる**（3条）。\n- ⚠️ひっかけどころ：育児休業等給付は、もう「失業等給付の一部」ではない。**失業等給付とは別建て**の給付。\n\n| 給付 | 中身（10条・61条の6） |\n|---|---|\n| 失業等給付 | **求職者給付**・**就職促進給付**・**教育訓練給付**・**雇用継続給付**の4つ |\n| 育児休業等給付 | **育児休業給付**（育児休業給付金・出生時育児休業給付金）・**出生後休業支援給付**・**育児時短就業給付** |\n\n- 雇用継続給付＝高年齢雇用継続給付＋**介護休業給付金**。介護休業は失業等給付側、育児休業は育児休業等給付側、と分かれている点に注意。\n\n### 定義（4条）\n\n- **被保険者**：適用事業に雇用される労働者であって、6条各号の**適用除外者以外**のもの。\n- **離職**：被保険者について、**事業主との雇用関係が終了**すること。\n- **失業**：被保険者が離職し、**労働の意思及び能力を有するにもかかわらず**、職業に就くことができない状態にあること。\n- **賃金**：名称を問わず**労働の対償として事業主が労働者に支払うもの**（通貨以外のもので支払われるものであって、厚生労働省令で定める範囲外のものを除く）。現物の評価は厚生労働省令で定める。\n- ⚠️ひっかけどころ：「失業」は離職しただけでは足りない。**働く意思と能力があるのに就職できない**状態であること。\n\n### 適用事業（5条）と暫定任意適用事業（附則2条）\n\n- **労働者が雇用される事業**は、業種・規模を問わず**適用事業**（5条1項）。労働者を1人でも雇えば強制加入が原則。\n- 保険関係の成立・消滅は**徴収法**の定めによる（5条2項）。\n- 例外：**農林・畜産・養蚕・水産の事業**のうち政令で定めるもの＝**常時5人以上の労働者を雇用する事業以外**（つまり5人未満）の事業は、**当分の間、任意適用事業**（附則2条、施行令附則2条）。\n- ただし、**国・都道府県・市町村等の事業**と**法人である事業主の事業**は除かれる＝法人なら5人未満でも強制適用。暫定任意になるのは「**個人経営・農林水産・常時5人未満**」の3点セットのときだけ。\n- 水産のうち**船員が雇用される事業**も暫定任意から除かれる（附則2条1項2号）。\n\n## 覚え方のコツ\n\n- 3条は「**給付は行う、二事業は行うことができる**」。\n- 給付は「**失業等給付（4つ）＋育児休業等給付**」の2本立て。介護は失業等給付の中の「雇用継続給付」。\n- 暫定任意は「**個人・農林水産・5人未満**」。1つでも欠けたら強制適用。\n\n## まとめ3行\n\n- 雇用保険は政府管掌。失業等給付と育児休業等給付を行い、二事業（雇用安定・能力開発）を行うことができる。\n- 失業＝離職＋労働の意思と能力あり＋就職できない状態。賃金は労働の対償で、現物は省令の範囲外を除く。\n- 労働者を雇用する事業はすべて適用事業。例外は個人経営の農林水産業で常時5人未満（暫定任意）。法人・官公署は除かれる。\n\n根拠条文：雇用保険法1条〜5条・10条・61条の6・附則2条、雇用保険法施行令附則2条\nhttps://laws.e-gov.go.jp/law/349AC0000000116\nhttps://laws.e-gov.go.jp/law/350CO0000000025\n"}, {"no": 20, "subject": "雇用", "topic": "被保険者", "date": "2026-10-19", "body": "# 第20回講義：雇用保険法「被保険者」\n\n## この制度は何のためにあるか\n\n昨日は「雇用保険は何をする保険か」「どの事業が加入対象か」を見た。今日は**事業ではなく人**の話。\n- 適用事業で働いていれば誰でも被保険者…ではない。**短時間・短期間の人、学生、公務員の一部**などは**適用除外**（6条）。\n- 被保険者になった人は、働き方や年齢によって**4種類**に分かれ、**失業したときにもらえる給付が変わる**。\n- さらに、被保険者になった・やめたという事実は、事業主の届出を受けて**国（厚生労働大臣）が「確認」する**仕組みになっている。\n\n## 条文の中身（ここが出る）\n\n### 適用除外（6条）：この法律を適用しない者\n\n| 号 | 適用除外になる者 |\n|---|---|\n| 1号 | **1週間の所定労働時間が20時間未満**の者 |\n| 2号 | 同一事業主の適用事業に**継続して31日以上雇用されることが見込まれない**者 |\n| 3号 | **季節的に雇用される者**で、38条1項各号（**4箇月以内の期間を定めて雇用**／**週所定労働時間が20時間以上で大臣の定める時間数未満**）のいずれかに該当するもの |\n| 4号 | **学生・生徒**（昼間学生など。厚生労働省令で定める者） |\n| 5号 | 一定の**漁船の船員**（1年を通じて適用事業に雇用される場合を除く） |\n| 6号 | 国・都道府県・市町村等の事業に雇用される者のうち、離職時の諸給与が雇用保険の給付を**超える**と認められる者（省令で定める者） |\n\n- ⚠️ひっかけどころ①：1号・2号には**カッコ書きの例外**がある。\n  - 1号：**高年齢被保険者の特例（37条の5）の申出をした者**と、日雇労働被保険者に当たる者は除外されない。\n  - 2号：**前2月の各月で18日以上**同一の事業主に雇用された者は除外されない（＝31日以上見込まれなくても、実績で入れる）。\n- ⚠️ひっかけどころ②：週20時間「未満」が除外。**20時間ちょうどは適用**される（なお2028年10月1日からは「10時間未満」に変わるが、今の試験では**現行の20時間**で学ぶ）。\n\n### 被保険者の4種類\n\n| 種類 | 中身（条文） | 失業時の給付 |\n|---|---|---|\n| **一般被保険者** | 以下3つ以外の被保険者 | 基本手当など（求職者給付） |\n| **高年齢被保険者** | **65歳以上**の被保険者（短期雇用特例・日雇を除く）（37条の2） | **高年齢求職者給付金** |\n| **短期雇用特例被保険者** | **季節的に雇用される**者のうち、38条1項1号・2号（4箇月以内の期間を定めて雇用／週20時間以上で大臣の定める時間数未満）の**いずれにも該当しない**者（38条） | **特例一時金** |\n| **日雇労働被保険者** | 日々雇用される者・30日以内の期間を定めて雇用される者のうち、適用区域に居住・就労するなど43条1項各号に当たる者 | **日雇労働求職者給付金** |\n\n- 高年齢被保険者は「**65歳以上であること**」だけで決まる（65歳以降に新たに雇用された人も、雇用継続中に65歳に達した人も同じ）。\n- 短期雇用特例被保険者・日雇労働被保険者には、基本手当の節（被保険者期間の計算＝14条を除く）などの規定は**適用されない**（38条3項・43条4項）。\n\n### 高年齢被保険者の特例（37条の5）：複数の事業所の合算\n\n**2以上の事業主**の適用事業に雇用される**65歳以上**の者は、次のすべてを満たせば、**自分で厚生労働大臣に申し出て**、**申出をした日から**高年齢被保険者になれる。\n1. 2以上の事業主の適用事業に雇用される65歳以上の者\n2. **1つの事業主**の適用事業での週所定労働時間が**20時間未満**\n3. **2つの事業主**の適用事業（1つ目の時間数が省令で定める時間数以上のもの）での週所定労働時間の**合計が20時間以上**\n\n→ 申出が受理されると、**確認があったものとみなされる**（同条3項）。\n\n### 届出と確認（7条〜9条）\n\n- **事業主**は、雇用する労働者が被保険者になったこと・でなくなったことなどを、厚生労働大臣に**届け出なければならない**（7条）。\n- **被保険者または被保険者であった者**は、**いつでも**確認を**請求**できる（8条）。\n- 厚生労働大臣は、届出・請求により、または**職権で**、被保険者となったこと・でなくなったことの**確認**を行う（9条1項）。この確認には、行政手続法の第3章（不利益処分）の一部は**適用されない**（9条2項）。\n- ⚠️ひっかけどころ③：確認を請求できるのは**被保険者または被保険者であった者**。事業主ではない。事業主は届出義務者。\n\n## 覚え方のコツ\n\n- 適用除外の**3つの数字**：**20時間未満・31日以上見込まれない・18日（前2月）**。\n- 4種類は「**65歳以上は高年齢**／**季節雇用は短期雇用特例**／**日雇いは日雇**／**それ以外は一般**」。給付の名前は「**特例一時金**（短期雇用特例）／**給付金**（高年齢・日雇）／**基本手当**（一般）」で区別する。\n- 届出する人は**事業主**、確認を請求する人は**被保険者・被保険者であった者**、確認する人は**厚生労働大臣**。\n\n## まとめ3行\n\n- 適用事業の労働者でも、週20時間未満・31日以上雇用見込みなし（前2月18日以上は除く）・学生・季節労働者の一部・公務員の一部などは適用除外（6条）。\n- 被保険者は一般・高年齢（65歳以上）・短期雇用特例（季節的雇用）・日雇労働の4種類。給付は基本手当／高年齢求職者給付金／特例一時金／日雇労働求職者給付金と分かれる。\n- 事業主が届け出て、厚生労働大臣が確認する（被保険者・被保険者であった者はいつでも確認請求できる）。65歳以上の複数事業所合算は本人の申出で高年齢被保険者になれる。\n\n根拠条文：雇用保険法6条〜9条・37条の2・37条の5・38条・42条・43条\nhttps://laws.e-gov.go.jp/law/349AC0000000116\n"}, {"no": 21, "subject": "雇用", "topic": "基本手当", "date": "2026-10-20", "body": "# 第21回講義：雇用保険法「基本手当」\n\n## この制度は何のためにあるか\n\n失業した人が、次の仕事を見つけるまで生活を保てるようにする、雇用保険の**中心となる給付**が基本手当（いわゆる失業手当）。\n- 「失業した」だけではもらえない。**①過去に十分な被保険者期間があること**（受給資格）、**②ハローワークで失業の認定を受けること**、**③待期を終えること**が必要。\n- もらえる**金額**（日額）と**日数**（所定給付日数）、もらえる**期限**（受給期間）はそれぞれ別の条文で決まる。\n\n## 条文の中身（ここが出る）\n\n### 受給資格（13条・14条）\n- 離職の日以前**2年間**（算定対象期間）に、被保険者期間が**通算12箇月以上**あること（13条1項）。\n- ⚠️ひっかけ①：**特定受給資格者（倒産・解雇等）と特定理由離職者**は、**離職の日以前1年間に被保険者期間が通算6箇月以上**で足りる（13条2項）。\n- 被保険者期間の1箇月は、**賃金支払の基礎となった日数が11日以上**ある月（14条1項）。通算が12箇月（6箇月）に満たない場合は、**賃金支払の基礎となった時間数が80時間以上**の月も1箇月に数える（14条3項）。\n\n### 失業の認定と待期（15条・21条）\n- 失業の認定は、求職の申込み後、**4週間に1回ずつ**、直前の**28日**の各日について行う（15条3項）。\n- **待期**：求職の申込み後、失業している日が**通算7日**に満たない間は支給されない（21条）。「連続」ではなく「通算」。\n- ⚠️ひっかけ②：待期には**疾病・負傷で働けない日も含まれる**（21条かっこ書）。\n\n### 給付制限（33条）\n- **自己の責めに帰すべき重大な理由による解雇**や、**正当な理由のない自己都合退職**の場合は、待期満了後**1箇月以上3箇月以内**で職安所長の定める期間、支給されない（33条1項）。\n\n### 日額と日数（16条・17条・22条・23条）\n- **賃金日額**＝離職前**最後の6箇月**の賃金総額（臨時・3箇月超ごとの賃金は除く）÷**180**（17条1項）。\n- **基本手当日額**＝賃金日額×給付率（原則**50%〜80%**、賃金が低いほど高い。**60歳以上65歳未満は45%〜80%**）（16条）。\n- **所定給付日数**は**算定基礎期間**で決まる（一般：**10年未満90日／10年以上20年未満120日／20年以上150日**）（22条）。**倒産・解雇等の特定受給資格者**は年齢と算定基礎期間でより長くなる（23条）。\n\n### 受給期間（20条）\n- 原則、**離職の日（基準日）の翌日から1年**。この期間内の失業日についてだけ、所定給付日数を限度に支給（20条1項1号）。\n- 妊娠・出産・育児などで**引き続き30日以上**働けない場合は申出により延長でき、加算後は**最長4年**。\n\n## 覚え方のコツ\n- 数字は3組：**2年で12箇月／（特定受給資格者等は）1年で6箇月**、**待期7日（通算）**、**4週に1回・28日**。\n- 受給資格の「月」は**11日以上**（なければ80時間）。\n- 給付制限は「**待期の後**に**1〜3箇月**」。待期とは別物。\n\n## まとめ3行\n- 受給資格＝**2年で12箇月**（特定受給資格者・特定理由離職者は**1年で6箇月**）。被保険者期間の1月は**賃金支払基礎日数11日以上**（又は80時間以上）\n- 失業の認定は**4週に1回**、待期は**通算7日**、自己都合などの給付制限は待期後**1〜3箇月**\n- 日額＝賃金日額（**6箇月の賃金÷180**）×給付率、日数は算定基礎期間で決まり、受給期間は原則**離職の翌日から1年**\n\n根拠：雇用保険法13〜17条・20〜23条・33条 https://laws.e-gov.go.jp/law/349AC0000000116\n"}, {"no": 22, "subject": "雇用", "topic": "就職促進給付・教育訓練給付", "date": "2026-10-21", "body": "# 第22回講義：雇用保険法「就職促進給付・教育訓練給付」\n\n## この制度は何のためにあるか\n\n失業等給付は4種類（求職者給付・就職促進給付・教育訓練給付・雇用継続給付）。今日はその中の2つを扱う。\n- **就職促進給付**＝**早く再就職するほど得**になる仕組みで、再就職を後押しする。\n- **教育訓練給付**＝**学び直しの費用**を支えて、雇用の安定と就職の促進につなげる。\n\n## 条文の中身（ここが出る）\n\n### 就職促進給付は3つ（10条4項）\n**就業促進手当・移転費・求職活動支援費**。\n\n**就業促進手当（56条の3）**：公共職業安定所長が、省令の基準に従って必要があると認めたときに支給する。\n- 1号（通称：再就職手当）：省令で定める**安定した職業**に就いた受給資格者で、前日の基本手当の**支給残日数が所定給付日数の3分の1以上**の者。\n  - 額＝基本手当日額 × 支給残日数 × **10分の6**。支給残日数が所定給付日数の**3分の2以上**なら**10分の7**。\n  - 同一事業主に**6箇月以上**雇用される場合は、上乗せ（通称：定着手当）がある。\n- 2号（通称：常用就職支度手当）：支給残日数が3分の1未満の受給資格者や、高年齢・特例・日雇の受給資格者のうち、**障害者など就職が困難な者**。額は基本手当日額の**40倍**を限度に省令で定める。\n- ⚠️ひっかけ①：率は「**3分の1以上＝6割／3分の2以上＝7割**」。支給残日数が多いほど高い。\n- 支給した額を基本手当日額で割った日数分の基本手当を**支給したものとみなす**（4項）。\n\n**移転費（58条）**：職業紹介や公共職業訓練等のために**住所・居所を変更**する場合に支給。\n**求職活動支援費（59条）**：①広範囲の求職活動、②職業指導に従った教育訓練の受講等、③求職活動を容易にする役務の利用（託児など）。\n- ⚠️ひっかけ②：この2つの対象は「**受給資格者等**」（高年齢・特例・日雇の受給資格者を含む）。いずれも職安所長が基準に従い**必要と認めたとき**に支給する。\n\n### 教育訓練給付は2つ（10条5項）\n**教育訓練給付金・教育訓練休暇給付金**。\n\n**教育訓練給付金（60条の2）**：**厚生労働大臣が指定**する教育訓練を修了した場合に支給。\n- 対象：訓練開始日（基準日）に**一般被保険者又は高年齢被保険者**である者、または離職後一定期間内（省令）の者。支給要件期間が**3年以上**。\n- 額＝受講費用 × **20%以上80%以下**の範囲で省令が定める率（上限あり）。\n- ⚠️ひっかけ③：**短期雇用特例被保険者・日雇労働被保険者**は一般被保険者ではないので、基準日に被保険者である者としては対象外。\n\n**教育訓練休暇給付金（60条の3）**：一般被保険者が教育訓練休暇を取得したときに支給。\n- 休暇開始日前**2年間**にみなし被保険者期間が通算**12箇月以上**、かつ**5年以上**の期間があること。\n- 認定は**30日に1回**、日額は基本手当日額相当、日数は所定給付日数。\n\n## 覚え方のコツ\n- 「就職促進は**3つ**、教育訓練は**2つ**」。\n- 再就職のお祝い金は「**3分の1で6割、3分の2で7割**」。残りが多いほど高い。\n- 教育訓練給付金は「**大臣指定・3年以上・20〜80%**」の3点セット。\n\n## まとめ3行\n- 就職促進給付＝**就業促進手当・移転費・求職活動支援費**。就業促進手当は支給残日数**3分の1以上**で**6割**、**3分の2以上**で**7割**\n- 移転費・求職活動支援費は**受給資格者等**が対象で、職安所長が必要と認めたときに支給\n- 教育訓練給付金＝**厚生労働大臣指定**の訓練を修了し、支給要件期間**3年以上**、費用の**20〜80%**（休暇給付金は2年で12箇月かつ5年以上）\n\n根拠：雇用保険法10条・56条の3・58条・59条・60条の2・60条の3 https://laws.e-gov.go.jp/law/349AC0000000116\n"}, {"no": 23, "subject": "雇用", "topic": "雇用継続給付・育児介護休業給付", "date": "2026-10-22", "body": "# 第23回講義：雇用保険法「雇用継続給付・育児介護休業給付」\n\n## この制度は何のためにあるか\n\n「失業したとき」ではなく、**働き続けるとき**を支える給付。\n- **雇用継続給付**＝高年齢で賃金が下がっても、また家族の介護で休んでも、**仕事を続けられる**ように支える（10条6項）。\n- **育児休業等給付**＝子を育てるための休業・時短中の収入を支える。**失業等給付ではなく別建て**（⚠️前回のひっかけ）。\n\n## 条文の中身（ここが出る）\n\n### 雇用継続給付は3つ（10条6項）\n**高年齢雇用継続基本給付金・高年齢再就職給付金（この2つが「高年齢雇用継続給付」）＋介護休業給付金**。\n\n### ① 高年齢雇用継続基本給付金（61条）\n- 対象：60歳以上65歳未満の被保険者（短期雇用特例・日雇は除く）。**支給対象月**は「60歳に達した日の属する月から65歳に達する日の属する月まで」の月。\n- 要件：支給対象月の賃金が、**みなし賃金日額×30の75%未満**に下がったとき。被保険者であった期間に相当する期間が**5年以上**あること（5年に満たないときは不支給）。\n- 額：賃金が**64%未満**に下がったら賃金の**10%**。64%以上75%未満は**10%から逓減**する率。\n- 賃金が**支給限度額以上**なら不支給。算定額が基本手当日額の上限（17条4項1号）の**80%を超えない**ときも不支給。\n- ⚠️ひっかけ①：**75%未満**で支給、**64%未満**で最高率。数字を入れ替えて出る。\n\n### ② 高年齢再就職給付金（61条の2）\n- 対象：**基本手当の受給資格者**が**60歳到達後に安定した職業に就き被保険者**になった場合。算定基礎期間**5年以上**で、基本手当の支給を受けたことがあること。\n- 要件：就職日前日の**支給残日数が100日以上**。賃金が基本手当日額の算定基礎となった賃金日額×30の**75%未満**。\n- 支給期間：就職日の属する月から、就職日の翌日から**2年**（支給残日数が**200日未満**なら**1年**）を経過する日の属する月まで。ただし65歳に達する日の属する月が限度。\n- ⚠️ひっかけ②：**100日以上**で支給、**200日**を境に2年／1年。同一の就職につき**就業促進手当（再就職手当）とは選択**（どちらか一方）。\n\n### ③ 介護休業給付金（61条の4）\n- 対象家族（配偶者〔事実婚含む〕・父母・子・配偶者の父母など）を介護するための休業。\n- 要件：休業開始日前**2年間**にみなし被保険者期間が通算**12箇月以上**。\n- **支給単位期間**＝休業開始日から**3月**を経過する日までの期間を1か月ごとに区切った期間。\n- 額：休業開始時賃金日額×支給日数（原則30日）の**40%**。会社から賃金が出て、賃金＋給付が**80%以上**になれば調整、賃金だけで80%以上なら不支給。\n- 回数・日数：同一の対象家族につき**3回まで**（4回目以後は不支給）、通算**93日**に達した日後の休業は不支給。\n- ⚠️ひっかけ③：育児休業給付金の「67%・50%」と混ぜない。介護は**40%**。\n\n### 育児休業等給付（61条の7以下）\n- **育児休業給付金**（61条の7）：**1歳に満たない子**（延長で1歳6か月・2歳。配偶者も休業するなら**1歳2か月**〔パパ・ママ育休プラス〕）。休業開始前2年間にみなし被保険者期間が通算**12箇月以上**。\n  - 額：休業開始時賃金日額×支給日数の**50%**。ただし休業日数が通算**180日**に達するまでは**67%**。賃金＋給付が80%以上なら調整。\n  - 同一の子につき**3回以上**の育児休業（省令の例外を除く）の3回目以後は不支給。\n- **出生時育児休業給付金**（61条の8）：子の出生後**8週間**以内に**4週間（28日）以内**の休業。額は**67%**。\n- **出生後休業支援給付金**（61条の10）：出生後休業を**14日以上**（原則、配偶者も14日以上）。額は**13%**（28日が上限）。\n- **育児時短就業給付金**（61条の12）：**2歳に満たない子**を養育する時短就業。\n- 不正受給した者は育児休業給付の支給を受けられなくなる（61条の9）。\n\n## 覚え方のコツ\n- 雇用継続給付は「**高年齢2つ＋介護1つ**」。育児は別建ての「育児休業等給付」。\n- 高年齢は「**75%未満で出る、64%未満で最高10%**」。再就職給付金は「**残100日以上、200日で2年／1年**」。\n- 介護は「**40%・3回・93日**」、育児は「**67%（180日まで）→50%**」。\n\n## まとめ3行\n1. 雇用継続給付＝高年齢雇用継続基本給付金＋高年齢再就職給付金＋介護休業給付金。育児休業給付は別建て。\n2. 高年齢は賃金が75%未満に低下で支給、再就職給付金は支給残日数100日以上（200日未満は1年）。\n3. 介護休業給付金は40%・3回・通算93日、育児休業給付金は180日まで67%・以後50%。\n\n根拠条文：雇用保険法10条・61条・61条の2・61条の4・61条の7〜61条の10・61条の12 https://laws.e-gov.go.jp/law/349AC0000000116\n"}, {"no": 24, "subject": "雇用", "topic": "雑則・不服申立て", "date": "2026-10-23", "body": "# 第24回講義：雇用保険法「雑則・不服申立て」\n\n## この制度は何のためにあるか\n\n給付のルールを決めても、「本人が死亡したら残りはどうなる？」「不正に受け取ったら？」「処分に納得できないときは？」が決まっていなければ制度は回らない。\n雑則は、**給付を守り（受給権の保護）、不正を正し（返還命令）、争う道を用意する（不服申立て）**ためのルール。労災の「通則・不服申立て」（第18回）とよく似ているので、**労災との違い**を意識して読むのがコツ。\n\n## 条文の中身（ここが出る）\n\n### ① 未支給の失業等給付（10条の3）\n- 受給者が死亡し、まだ支給されていない失業等給付があるとき、死亡の当時**生計を同じくしていた**配偶者（事実婚を含む）・子・父母・孫・祖父母・兄弟姉妹が、**自己の名で**請求できる。\n- 順位は上の**記載順**。同順位者が2人以上なら、1人の請求は全員のため全額につきしたものとみなす。\n\n### ② 返還命令・納付命令（10条の4）\n- **偽りその他不正の行為**で失業等給付を受けた者に、政府は\n  - 支給した額の**全部又は一部の返還**を命ずることができ、\n  - さらに不正受給額の**2倍に相当する額以下**の納付を命ずることができる（いわゆる「3倍返し」）。\n- 事業主・職業紹介事業者等・指定教育訓練実施者などが**偽りの届出・報告・証明**をしたために支給されたときは、その者にも受給者と**連帯して**納付を命ずることができる。\n\n### ③ 受給権の保護・公課の禁止（11条・12条）\n- 失業等給付を受ける権利は、**譲り渡し・担保に供し・差し押さえることができない**。\n- 租税その他の公課は、失業等給付として受けた金銭を標準として**課することができない**（＝非課税）。\n\n### ④ 不服申立て（69条〜71条）\n- 対象：**被保険者資格の確認（9条）**、**失業等給付及び育児休業等給付に関する処分**、**返還命令・納付命令（10条の4）**。\n- ルート：**雇用保険審査官に審査請求** → その決定に不服なら**労働保険審査会に再審査請求**（2審制）。\n- 期間：審査請求は原処分を知った日の翌日から**3月**以内、再審査請求は決定書の謄本送付の翌日から**2月**以内（労審法8条・38条）。\n- 審査請求の日の翌日から**3箇月**経っても決定がなければ、**棄却されたものとみなす**ことができる。\n- 審査請求・再審査請求は、時効の完成猶予・更新について**裁判上の請求**とみなす。\n- **不服理由の制限（70条）**：資格の**確認の処分が確定**したら、それを理由に給付の処分を争うことはできない。\n- **取消訴訟（71条）**：**雇用保険審査官の決定を経た後**でなければ提起できない（審査請求前置）。\n- ⚠️ひっかけ①：取消訴訟は「労働保険審査会の裁決を経た後」ではない。**審査官の決定を経れば足りる**（再審査請求をせずに訴えてもよい）。\n\n### ⑤ 不利益取扱いの禁止（73条）\n- 事業主は、労働者が**確認の請求（8条）**をしたこと等を理由に、解雇その他不利益な取扱いをしてはならない（違反は罰則あり・83条）。\n- 確認の請求は、被保険者又は被保険者であった者が**いつでも**できる（8条）。\n\n### ⑥ 時効（74条）\n- 失業等給付等の**支給を受ける権利**、**返還を受ける権利**、**納付命令による金額を徴収する権利**は、行使できる時から**2年**で時効消滅。\n- ⚠️ひっかけ②：労災は障害・遺族（補償）等給付が**5年**だが、雇用保険は**すべて2年**。「5年」と書かれていたら誤り。\n\n### ⑦ 報告・証明書・立入検査・罰則（76条〜86条）\n- 離職した者は、従前の事業主に**求職者給付の受給に必要な証明書**の交付を請求でき、事業主は**交付しなければならない**（76条3項）。\n- 行政庁は事業所への**立入検査**ができる。ただし**犯罪捜査のためと解釈してはならない**（79条）。\n- 罰則：事業主の違反（届出をしない・不利益取扱い・証明書交付拒否など）は**6月以下の拘禁刑又は30万円以下の罰金**（83条）。被保険者等の違反は**6月以下の拘禁刑又は20万円以下の罰金**（85条）。両罰規定あり（86条）。\n\n## 覚え方のコツ\n- 不正受給は「**返して＋2倍まで払って＝最大3倍**」。\n- 不服申立ては「**審査官（3月）→審査会（2月）、3箇月放置で棄却みなし、訴訟は審査官の決定のあとでOK**」。労災と同じ型。\n- 時効は「**雇用はぜんぶ2年**」。労災の5年と区別。\n\n## まとめ3行\n1. 未支給給付は生計同一の遺族が自己の名で請求、受給権は譲渡・担保・差押え禁止、公課も禁止。\n2. 不正受給は全部又は一部の返還＋2倍以下の納付命令。不服は雇用保険審査官→労働保険審査会、訴訟は審査官の決定後。\n3. 時効はすべて2年。確認の請求はいつでも可、それを理由とする不利益取扱いは禁止。\n\n根拠条文：雇用保険法8条・9条・10条の3・10条の4・11条・12条・69条〜71条・73条・74条・76条・79条・83条・85条・86条 https://laws.e-gov.go.jp/law/349AC0000000116 ／ 労働保険審査官及び労働保険審査会法8条・38条 https://laws.e-gov.go.jp/law/331AC0000000126\n"}, {"no": 25, "subject": "徴収", "topic": "総則・保険関係の成立消滅", "date": "2026-10-26", "body": "# 第25回講義：労働保険徴収法「総則・保険関係の成立消滅」\n\n## この制度は何のためにあるか\n\n労災保険と雇用保険は、給付のルールはそれぞれの法律にある。しかし**「いつから保険の対象になるのか」「保険料をどう集めるのか」**は、2つの保険をまとめて徴収法が決めている。\n徴収法1条は、この法律の役割を「労働保険の事業の**効率的**な運営を図るため、労働保険の**保険関係**の成立及び消滅、労働保険料の**納付**の手続、労働保険事務組合等に関し必要な事項を定める」と書く。\n今回は、その入口である**保険関係（＝事業主と政府の間の保険契約のような関係）の成立と消滅**を押さえる。\n\n## 条文の中身（ここが出る）\n\n### ① 労働保険の定義（2条）\n- 「労働保険」＝**労災保険＋雇用保険**の総称。\n- 「賃金」の定義は雇用保険法4条4項とほぼ同じ（労働の対償として事業主が労働者に支払うもの）。\n- 通貨以外で支払われる賃金の**評価**は**厚生労働大臣**が定める（2条3項）。⚠️雇用保険法4条5項は**厚生労働省令**。主体が違う。\n- 「保険年度」＝**4月1日から翌年3月31日**まで（2条4項）。\n\n### ② 保険関係の成立（3条・4条）\n- 労災保険：労災法3条1項の適用事業（労働者を使用する事業）の事業主について、**事業が開始された日**に保険関係が**当然に成立**する。\n- 雇用保険：雇用保険法5条1項の適用事業（労働者が雇用される事業）についても、**事業が開始された日**に成立する。\n- ⚠️ひっかけ①：成立は**届出や認可を待たずに当然に**生じる。事業主の申請や政府の承認は要らない。\n\n### ③ 成立の届出（4条の2）\n- 保険関係が成立した事業の事業主は、**成立した日から10日以内**に、事業の種類・場所などを**政府に届け出**なければならない。\n- 届出事項のうち厚生労働省令で定めるものに**変更**があったときも、省令で定める期間内に届け出る（同条2項）。\n\n### ④ 保険関係の消滅（5条）\n- 事業が**廃止され、又は終了した**ときは、その**翌日**に保険関係が消滅する。\n- ⚠️ひっかけ②：廃止・終了の「**当日**」ではなく「**翌日**」。消滅にも認可は不要。\n\n### ⑤ 暫定任意適用事業（整備法5条・8条）\n- 労災保険の**暫定任意適用事業**（一部の小規模な個人経営の農林水産業など）は、事業主が**加入申請＋厚生労働大臣の認可**を受けた日に成立する。\n- 事業に使用される労働者の**過半数が希望**するときは、事業主は申請**しなければならない**。\n- 任意で保険関係を消滅させるには、**労働者の過半数の同意**、**成立後1年経過**などの要件を満たし、認可を受ける。\n\n### ⑥ 事業の一括（7条〜9条）\n- **有期事業の一括（7条）**：事業主が同一人／いずれも有期事業／規模が省令の基準以下／他の事業と同時に行われる、などの要件に該当すれば、**法律上当然に**全部を一の事業とみなす。**認可は不要**。\n- **請負事業の一括（8条）**：厚生労働省令で定める事業（建設の事業など）が数次の請負で行われる場合は、**元請負人のみを事業主**とみなす。\n- **継続事業の一括（9条）**：事業主が同一人の継続事業について、**申請＋厚生労働大臣の認可**があれば、一の保険関係とする。指定事業以外の保険関係は**消滅**する。\n- ⚠️ひっかけ③：有期事業の一括は**当然**、継続事業の一括は**認可**。\n\n## 覚え方のコツ\n- 成立は「**開始日に当然**」、消滅は「**廃止・終了の翌日**」。「成立は当日、消滅は翌日」とセットで。\n- 届出は「成立した日から**10日以内**」。\n- 一括は「**有期＝当然、継続＝認可**」。\n\n## まとめ3行\n1. 保険関係は事業開始日に当然成立し、成立から10日以内に政府へ届け出る。認可は不要。\n2. 事業の廃止・終了の翌日に保険関係は消滅する。暫定任意適用事業だけは申請と認可が必要。\n3. 事業の一括は、有期事業は要件を満たせば当然、継続事業は申請＋認可で行う。\n\n根拠条文：徴収法1条〜5条・7条〜9条 https://laws.e-gov.go.jp/law/344AC0000000084 ／ 整備法5条・8条 https://laws.e-gov.go.jp/law/344AC0000000085 ／ 労災法3条 https://laws.e-gov.go.jp/law/322AC0000000050 ／ 雇用保険法4条・5条 https://laws.e-gov.go.jp/law/349AC0000000116\n"}, {"no": 26, "subject": "徴収", "topic": "労働保険料の種類と算定", "date": "2026-10-27", "body": "# 第26回講義：労働保険徴収法「労働保険料の種類と算定」\n\n## この制度は何のためにあるか\n\n保険関係が成立すると、事業主は**労働保険料**を納める義務を負う。政府は「労働保険の事業に要する費用にあてるため」に保険料を徴収する（10条1項）。\n今回は「どんな保険料があるのか」「いくらになるのか」という**算定のしくみ**を押さえる。納付の手続（申告・納期限）は次回、メリット制はその次の回で扱う。\n\n## 条文の中身（ここが出る）\n\n### ① 労働保険料の種類（10条2項）\n労働保険料は次の**6種類**。\n1. **一般保険料**（事業主が労働者に支払う賃金をもとに算定する、基本の保険料）\n2. **第一種特別加入保険料**（中小事業主等の特別加入）\n3. **第二種特別加入保険料**（一人親方等の特別加入）\n4. **第三種特別加入保険料**（海外派遣者の特別加入）\n5. **印紙保険料**（日雇労働被保険者に関するもの）\n6. **特例納付保険料**\n- ⚠️ひっかけ①：「5種類」と書いて**特例納付保険料**を落とす。また、印紙保険料は**雇用保険の日雇労働被保険者**に関する保険料で、労災の特別加入とは関係がない。\n\n### ② 一般保険料の額（11条）\n- **一般保険料の額 ＝ 賃金総額 × 一般保険料率**\n- 「賃金総額」とは、事業主がその事業に使用する**すべての労働者**に支払う賃金の総額（11条2項）。\n- 「賃金」の定義は2条2項。通貨以外で支払うもの（現物給与）は、省令で定める範囲外のものを除いて含まれる。評価は**厚生労働大臣**が定める（2条3項）。\n- 建設業など省令で定める事業は、賃金総額を**省令の算定方法**で求める特例がある（11条3項）。\n\n### ③ 一般保険料率（12条）\n- 労災・雇用の**両方**が成立している事業 ＝ **労災保険率 ＋ 雇用保険率**（12条1項1号）。\n- 労災のみの成立なら労災保険率、雇用のみの成立なら雇用保険率。\n- **労災保険率**：保険給付等の費用の予想額に照らし、将来にわたって**財政の均衡**を保てるものとし、**過去3年間**の災害率などを考慮して**厚生労働大臣**が定める（12条2項）。事業の種類ごとに異なる。\n- **雇用保険率**は3つの部分の合計：①失業等給付費等充当徴収保険率 ②育児休業給付費充当徴収保険率 ③二事業費充当徴収保険率（12条4項）。農林水産・建設・清酒製造などは別の率になる。\n- ⚠️実際の率は毎年度変わる。数字は覚えず、「3つの合計」という構造を覚える。\n\n### ④ 特別加入保険料（13条・14条・14条の2）\n- 額 ＝ 特別加入者の**給付基礎日額**などをもとに省令で定める額の**総額** × 各特別加入保険料率。\n- 第一種の率は「労災保険率と同一の率から、二次健康診断等給付に要した費用を考慮した率を**減じた**率」。\n- 第二種・第三種の率は、保険給付等の費用の予想額に照らして**財政の均衡**を保てるものでなければならない（14条2項、14条の2第2項）。\n\n### ⑤ 印紙保険料（22条）\n- **日雇労働被保険者1人につき1日当たり**、賃金の日額に応じた**3区分**の額（第一級〜第三級）。\n- 一般保険料のように賃金総額に率を乗じるのではなく、**定額**である。\n\n## 覚え方のコツ\n- 保険料は「**一般＋特別加入3つ＋印紙＋特例納付＝6種類**」。\n- 一般保険料は「**賃金総額 × 保険料率**」。両保険成立なら率は「**労災＋雇用**」。\n- 労災保険率は「**厚生労働大臣・過去3年・財政の均衡**」の3点セット。\n\n## まとめ3行\n1. 労働保険料は6種類（一般・第一種〜第三種特別加入・印紙・特例納付）。\n2. 一般保険料の額は賃金総額に一般保険料率を乗じた額で、両保険成立の事業の率は労災保険率と雇用保険率の合計。\n3. 労災保険率は厚生労働大臣が過去3年間の災害率等を考慮して定め、財政の均衡を保てるものでなければならない。\n\n根拠条文：徴収法2条・10条〜14条の2・22条 https://laws.e-gov.go.jp/law/344AC0000000084\n"}, {"no": 27, "subject": "徴収", "topic": "申告・納付", "date": "2026-10-28", "body": "# 第27回講義：労働保険徴収法「申告・納付」\n\n## この制度は何のためにあるか\n\n前回は「保険料がいくらになるか」を学んだ。今回は「**いつ・どうやって納めるか**」である。労働保険料は、事業主が**自分で計算して申告し、自分で納める**（申告納付方式）のが原則。年度の初めに見込みで納め（**概算保険料**）、年度が終わってから実績で精算する（**確定保険料**）という**2段構え**になっている。この流れを「年度更新」と呼び、毎年6月1日から7月10日までの手続が実務の山場になる。\n\n## 条文の中身（ここが出る）\n\n### ① 概算保険料の申告・納付（15条）\n- 事業主は保険年度ごとに、**賃金総額の見込額 × 一般保険料率**で算定した概算保険料を、申告書に添えて納付する。\n- 期限は**保険年度の6月1日から40日以内**（＝7月10日）。\n- 保険年度の**中途に保険関係が成立**した事業は、**成立した日から50日以内**（15条1項かっこ書）。\n- **有期事業**は、保険関係が**成立した日から20日以内**（15条2項）。\n- ⚠️ひっかけ①：「40日・50日・20日」の対応関係。継続事業の年度更新＝40日、年度中途成立＝50日、有期事業＝20日。「有期は50日」と入れ替えてくる。\n- 申告書を出さない・記載に誤りがあるときは、**政府が額を決定して通知**する（**認定決定**、15条3項）。通知を受けた事業主は、**通知を受けた日から15日以内**に納付（15条4項）。\n\n### ② 増加概算保険料（16条）・追加徴収（17条）\n- 賃金総額の見込額が**増加**し、省令で定める要件に該当するときは、**その日から30日以内**に差額を申告・納付する（16条）。\n- 政府が**保険料率の引上げ**を行ったときは労働保険料を**追加徴収**し、期限を指定して額を通知する（17条）。\n- ⚠️ひっかけ②：増加概算は「事業主が自ら申告」、追加徴収は「政府が通知」。主体が逆。\n\n### ③ 延納（18条・則27条・28条）\n- 政府は事業主の**申請**に基づき、概算保険料を**延納**させることができる（18条）。\n- 継続事業の要件（則27条）：概算保険料の額が**40万円以上**（労災または雇用の一方のみ成立なら**20万円以上**）、または**労働保険事務組合に委託**している事業。ただし**10月1日以降に成立**した事業は不可。\n- **3期**に分割（4〜7月／8〜11月／12〜3月）。納期限は第1期＝6月1日から40日以内、第2期＝**10月31日**、第3期＝**翌年1月31日**（事務組合委託なら11月14日・2月14日）。\n- 有期事業の要件（則28条）：概算保険料**75万円以上**または事務組合委託（全期間6月以内の事業を除く）。\n- ⚠️ひっかけ③：延納は「政府が認めることが**できる**」であって、要件を満たしても自動ではなく**申請が必要**。\n\n### ④ 確定保険料の申告・納付（19条）\n- 事業主は保険年度ごとに、**実績の賃金総額 × 一般保険料率**で算定した確定保険料の申告書を、**次の保険年度の6月1日から40日以内**に提出する（年度中途に消滅した事業は**消滅した日から50日以内**。有期事業も**消滅した日から50日以内**）。\n- 納付した概算保険料が確定保険料に**足りない**ときは、不足額を申告書に添えて納付（19条3項）。\n- **超える**ときは、政府が**次の保険年度の労働保険料や未納の徴収金に充当し、又は還付**する（19条6項）。\n- 申告書を出さない・記載に誤りがあるときは、ここでも政府が**認定決定**し、通知を受けた日から**15日以内**に納付（19条4項・5項）。\n\n### ⑤ 追徴金（21条）\n- **確定保険料の認定決定**を受けて納付する場合、政府は納付すべき額（千円未満切捨て）の**100分の10**の**追徴金**を徴収する。\n- 天災その他やむを得ない理由によるときは徴収しない。額が**千円未満**のときも徴収しない。\n- ⚠️ひっかけ④：追徴金が課されるのは**確定保険料の認定決定**（19条5項）の場合だけ。**概算保険料の認定決定**（15条4項）には追徴金は**ない**。概算はあくまで見込みなので、見込みの誤りを罰しない、と覚える。\n\n### ⑥ 口座振替（21条の2）\n- 事業主の申出があり、納付が確実で徴収上有利と認められるときに限り、政府は**口座振替による納付を承認**できる。承認を受けた場合、省令で定める日までに納付されれば**納期限に納付されたものとみなす**。\n\n## 覚え方のコツ\n- 期限は「**40（年度更新）・50（中途成立・消滅）・20（有期の概算）・15（認定決定）・30（増加概算）**」の5つの数字で整理する。\n- 「概算は**見込み**、確定は**実績**」。足りなければ納め、多ければ充当か還付。\n- 追徴金は「**確定**の認定決定に**10%**」。概算には付かない。\n\n## まとめ3行\n1. 概算保険料は6月1日から40日以内（中途成立は成立日から50日以内、有期は20日以内）に申告納付し、確定保険料は次の保険年度の6月1日から40日以内に精算する。\n2. 申告しない・誤りがあると政府が認定決定し、通知を受けた日から15日以内に納付。確定保険料の認定決定には100分の10の追徴金が付く（概算には付かない）。\n3. 延納は申請に基づき3期分割。継続事業は概算保険料40万円以上（一方のみ20万円）か事務組合委託が要件。\n\n根拠条文：徴収法15条〜19条・21条・21条の2 https://laws.e-gov.go.jp/law/344AC0000000084 ／ 徴収則27条・28条 https://laws.e-gov.go.jp/law/347M50002000008\n"}]};

document.getElementById('meta').textContent =
  `毎朝の講義がここに蓄積されます（${LIB.lessons.length}講 収蔵）｜ 更新日: ${LIB.updated}`;

// 簡易Markdown描画(見出し・太字・箇条書きのみ)
function md(src) {
  const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return esc(src)
    .replace(/^# (.+)$/gm, '<h1>$1</h1>')
    .replace(/^## (.+)$/gm, '<h2>$1</h2>')
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/^- (.+)$/gm, '・$1')
    .replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>')
    .replace(/\n\n/g, '<br><br>')
    .replace(/\n/g, '<br>');
}

const listEl = document.getElementById('list');
if (!LIB.lessons.length) {
  listEl.innerHTML = '<div class="empty">まだ講義がありません。明日の朝から1日1講ずつ増えていきます。</div>';
} else {
  let html = '', lastSubject = null;
  LIB.lessons.forEach(l => {
    if (l.subject !== lastSubject) {
      html += `<div class="subject-head">▼ ${l.subject}</div>`;
      lastSubject = l.subject;
    }
    html += `<details${l.no === LIB.lessons.length ? ' open' : ''}>
      <summary><span class="no">第${l.no}回</span>${l.topic}<span class="date">${l.date || ''}</span></summary>
      <div class="body">${md(l.body)}</div>
    </details>`;
  });
  listEl.innerHTML = html;
}
</script>
</body>
</html>
