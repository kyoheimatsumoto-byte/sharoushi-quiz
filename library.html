<script>
const LIB = {"updated": "2026-10-02", "lessons": [{"no": 1, "subject": "労基", "topic": "総則・労働条件の原則", "date": "2026-09-24", "body": "# 第1回 労働基準法「総則・労働条件の原則」（労基法1〜4条）\n\n## この法律は何のためにあるか\n労働基準法は、働く人の労働条件について国が定めた「最低ライン」のルール集です。会社と労働者が個別に何を約束しようと、このラインを下回る条件は許されません。社労士試験10科目の最初の柱であり、すべての労働法の土台になります。\n\n## 条文の中身（ここが出る）\n**1条1項**：「労働条件は、労働者が人たるに値する生活を営むための必要を充たすべきものでなければならない。」— 憲法25条(生存権)の理念を労働条件に落とし込んだ宣言です。「人たるに値する生活」という言葉は選択式の超頻出ワード。\n\n**1条2項**：この法律の基準は「最低」のもの。だから労働関係の当事者は、①この基準を理由に労働条件を**低下させてはならない**、②その**向上を図るように努め**なければならない。低下禁止は義務、向上は努力義務、という強弱の違いに注意。義務を負う主体は「労働関係の当事者」＝使用者だけでなく労働者側も含む点がひっかけどころ。\n\n**2条**：労働条件は労使が**対等の立場**で決定すべきもの。そして労使は労働協約・就業規則・労働契約を**遵守し、誠実に義務を履行**しなければならない。\n\n**3条(均等待遇)**：使用者は、労働者の**国籍・信条・社会的身分**を理由として、賃金・労働時間その他の労働条件について差別的取扱いをしてはならない。⚠️ この3つは限定列挙で、**「性別」は含まれない**（性別による賃金差別は次の4条、賃金以外の性差別は男女雇用機会均等法の守備範囲）。試験で最も狙われるポイント。\n\n**4条(男女同一賃金)**：使用者は、労働者が**女性であることを理由**として、**賃金について**男性と差別的取扱いをしてはならない。⚠️ 対象は「賃金」だけ。労働時間や配置の性差別は4条違反ではない。\n\n## 覚え方のコツ\n「1条＝理念(人たるに値する)」「2条＝対等・遵守」「3条＝国籍・信条・社会的身分(性別なし)」「4条＝女性×賃金だけ」。3条と4条の守備範囲の違いを言えれば、この論点はほぼ完成です。\n\n## まとめ3行\n- 労基法は労働条件の**最低基準**。低下禁止(義務)＋向上努力(努力義務)、主体は労使双方\n- 3条の差別禁止は**国籍・信条・社会的身分**の3つ限定。性別は入らない\n- 4条は**女性の賃金差別**だけを禁止。賃金以外は均等法の領域\n\n根拠：労基法1〜4条 https://laws.e-gov.go.jp/law/322AC0000000049"}, {"no": 2, "subject": "労基", "topic": "労働契約", "date": "2026-09-26", "body": "# 第2回 労働基準法「労働契約」（労基法13〜18条）\n\n## この制度は何のためにあるか\n働き始めるとき、会社と労働者は「労働契約」を結びます。でも立場の強い会社が、長すぎる拘束期間や罰金のルール、借金で縛るような契約を押し付けたら、労働者は辞めたくても辞められません。そこで労基法は、**契約の中身そのものに歯止め**をかけています。前回（1〜4条）が「理念」なら、今回は「契約の入口で何を禁止するか」の具体編です。\n\n## 条文の中身（ここが出る）\n**13条（この法律違反の契約）**：労基法の基準に達しない労働条件を定める労働契約は、**その部分については無効**。無効になった部分は、**この法律で定める基準による**。⚠️ 契約全体が無効になるのではなく「その部分だけ」無効で、空いた穴は労基法の基準で自動的に埋まる（強行的・直律的効力）。\n\n**14条（契約期間）**：期間の定めのない契約と「一定の事業の完了に必要な期間」を定める契約を除き、契約期間の上限は**3年**。ただし次の2つは**5年**まで。\n- ①**高度の専門的知識等**を持つ労働者（厚生労働大臣が定める基準に該当し、その業務に就く者）\n- ②**満60歳以上**の労働者\n⚠️ 上限は「5年」であって「無制限」ではない。また、3年・5年は1回の契約期間の上限の話で、更新の回数制限ではない。\n\n**15条（労働条件の明示）**：使用者は労働契約の締結に際し、**賃金・労働時間その他の労働条件**を明示しなければならない（賃金・労働時間など省令で定める事項は、省令で定める方法＝原則書面で）。\n- 明示された条件が**事実と相違**する場合、労働者は**即時に**労働契約を解除できる（2項）\n- 就業のために住居を変更した労働者が、契約解除の日から**14日以内**に帰郷する場合、使用者は**必要な旅費**を負担する（3項）\n\n**16条（賠償予定の禁止）**：使用者は、労働契約の不履行について**違約金を定め**、又は**損害賠償額を予定する**契約をしてはならない。⚠️ 禁止されているのは「あらかじめ金額を決めておくこと」。労働者のミスで**実際に生じた損害**について、使用者が賠償を請求すること自体は禁止されていない。\n\n**17条（前借金相殺の禁止）**：使用者は、前借金その他労働することを条件とする前貸の債権と**賃金を相殺**してはならない。⚠️ お金を貸すこと自体は禁止されていない。禁止は「給料から天引きで回収すること」。\n\n**18条（強制貯金）**：労働契約に**附随して**貯蓄の契約をさせたり、貯蓄金を管理する契約をすることは禁止（1項）。一方、労働者の**委託を受けて**管理する「任意貯金」は、過半数労働組合（なければ過半数代表者）との**書面協定＋行政官庁への届出**などを条件に認められる（2項以下）。返還請求があれば**遅滞なく**返還。\n\n## 覚え方のコツ\n「**13＝部分無効、14＝3年(特例5年)、15＝明示→違えば即時解除・14日で旅費、16＝罰金の予約NG、17＝天引き回収NG、18＝強制貯金NG**」。16〜18条は「辞めたいのに辞められない足かせ」を外す3点セットと覚えると、何が禁止で何がOKかの線引きがブレません。\n\n## まとめ3行\n- 労基法を下回る契約は**その部分だけ無効**→労基法の基準で埋まる（13条）\n- 契約期間の上限は**3年**、高度専門職と**満60歳以上**は**5年**（14条）\n- 明示と違えば**即時解除**＋**14日以内**の帰郷旅費。違約金・賠償額の予定、前借金相殺、強制貯金は禁止（15〜18条）\n\n根拠：労基法13〜18条 https://laws.e-gov.go.jp/law/322AC0000000049"}, {"no": 3, "subject": "労基", "topic": "賃金", "date": "2026-09-27", "body": "# 第3回 労働基準法「賃金」（労基法11・12・23〜28条）\n\n## この制度は何のためにあるか\n働く人にとって賃金は生活そのもの。払い方を会社の都合に任せると「現物で払う」「借金と相殺する」「数か月まとめて払う」「会社都合で休ませて無給」といったことが起こり得ます。そこで労基法は、**賃金とは何か（定義）**、**どう払うか（支払方法）**、**払えない・働けないときの最低保障**をセットで定めています。前回の「労働契約」で入口を押さえたので、今回は契約の中心である「お金」の守り方です。\n\n## 条文の中身（ここが出る）\n**11条（賃金の定義）**：賃金とは、賃金・給料・手当・賞与**その他名称の如何を問わず**、**労働の対償**として使用者が労働者に支払うすべてのもの。⚠️ 名前ではなく「労働の対償かどうか」で決まる。\n\n**12条（平均賃金）**：算定すべき事由の発生した日**以前3箇月間**に支払われた賃金の総額を、その期間の**総日数**（暦日数）で除した金額。\n- 日給・時間給・出来高払制などの場合は、賃金総額÷**労働した日数**×**100分の60**を最低保障とする（1項ただし書）\n- 賃金締切日があれば**直前の賃金締切日**から起算（2項）\n- 業務上の傷病による休業期間、産前産後休業、**使用者の責めに帰すべき休業**、育児・介護休業、**試みの使用期間**は、日数・賃金とも控除（3項）\n- **臨時に支払われた賃金**、**3箇月を超える期間ごと**に支払われる賃金（年2回の賞与など）は総額に算入しない（4項）\n⚠️ 分母は「労働日数」ではなく原則「**総日数**」。労働日数で割るのは最低保障の計算だけ。\n\n**23条（金品の返還）**：労働者の死亡・退職時に**権利者の請求**があれば、**7日以内**に賃金を支払い、積立金・保証金・貯蓄金など労働者の権利に属する金品を返還する。争いがあれば**異議のない部分**を期間内に。\n\n**24条（賃金支払の5原則）**：①**通貨**で ②**直接**労働者に ③**全額**を ④**毎月1回以上** ⑤**一定の期日**を定めて支払う。\n- 通貨払の例外：法令・**労働協約**の定め、省令で定める確実な支払方法（口座振込等）\n- 全額払の例外（控除）：法令の定め（税金・社会保険料）、または**過半数組合（なければ過半数代表者）との書面協定**\n- ⚠️ 通貨払の例外は「労働協約」（労働組合とだけ結べる）、控除の例外は「労使協定」。**根拠の種類が違う**のが頻出のひっかけ\n- 臨時の賃金・賞与などは④⑤の対象外\n\n**25条（非常時払）**：出産・疾病・災害など非常の場合の費用として労働者が請求したら、**支払期日前でも既往の労働に対する賃金**を支払う。⚠️ まだ働いていない分（将来分）の前払い義務ではない。\n\n**26条（休業手当）**：**使用者の責に帰すべき事由**による休業では、休業期間中、**平均賃金の100分の60以上**の手当を支払う。\n\n**27条（出来高払制の保障給）**：出来高払制・請負制で使用する労働者には、**労働時間に応じ一定額**の賃金を保障する。\n\n**28条（最低賃金）**：賃金の最低基準は**最低賃金法**の定めるところによる。\n\n## 覚え方のコツ\n数字は「**12条＝3箇月・総日数・最低保障60%**」「**23条＝7日**」「**26条＝60%**」。100分の60は12条と26条の2か所に出てくるので、まとめて覚えると効率的です。5原則は「**つう・ちょく・ぜん・まい・いち**（通貨・直接・全額・毎月・一定期日）」と唱えます。\n\n## まとめ3行\n- 賃金＝名称を問わず**労働の対償**。平均賃金＝**以前3箇月**の総額÷**総日数**（臨時・3箇月超の賞与は除く）\n- 支払は**通貨・直接・全額・毎月1回以上・一定期日**。通貨の例外は**労働協約**、控除の例外は**労使協定**\n- 退職時は請求から**7日以内**、非常時は**既往の労働分**を期日前に、会社都合の休業は**平均賃金の60%以上**\n\n根拠：労基法11条・12条・23〜28条 https://laws.e-gov.go.jp/law/322AC0000000049"}, {"no": 4, "subject": "労基", "topic": "労働時間・休憩・休日", "date": "2026-09-28", "body": "# 第4回 労働基準法「労働時間・休憩・休日」（労基法32・34〜37・41条）\n\n## この制度は何のためにあるか\n前回の「賃金」はお金の守り方でした。今回は**時間**の守り方です。放っておくと長時間労働は際限なく広がり、健康も生活も壊れます。そこで労基法は「働かせてよい時間の上限（法定労働時間）」「途中で必ず休ませる（休憩）」「週に1日は休ませる（休日）」を原則として定め、それを超えるには**36協定**という手続と**割増賃金**という代償を求めています。\n\n## 条文の中身（ここが出る）\n**32条（法定労働時間）**：休憩時間を除き、**1週間40時間**・**1日8時間**を超えて労働させてはならない。\n\n**34条（休憩）**\n- 労働時間が**6時間を超える**場合は少なくとも**45分**、**8時間を超える**場合は少なくとも**1時間**の休憩を、労働時間の**途中**に与える（1項）\n- 休憩は**一斉**に与えるのが原則。ただし過半数組合（なければ過半数代表者）との**書面による協定**があれば一斉でなくてよい（2項）\n- 休憩時間は**自由に利用**させなければならない（3項）\n- ⚠️ 基準は「6時間**を超える**」「8時間**を超える**」。ちょうど6時間なら休憩の義務なし、ちょうど8時間なら45分で足りる\n\n**35条（休日）**：**毎週少なくとも1回**の休日を与える（1項）。ただし**4週間を通じ4日以上**の休日を与える使用者には1項は適用しない（2項＝変形休日制）。\n- ⚠️ 条文は「日曜日」や「国民の祝日」を休日にせよとは言っていない。曜日の指定はない\n\n**36条（時間外・休日労働＝36協定）**：過半数組合（なければ過半数代表者）と**書面による協定**をし、それを**行政官庁に届け出た**場合に限り、32条等の労働時間・35条の休日の規定にかかわらず、協定の範囲で時間外・休日労働をさせられる。\n- 限度時間は原則**1箇月45時間・1年360時間**（4項）\n- 協定があっても、時間外＋休日労働は**1箇月100時間未満**、2〜6箇月平均**80時間以内**（6項）\n- ⚠️ 協定は**結ぶだけでは足りず、届出**まで必要。ここが34条2項（休憩の一斉付与の例外＝協定のみで届出不要）との違い\n\n**37条（割増賃金）**\n- 時間外・休日労働：**2割5分以上5割以下**の範囲で政令で定める率以上（1項）。時間外が**1箇月60時間を超えた**部分は**5割以上**\n- 深夜（原則**午後10時〜午前5時**）の労働：**2割5分以上**（4項）\n- 割増の基礎から**家族手当・通勤手当**など省令で定める賃金は除く（5項）\n\n**41条（適用除外）**：①農業・畜産・水産業の事業に従事する者（林業は除く）、②**監督若しくは管理の地位にある者**・機密の事務を取り扱う者、③監視・断続的労働に従事する者で**行政官庁の許可**を受けたもの、には**労働時間・休憩・休日**の規定を適用しない。\n- ⚠️ 除外されるのは「労働時間・休憩・休日」の3つ。③だけは**許可**が要件\n\n## 覚え方のコツ\n「**40・8**（週40時間・1日8時間）」「**6超45分・8超1時間**」「**週1回 or 4週4日**」をまず固めます。36協定の限度時間は「**月45・年360**」、上限規制は「**100未満・平均80**」。手続は「休憩の一斉付与の例外＝協定だけ」「36協定＝協定＋届出」と、**届出の有無**で区別しましょう。\n\n## まとめ3行\n- 法定労働時間は**週40時間・1日8時間**。休憩は**6時間超45分・8時間超1時間**を**途中に・一斉に・自由に**\n- 休日は**毎週1回**が原則、例外は**4週4日**。曜日の指定はない\n- 時間外・休日労働は**36協定の締結＋届出**が必要。割増は時間外**2割5分**以上（月60時間超は**5割**以上）、深夜**2割5分**以上\n\n根拠：労基法32条・34〜37条・41条 https://laws.e-gov.go.jp/law/322AC0000000049"}, {"no": 5, "subject": "労基", "topic": "年次有給休暇", "date": "2026-09-29", "body": "# 第5回講義：労基法「年次有給休暇」（労基法39条）\n\n## この制度は何のためにあるか\n\n年次有給休暇は、労働者の心身の疲労回復と生活の質の維持のために、賃金を減らさずに休む権利を法律で保障した制度。使用者の許可制ではなく、要件を満たせば法律上当然に発生する権利であり、使用者はこれを与える「義務」を負う。\n\n## 条文の中身（ここが出る）\n\n**発生要件（39条1項）**：雇入れの日から起算して**六箇月間継続勤務**し、全労働日の**八割以上出勤**した労働者に対し、**十労働日**の有給休暇を与えなければならない。\n\n**加算（39条2項）**：1年6か月以上継続勤務した者には、6か月経過日から起算した継続勤務年数1年ごとに、以下の日数を加算する。\n\n| 継続勤務年数（6か月経過日起算） | 加算日数 | 合計日数 |\n|---|---|---|\n| 1年 | +1日 | 11日 |\n| 2年 | +2日 | 12日 |\n| 3年 | +4日 | 14日 |\n| 4年 | +6日 | 16日 |\n| 5年 | +8日 | 18日 |\n| 6年以上 | +10日 | 20日 |\n\n⚠️ **ただし書**：各1年間の区分の初日の前日が属する期間の出勤率が8割未満だった者には、その年は有給休暇を与えなくてよい（＝出勤率8割の判定は毎年行われ、一度10日発生した後も油断できない）。\n\n**比例付与（39条3項）**：週の所定労働日数が通常の労働者より相当程度少ない労働者（パート等）には、上記日数を比率按分した日数を与える（詳細な日数表は省令で規定）。\n\n**時間単位年休（39条4項）**：労使協定により、年5日以内の範囲で時間単位の年休を与えることができる。\n\n**時季指定権・時季変更権（39条5項）**：年休は労働者が請求する時季に与えるのが原則。ただし事業の正常な運営を妨げる場合は、使用者は他の時季に変更できる（＝拒否権ではなく変更権）。\n\n**計画的付与（39条6項）**：労使協定により、年休のうち**5日を超える部分**に限り、あらかじめ時季を定めて与えることができる。\n\n**使用者の時季指定義務（39条7項・8項）**：年10労働日以上の年休が発生する労働者に対し、使用者は基準日から1年以内に**5日**について、労働者ごとに時季を定めて取得させなければならない。⚠️ 労働者自身の請求や計画的付与で既に取得した日数があれば、その分を5日から差し引ける（合計5日取得済みなら使用者の追加指定は不要）。この義務の履行に労使協定は不要（計画的付与＝協定必須、時季指定義務＝協定不要、の対比を混同しないこと）。\n\n**賃金（39条9項）**：年休中の賃金は、平均賃金・通常の賃金・労使協定があれば健康保険法の標準報酬月額の30分の1相当額のいずれかを就業規則等で定めて支払う。\n\n**出勤率算定の特例（39条10項）**：業務上の傷病による休業期間、育児休業・介護休業期間、産前産後休業期間は、出勤率算定上「出勤したものとみなす」。\n\n## 覚え方のコツ\n\n「6・8・10」（6か月・8割・10日）が基礎。そこから先は「1→2→4→6→8→10」という加算日数の数列（初年度以降、2日ずつ増えて最後だけ据え置き）をセットで覚える。時季変更権は「変更」であって「拒否」ではない点、計画的付与（協定必要・5日超部分）と時季指定義務（協定不要・5日分・控除あり）の役割分担を対で覚えるのがコツ。\n\n## まとめ3行\n\n1. 6か月継続勤務＋8割出勤で10労働日、以降は年数に応じて最大20労働日まで加算される。\n2. 計画的付与（労使協定・5日超部分）と使用者の時季指定義務（協定不要・5日・控除あり）は別制度。\n3. 業務災害療養・育休・介護休業・産前産後休業の期間は出勤率算定上「出勤したもの」とみなす。\n\n根拠条文：労働基準法39条 https://laws.e-gov.go.jp/law/322AC0000000049"}, {"no": 6, "subject": "労基", "topic": "年少者・妊産婦", "date": "2026-09-30", "body": "# 第6回講義：労基法「年少者・妊産婦」（労基法56〜68条）\n\n## この制度は何のためにあるか\n\n年少者（18歳未満）と妊産婦（妊娠中及び産後1年を経過しない女性）は、心身の発達途上・母体保護の観点から、成人の労働者と同じ保護水準では足りない。労基法第6章・第6章の2は、この2者について「通常の保護（労働時間・休日等の一般規定）に上乗せする」形で、就業を制限したり、本人の請求を条件に追加の保護を発動したりする構造になっている。\n\n## 条文の中身（ここが出る）\n\n**最低年齢（56条）**：使用者は、児童が**満15歳に達した日以後の最初の3月31日**が終了するまで使用してはならない。⚠️ 単純な「15歳未満」ではなく、中学卒業年度末までという扱い。例外的に、非工業的事業等では行政官庁の許可を受けて**満13歳以上**（修学時間外）、映画製作・演劇では**13歳未満も**使用可。\n\n**年少者の証明書（57条）**：18歳未満は年齢証明の戸籍証明書を事業場に備付け。\n\n**未成年者の労働契約（58・59条）**：親権者・後見人は未成年者に代わって労働契約を締結**できない**（不利な契約は将来に向かって解除は可）。賃金は未成年者本人が独立して請求でき、親権者等が代理受領することも**できない**。\n\n**年少者の労働時間（60条）・深夜業（61条）**：18歳未満には変形労働時間制・36協定による時間外・フレックス等の規定は適用しない。深夜業（22時〜5時）は原則禁止。⚠️ 例外は「交替制によって使用する**満16歳以上の男性**」のみ（数少ない男女で扱いが異なる規定）。\n\n**危険有害業務・坑内労働（62・63条）**：18歳未満は危険有害業務・坑内労働に一律就かせてはならない。\n\n**帰郷旅費（64条）**：18歳未満の者が解雇の日から**14日以内**に帰郷する場合、使用者は旅費を負担。⚠️ 例外は「労働者の責めに帰すべき事由」**かつ**「行政官庁の認定」の両方が揃った場合のみ（認定だけでは免除されない）。\n\n**坑内業務の就業制限（64条の2）**：妊娠中の女性、及び坑内業務に従事しない旨を申し出た産後1年未経過の女性は坑内業務に**全面禁止**。それ以外の18歳以上の女性は、有害な坑内業務のみ禁止（全面禁止ではない）。⚠️ このランク分けが混同ポイント。\n\n**産前産後（65条）**：産前は**6週間**（多胎14週間）以内に出産予定の女性が**請求**すれば就業させてはならない。産後は**8週間**は就業させてはならないが、**6週間経過後**は本人の請求＋**医師が支障ないと認めた業務**に限り就業可。⚠️ 産前は「請求のみ」で足りるが、産後の早期復帰は「請求＋医師の認定」の両方が必要という非対称性が狙われる。妊娠中の女性は軽易業務への転換も請求できる。\n\n**妊産婦の就業制限（66条）**：妊産婦が**請求した場合**、変形労働時間制の適用・時間外労働・休日労働・深夜業をさせてはならない。⚠️ 当然に禁止されるのではなく、常に「請求」が起点。\n\n**育児時間（67条）**：生後1年未満の生児を育てる女性は、休憩時間のほか**1日2回各30分以上**、育児のための時間を請求できる。\n\n**生理日の休暇（68条）**：生理日の就業が著しく困難な女性が休暇を請求したときは、その日は就業させてはならない。\n\n## 覚え方のコツ\n\n年少者は「保護は自動発動」（証明書備付け・深夜業禁止などは請求不要）、妊産婦は「保護の多くは本人の請求が起点」（66条の各制限・67条の育児時間・68条の生理休暇はすべて請求ベース）という違いで整理すると混同しにくい。産前産後だけは例外的に「産後8週間は請求なしで一律禁止」という強い保護がかかる点をセットで覚える。\n\n## まとめ3行\n\n1. 最低年齢は「満15歳に達した日以後最初の3/31」まで。深夜業の例外は交替制の満16歳以上男性のみ。\n2. 産前は請求で足りるが、産後6〜8週の早期復帰は請求＋医師の認定が必要（非対称）。\n3. 妊産婦の変形労働時間・時間外休日・深夜業の制限、育児時間、生理休暇はいずれも本人の請求があって初めて発動する。\n\n根拠条文：労働基準法56〜68条 https://laws.e-gov.go.jp/law/322AC0000000049"}, {"no": 7, "subject": "労基", "topic": "解雇・退職", "date": "2026-10-01", "body": "# 第7回 労働基準法「解雇・退職」（労基法19〜23条）\n\n## この法律は何のためにあるか\n解雇は労働者の生活基盤を一瞬で奪う行為です。労基法はクビそのものを禁じる法律ではありませんが、「弱っているときに解雇するな(19条)」「解雇するなら予告しろ(20条)」「辞めた後の証明・金品はきちんと渡せ(22・23条)」という最低限の手続きルールを置き、労働者が転職活動や生活再建の準備をできるようにしています。労働契約の「終わり方」を規律する章です。\n\n## 条文の中身（ここが出る）\n**19条(解雇制限)**：使用者は、①業務上負傷・疾病による療養のための休業期間＋その後30日間、②産前産後の女性が65条により休業する期間＋その後30日間、は解雇できません。⚠️ 例外は2つだけ：打切補償(81条)を支払った場合、または天災事変その他やむを得ない事由で事業継続が不可能になった場合。後者は**行政官庁の認定**を受けなければ例外として扱われません(19条2項)。\n\n**20条(解雇の予告)**：解雇するには少なくとも**30日前に予告**するか、**30日分以上の平均賃金**(解雇予告手当)を支払う必要があります。1日分の平均賃金を支払うごとに予告日数を1日短縮できます。⚠️ この「30日」は19条の解雇制限期間の「30日」とは別物。19条は解雇そのものを禁止する期間、20条は解雇するときの手続き期間です。例外（予告不要）は天災事変等または**労働者の責に帰すべき事由**による解雇で、こちらも行政官庁の認定が必要です。\n\n**21条(予告の適用除外)**：次の4類型は原則20条の適用がありませんが、⚠️一定期間を超えて引き続き使用されると適用される点が最大のひっかけです。\n- 日々雇い入れられる者 → **1箇月**を超えて引き続き使用で適用あり\n- 2箇月以内の期間を定めて使用される者 → **所定の期間**を超えて引き続き使用で適用あり\n- 季節的業務に4箇月以内の期間を定めて使用される者 → **所定の期間**を超えて引き続き使用で適用あり\n- 試の使用期間中の者 → **14日**を超えて引き続き使用で適用あり\n\n**22条(退職時等の証明)**：労働者が退職した場合、使用期間・業務の種類・地位・賃金・退職の事由（解雇ならその理由も）について証明書を請求したら、使用者は**遅滞なく**交付しなければなりません。さらに、解雇予告された日から退職日までの間に解雇理由の証明書を請求された場合も遅滞なく交付義務がありますが、⚠️予告後に労働者が解雇以外の理由で退職した場合は、その退職日以後は交付不要になります。証明書には労働者が請求していない事項を書いてはいけません(ブラックリスト防止)。\n\n**23条(金品の返還)**：労働者の死亡・退職の場合、権利者から請求があれば**7日以内**に賃金を支払い、積立金・保証金・貯蓄金など名称を問わず労働者の権利に属する金品を返還しなければなりません。賃金や金品について争いがある場合でも、異議のない部分は同じ7日以内に支払う義務があります。\n\n## 覚え方のコツ\n「19条＝解雇できない期間（休業＋30日）」「20条＝解雇するときの予告（30日 or 手当）」「21条＝予告除外の4類型と、それぞれ違う足切り日数（1箇月／所定期間／所定期間／14日）」「22条＝証明書は遅滞なく」「23条＝退職時の金品は7日以内」。数字が5種類（30日・30日・1箇月・14日・7日）出てくるので、どの条文のどの数字かをセットで覚えるのがコツです。\n\n## まとめ3行\n- 19条の解雇制限（休業＋30日）と20条の解雇予告（30日前 or 手当）は、どちらも「30日」だが**別の制度**\n- 21条の予告除外4類型は、日雇=1箇月／有期2類型=所定の期間／試用=14日、を超えると適用される\n- 退職時の証明書は**遅滞なく**、金品の返還は**7日以内**\n\n根拠：労基法19〜23条 https://laws.e-gov.go.jp/law/322AC0000000049"}, {"no": 8, "subject": "労基", "topic": "就業規則・監督機関", "date": "2026-10-02", "body": "# 第8回 労働基準法「就業規則・監督機関」\n\n※本日（2026-10-02）はe-Gov法令APIがシステムメンテナンス中のため、条文番号・条文の正確な文言を確認できませんでした。そのため本講は**制度の仕組み**を中心に解説し、具体的な条文番号の明記は避けています（次回API復旧時に条文番号を確定させます）。\n\n## この制度は何のためにあるか\n労働条件は本来、労働者と使用者が個別に合意して決めるものですが、現実には使用者が一方的にルールを定め、労働者は従わざるを得ないことがほとんどです。就業規則は、そうした職場のルールを**文書化して周知**させることで、労使双方にとって「何が決まっているか」を見える化し、場当たり的な不利益変更を防ぐ仕組みです。監督機関は、行政がそのルールが守られているかを事業場に立ち入って確認し、違反があれば是正させる仕組みです。\n\n## 制度の中身（ここが出る）\n**就業規則の作成・届出義務**：常時**10人以上**の労働者を使用する使用者は、就業規則を作成し、所轄の労働基準監督署長に届け出なければなりません。⚠️ この「10人」は事業場単位でカウントし、パート・アルバイトも人数に含みます。本社だけでなく、各事業場ごとに判定する点に注意。\n\n**意見聴取**：就業規則を作成・変更するときは、その事業場に労働者の過半数で組織する労働組合がある場合はその労働組合、なければ労働者の過半数を代表する者の**意見を聴かなければ**なりません。⚠️最大のひっかけ：ここで必要なのは「意見聴取」であって「同意」ではありません。意見書に反対の意見が書かれていても、届出自体は受理されます。\n\n**記載事項（絶対的／相対的）**：\n- 絶対的必要記載事項（必ず定めて記載しなければならない）：始業・終業の時刻、休憩時間、休日、休暇、交替制のルール／賃金の決定・計算・支払方法、締切り・支払時期、昇給に関する事項／退職に関する事項（解雇事由を含む）\n- 相対的必要記載事項（制度を設ける場合にのみ記載すればよい）：退職手当、臨時の賃金（賞与など）、食費・作業用品等の負担、安全衛生、職業訓練、災害補償、表彰・制裁（減給の制裁には上限規制あり）\n⚠️「退職に関する事項」は絶対的記載事項ですが、「退職**手当**に関する事項」は相対的記載事項です。似た言葉で区分が逆のひっかけが作りやすい論点です。\n\n**周知義務と効力**：作成した就業規則は、常時各作業場の見やすい場所への掲示・備え付け、書面の交付、電子的方法での記録・閲覧などにより労働者に**周知**させなければなりません。周知されていない就業規則は、労働者に対して効力を生じないと解されています。また、就業規則で定める基準に達しない労働条件を定める労働契約は、その部分について無効となり、無効となった部分は就業規則の基準によります（最低基準効）。⚠️ただし就業規則自体が法令や労働協約に反する場合は、その反する部分について就業規則の方が無効になります。\n\n**監督機関の体系**：厚生労働大臣 → 都道府県労働局長 → 労働基準監督署長、という系統で行政監督を行います。各事業場での具体的な調査・指導は労働基準監督官が担当し、事業場への臨検（立入調査）、帳簿書類の提出要求、関係者への尋問を行う権限を持ちます。⚠️労働基準監督官は労基法違反の罪について**司法警察官**としての職務（捜査・送検）を行いますが、起訴するかどうかを決めるのは検察官であり、監督官自身に起訴権限はありません。\n\n## 覚え方のコツ\n「10人以上で作成・届出」「意見は聴くが同意は不要」「退職＝絶対、退職手当＝相対」「周知なければ効力なし」「監督官は捜査はするが起訴はしない」という5点セットで押さえると、選択肢の正誤判定がほぼカバーできます。\n\n## まとめ3行\n- 就業規則は常時10人以上の労働者を使用する事業場で作成・届出義務。意見聴取は必須だが同意は不要\n- 絶対的記載事項（退職に関する事項等）と相対的記載事項（退職手当等）の区分、周知されない就業規則は効力なし＝最低基準効とセットで出やすい\n- 監督機関は大臣→労働局長→監督署長の系統。労働基準監督官は臨検・尋問＋司法警察官の職務（捜査まで。起訴は検察官）\n\n根拠：労働基準法（就業規則・監督機関に関する規定）※条文番号は本日のe-Govメンテナンスのため未確認。次回API復旧時に確定します。"}]};

document.getElementById('meta').textContent =
  `毎朝の講義がここに蓄積されます（${LIB.lessons.length}講 収蔵）｜ 更新日: ${LIB.updated}`;

// 簡易Markdown描画(見出し・太字・箇条書きのみ)
function md(src) {
  const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return esc(src)
    .replace(/^# (.+)$/gm, '<h1>$1</h1>')
    .replace(/^## (.+)$/gm, '<h2>$1</h2>')
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/^- (.+)$/gm, '・$1')
    .replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>')
    .replace(/\n\n/g, '<br><br>')
    .replace(/\n/g, '<br>');
}

const listEl = document.getElementById('list');
if (!LIB.lessons.length) {
  listEl.innerHTML = '<div class="empty">まだ講義がありません。明日の朝から1日1講ずつ増えていきます。</div>';
} else {
  let html = '', lastSubject = null;
  LIB.lessons.forEach(l => {
    if (l.subject !== lastSubject) {
      html += `<div class="subject-head">▼ ${l.subject}</div>`;
      lastSubject = l.subject;
    }
    html += `<details${l.no === LIB.lessons.length ? ' open' : ''}>
      <summary><span class="no">第${l.no}回</span>${l.topic}<span class="date">${l.date || ''}</span></summary>
      <div class="body">${md(l.body)}</div>
    </details>`;
  });
  listEl.innerHTML = html;
}
</script>
</body>
</html>
